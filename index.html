<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 10px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .key-group {
      display: flex;
      gap: 6px;
    }
    button {
      padding: 7px 12px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #1e1e1e;
      color: #ccc;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      width: 175px;
      font-size: 0.85rem;
    }
    .meta {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 10px;
    }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr; }
    }
    .panel {
      background: #181818;
      border-radius: 6px;
      padding: 10px;
      border: 1px solid #2a2a2a;
      overflow-x: auto;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2e2e2e;
      padding-bottom: 8px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chain-badge {
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: #242424;
      color: #999;
      border: 1px solid #333;
      white-space: nowrap;
    }
    .chain-active {
      background: rgba(46, 125, 50, 0.25);
      color: #81c784;
      border-color: #388e3c;
    }
    .chain-cooldown {
      background: #b3e5fc;
      color: #01579b;
      border-color: #4fc3f7;
      box-shadow: 0 0 6px rgba(129, 212, 250, 0.45);
    }

    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.3); color: #fff59d; border-color: #fbc02d; }
      50% { background-color: #242424; color: #fdd835; border-color: #665c1e; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(211, 47, 47, 0.45); color: #ffffff; border-color: #ef5350; }
      50% { background-color: #242424; color: #ff5252; border-color: #7f1d1d; }
    }
    .chain-warn-yellow { animation: flashChainYellow 1.6s infinite; }
    .chain-warn-red { animation: flashChainRed 0.65s infinite; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th {
      text-align: left;
      padding: 0 5px 5px 5px;
      color: #777;
      font-weight: 600;
      font-size: 0.76rem;
      border-bottom: 1px solid #2a2a2a;
      white-space: nowrap;
    }
    tbody tr {
      height: 26px;
      background: #181818;
    }
    tbody tr:nth-child(even) {
      background: #202020;
    }
    tbody tr:hover {
      background: #282828;
    }
    td {
      padding: 0 5px;
      height: 26px;
      line-height: 26px;
      white-space: nowrap;
      border: none;
    }
    .player-cell {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      max-width: 155px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-Online { background: #4caf50; box-shadow: 0 0 4px rgba(76, 175, 80, 0.7); }
    .dot-Idle { background: #ff9800; }
    .dot-Offline { background: #555; }
    a.player-link {
      color: #e8e8e8;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a.player-link:hover {
      text-decoration: underline;
      color: #90caf9;
    }
    .last-act {
      font-size: 0.7rem;
      color: #777;
      flex-shrink: 0;
    }

    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: 600; }
    .Jail { color: #ffa726; font-weight: 600; }
    .Traveling, .Abroad { color: #42a5f5; }
    .Fallen { color: #757575; font-style: italic; }

    .timer {
      font-family: monospace;
      font-size: 0.82rem;
      padding: 1px 5px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1.3;
    }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.75); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }

    a.atk-btn {
      background: #7f1d1d;
      color: #e0e0e0;
      padding: 2px 8px;
      border-radius: 3px;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
      line-height: 1.35;
      transition: 0.15s;
    }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }

    @media (max-width: 520px) {
      body { padding: 6px; }
      .panel { padding: 8px; }
      table { font-size: 0.76rem; }
      th { font-size: 0.7rem; padding: 0 3px 4px 3px; }
      td { padding: 0 3px; }
      .player-cell { max-width: 112px; gap: 4px; }
      .timer { font-size: 0.75rem; padding: 1px 3px; }
      a.atk-btn { padding: 2px 6px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta" id="statusBar">Paste a Public API key in the top right and click Load.</div>

  <div class="board">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers [40449]</h2>
        <span class="chain-badge" id="allyChain">Chain: None</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: None</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    let selectedFactionId = 40449;
    let cachedData = { ally: null, enemy: null };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    async function fetchJsonWithFallback(targetUrl) {
      try {
        const directRes = await fetch(targetUrl);
        if (directRes.ok) {
          const data = await directRes.json();
          if (!data.error) return data;
          if (data.error.code && data.error.code !== 0) return data;
        }
      } catch (e) {}

      try {
        const proxy1 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
        const res1 = await fetch(proxy1);
        if (res1.ok) {
          const text1 = await res1.text();
          return JSON.parse(text1);
        }
      } catch (e) {}

      const proxy2 = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl);
      const res2 = await fetch(proxy2);
      if (!res2.ok) throw new Error("Proxy HTTP " + res2.status);
      return await res2.json();
    }

    async function getFactionCombined(id, key) {
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";

      const [v1Data, v2Data] = await Promise.all([
        fetchJsonWithFallback(v1Url),
        fetchJsonWithFallback(v2MembersUrl).catch(() => null)
      ]);

      if (v1Data && v1Data.error) throw new Error(v1Data.error.error);

      if (v2Data && Array.isArray(v2Data.members) && v1Data && v1Data.members) {
        v2Data.members.forEach(m2 => {
          const idStr = String(m2.id);
          if (v1Data.members[idStr] && m2.status) {
            v1Data.members[idStr].status = {
              ...v1Data.members[idStr].status,
              ...m2.status
            };
          }
          if (v1Data.members[idStr] && m2.last_action) {
            v1Data.members[idStr].last_action = m2.last_action;
          }
        });
      }

      return v1Data;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Fetching live war data...";

      try {
        const allyData = await getFactionCombined(selectedFactionId, key);
        cachedData.ally = allyData;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionCombined(enemyId, key);
          cachedData.enemy = enemyData;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
        } else {
          cachedData.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
        }

        updateChainBadges();
        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 20s • Updated " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatShortTimer(sec) {
      if (sec <= 0) return "00:00";
      const h = Math.floor(sec / 3600);
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return h > 0 ? (String(h).padStart(2, "0") + ":" + m + ":" + s) : (m + ":" + s);
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function formatCompactLastAction(lastAction) {
      if (!lastAction) return "";
      const now = Math.floor(Date.now() / 1000);
      const diff = Math.max(0, now - (lastAction.timestamp || now));
      if (diff < 60) return diff + "s";
      if (diff < 3600) return Math.floor(diff / 60) + "m";
      if (diff < 86400) return Math.floor(diff / 3600) + "h";
      return Math.floor(diff / 86400) + "d";
    }

    function renderSingleChainBadge(factionData, badgeId, isAlly) {
      const el = document.getElementById(badgeId);
      if (!factionData || !factionData.chain) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        return;
      }

      const c = factionData.chain;
      const now = Math.floor(Date.now() / 1000);
      const current = c.current || 0;
      const max = c.max || 0;

      if (c.cooldown && c.cooldown > 0) {
        const cdLeft = c.end ? Math.max(0, (c.end + c.cooldown) - now) : c.cooldown;
        if (cdLeft > 0) {
          el.textContent = "Chain: " + current + " (CD " + formatShortTimer(cdLeft) + ")";
          el.className = "chain-badge chain-cooldown";
          return;
        }
      }

      if (current > 0 && c.end && c.end > now) {
        const timeLeft = c.end - now;
        el.textContent = "Chain: " + current + "/" + max + " (" + formatShortTimer(timeLeft) + ")";
        let cls = "chain-badge chain-active";
        if (isAlly) {
          if (timeLeft <= 60) {
            cls = "chain-badge chain-warn-red";
          } else if (timeLeft <= 150) {
            cls = "chain-badge chain-warn-yellow";
          }
        }
        el.className = cls;
        return;
      }

      el.textContent = "Chain: None";
      el.className = "chain-badge";
    }

    function updateChainBadges() {
      renderSingleChainBadge(cachedData.ally, "allyChain", true);
      renderSingleChainBadge(cachedData.enemy, "enemyChain", false);
    }

    function mapCountryCode(text) {
      if (!text) return null;
      const t = text.toLowerCase();
      if (t.includes("torn")) return "TC";
      if (t.includes("mexico") || t.includes("mexican")) return "MEX";
      if (t.includes("cayman")) return "CAY";
      if (t.includes("canada") || t.includes("canadian")) return "CAN";
      if (t.includes("hawaii")) return "HAW";
      if (t.includes("united kingdom") || t.includes("british") || t.includes("uk")) return "UK";
      if (t.includes("argentin")) return "ARG";
      if (t.includes("switzerland") || t.includes("swiss")) return "SWI";
      if (t.includes("japan")) return "JAP";
      if (t.includes("china") || t.includes("chinese")) return "CHI";
      if (t.includes("uae") || t.includes("emirates") || t.includes("emirati") || t.includes("dubai")) return "UAE";
      if (t.includes("south africa")) return "SA";
      return null;
    }

    function parseMemberLocationInfo(status) {
      const state = status.state || "Okay";
      const desc = status.description || "";
      const details = status.details || "";
      const combined = (desc + " " + details).trim();

      if (state === "Fallen") {
        return { text: "Fallen", tier: 5, sortKey: "zzz" };
      }

      if (state === "Hospital") {
        const code = mapCountryCode(combined) || "TC";
        return { text: "Hosp (" + code + ")", tier: 1, sortKey: code };
      }

      if (state === "Jail") {
        const code = mapCountryCode(combined) || "TC";
        return { text: "Jail (" + code + ")", tier: 1, sortKey: code };
      }

      if (state === "Traveling") {
        const lower = combined.toLowerCase();
        // Match explicit "from X to Y"
        const fromToMatch = lower.match(/from\s+([a-z\s]+?)\s+to\s+([a-z\s]+)/);
        if (fromToMatch) {
          const fromCode = mapCountryCode(fromToMatch[1]) || "TC";
          const toCode = mapCountryCode(fromToMatch[2]) || "TC";
          const route = fromCode + " > " + toCode;
          return { text: route, tier: 2, sortKey: route };
        }
        // Match returning to Torn from X
        if (lower.includes("returning to torn")) {
          const fromMatch = lower.match(/from\s+([a-z\s]+)/);
          const fromCode = fromMatch ? (mapCountryCode(fromMatch[1]) || "ABROAD") : "ABROAD";
          const route = fromCode + " > TC";
          return { text: route, tier: 2, sortKey: route };
        }
        // Match traveling to X
        const toMatch = lower.match(/to\s+([a-z\s]+)/);
        if (toMatch) {
          const toCode = mapCountryCode(toMatch[1]);
          if (toCode) {
            const route = toCode === "TC" ? "ABROAD > TC" : ("TC > " + toCode);
            return { text: route, tier: 2, sortKey: route };
          }
        }
        const fallbackCode = mapCountryCode(combined);
        if (fallbackCode && fallbackCode !== "TC") {
          const route = "TC > " + fallbackCode;
          return { text: route, tier: 2, sortKey: route };
        }
        return { text: "Traveling", tier: 2, sortKey: "ZZZ" };
      }

      if (state === "Abroad") {
        const code = mapCountryCode(combined) || "ABROAD";
        return { text: "Okay (" + code + ")", tier: 3, sortKey: code };
      }

      if (state === "Okay") {
        const code = mapCountryCode(combined);
        if (code && code !== "TC") {
          return { text: "Okay (" + code + ")", tier: 3, sortKey: code };
        }
        return { text: "Okay (TC)", tier: 4, sortKey: "TC" };
      }

      return { text: state, tier: 4, sortKey: state };
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diffSeconds) {
      if (state === "Fallen") return false;
      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => {
        const loc = parseMemberLocationInfo(m.status);
        return { id, ...m, loc };
      });

      members.sort((a, b) => {
        if (a.loc.tier !== b.loc.tier) return a.loc.tier - b.loc.tier;
        if (a.loc.tier === 1) {
          const untilA = a.status.until || 9999999999;
          const untilB = b.status.until || 9999999999;
          if (untilA !== untilB) return untilA - untilB;
        }
        if (a.loc.tier === 2 || a.loc.tier === 3) {
          const cmp = a.loc.sortKey.localeCompare(b.loc.sortKey);
          if (cmp !== 0) return cmp;
        }
        return a.name.localeCompare(b.name);
      });

      tbody.innerHTML = members.map(m => {
        const until = m.status.until || 0;
        const diff = until > 0 ? until - now : 0;
        const isTimedState = (m.status.state === "Hospital" || m.status.state === "Jail");
        const timerText = (isTimedState && until > 0) ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(m.status.state, diff);
        const readyClass = isAttackReady(m.status.state, diff) ? " atk-ready" : "";

        const onlineState = (m.last_action && m.last_action.status) ? m.last_action.status : "Offline";
        const lastActShort = formatCompactLastAction(m.last_action);

        const actionCell = m.status.state === "Fallen"
          ? '<td style="color:#666;">-</td>'
          : '<td><a class="atk-btn' + readyClass + '" data-state="' + m.status.state + '" data-until="' + until + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a></td>';

        return '<tr>' +
          '<td><div class="player-cell">' +
            '<span class="status-dot dot-' + onlineState + '" title="' + onlineState + '"></span>' +
            '<a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a>' +
            (lastActShort ? '<span class="last-act">' + lastActShort + '</span>' : '') +
          '</div></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.status.state + '">' + m.loc.text + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + m.status.state + '" data-until="' + until + '">' + timerText + '</span></td>' +
          actionCell +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);

      updateChainBadges();

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if ((state === "Hospital" || state === "Jail") && until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });
    }, 1000);

    setInterval(fetchWarData, 20000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
