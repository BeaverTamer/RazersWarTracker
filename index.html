<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .key-group { display: flex; gap: 8px; }
    button { padding: 10px 18px; border: 1px solid #333; border-radius: 6px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: 0.15s; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input { padding: 9px 12px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 220px; }
    .meta { font-size: 0.85rem; color: #999; margin-bottom: 16px; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .board { grid-template-columns: 1fr; } }
    .panel { background: #1a1a1a; border-radius: 8px; padding: 16px; border: 1px solid #2c2c2c; }
    h2 { margin-top: 0; font-size: 1.15rem; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    .chain-badge { font-size: 0.85rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: #252525; border: 1px solid #383838; color: #bbb; font-family: monospace; }
    .chain-active { background: rgba(46, 125, 50, 0.25); border-color: #4caf50; color: #a5d6a7; }
    .chain-low { animation: flashRed 0.8s infinite; border-color: #ef5350; }
    .chain-cooldown { background: rgba(66, 165, 245, 0.2); border-color: #42a5f5; color: #90caf9; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #262626; }
    th { color: #888; font-weight: 600; }
    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: bold; }
    .Jail { color: #ffa726; font-weight: bold; }
    .Traveling, .Abroad { color: #42a5f5; font-weight: 600; }
    .timer { font-family: monospace; font-size: 0.95rem; padding: 2px 6px; border-radius: 4px; }
    a.player-link { color: #fff; text-decoration: none; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }
    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: bold; display: inline-block; transition: 0.15s; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    a.ally-atk-btn { background: #4a3511; color: #ffe082; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: bold; display: inline-block; transition: 0.15s; }
    a.ally-atk-btn:hover { background: #7c5817; color: #fff; }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 8px rgba(76, 175, 80, 0.8); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }
    @keyframes flashAllyReady {
      0%, 100% { background-color: #ef6c00; color: #ffffff; box-shadow: 0 0 8px rgba(255, 152, 0, 0.8); }
      50% { background-color: #8d4000; color: #ffe0b2; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }
    .ally-ready { animation: flashAllyReady 1.5s infinite; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Paste Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta" id="statusBar">Paste a Public API key in the top right and click Load.</div>

  <div class="board">
    <div class="panel">
      <h2>
        <span id="allyTitle">Razers [40449]</span>
        <span id="allyChain" class="chain-badge">Chain: -</span>
      </h2>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>
        <span id="enemyTitle">Warring Opponent</span>
        <span id="enemyChain" class="chain-badge">Chain: -</span>
      </h2>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    let selectedFactionId = 40449;
    let cachedData = { ally: null, enemy: null };
    let chainState = { ally: null, enemy: null };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    async function fetchJsonWithFallback(tornUrl) {
      const attempts = [
        tornUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(tornUrl),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl)
      ];

      let lastErr = null;
      for (const targetUrl of attempts) {
        try {
          const res = await fetch(targetUrl);
          if (!res.ok) {
            lastErr = new Error("HTTP " + res.status);
            continue;
          }
          const text = await res.text();
          const data = JSON.parse(text);
          if (data.error) throw new Error(data.error.error);
          return data;
        } catch (err) {
          lastErr = err;
          if (err.message && (err.message.includes("Incorrect key") || err.message.includes("Access level") || err.message.includes("Too many requests"))) {
            throw err;
          }
        }
      }
      throw lastErr || new Error("Unable to reach Torn API");
    }

    async function getFactionWithChain(id, key) {
      const tornUrl = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      return await fetchJsonWithFallback(tornUrl);
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function formatShortTime(sec) {
      if (sec <= 0) return "00:00";
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function parseChainData(factionData) {
      if (!factionData || !factionData.chain) return null;
      const c = factionData.chain;
      const fetchedAt = Math.floor(Date.now() / 1000);
      return {
        current: c.current || 0,
        max: c.max || 0,
        timeout: c.timeout || 0,
        cooldown: c.cooldown || 0,
        fetchedAt: fetchedAt
      };
    }

    function renderChainBadge(chainObj, elementId) {
      const el = document.getElementById(elementId);
      if (!chainObj) {
        el.textContent = "Chain: -";
        el.className = "chain-badge";
        return;
      }

      const elapsed = Math.floor(Date.now() / 1000) - chainObj.fetchedAt;

      if (chainObj.cooldown > 0) {
        const remCd = Math.max(0, chainObj.cooldown - elapsed);
        const h = Math.floor(remCd / 3600);
        const m = String(Math.floor((remCd % 3600) / 60)).padStart(2, "0");
        const s = String(remCd % 60).padStart(2, "0");
        const cdStr = h > 0 ? (h + ":" + m + ":" + s) : (m + ":" + s);
        el.textContent = "Chain: " + chainObj.current + " (CD " + cdStr + ")";
        el.className = "chain-badge chain-cooldown";
        return;
      }

      if (chainObj.current > 0 && chainObj.timeout > 0) {
        const remTimeout = Math.max(0, chainObj.timeout - elapsed);
        el.textContent = "Chain: " + chainObj.current + "/" + chainObj.max + " (" + formatShortTime(remTimeout) + ")";
        if (remTimeout > 0 && remTimeout <= 60) {
          el.className = "chain-badge chain-low";
        } else {
          el.className = "chain-badge chain-active";
        }
        return;
      }

      el.textContent = "Chain: 0";
      el.className = "chain-badge";
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Fetching data for Faction " + selectedFactionId + "...";

      try {
        const allyData = await getFactionWithChain(selectedFactionId, key);
        cachedData.ally = allyData;
        chainState.ally = parseChainData(allyData);
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";
        renderChainBadge(chainState.ally, "allyChain");

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionWithChain(enemyId, key);
          cachedData.enemy = enemyData;
          chainState.enemy = parseChainData(enemyData);
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
          renderChainBadge(chainState.enemy, "enemyChain");
        } else {
          cachedData.enemy = null;
          chainState.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
          renderChainBadge(null, "enemyChain");
        }

        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 20s • Last updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getCityCode(text) {
      if (!text) return "TC";
      const t = text.toLowerCase();
      if (t.includes("mexico") || t.includes("mexican")) return "MEX";
      if (t.includes("cayman")) return "CAY";
      if (t.includes("canada") || t.includes("canadian")) return "CAN";
      if (t.includes("hawaii")) return "HAW";
      if (t.includes("united kingdom") || t.includes("british") || t.includes("uk")) return "UK";
      if (t.includes("argentina") || t.includes("argentinian")) return "ARG";
      if (t.includes("switzerland") || t.includes("swiss")) return "SWI";
      if (t.includes("japan") || t.includes("japanese")) return "JAP";
      if (t.includes("china") || t.includes("chinese")) return "CHI";
      if (t.includes("uae") || t.includes("emirates") || t.includes("emirati") || t.includes("dubai")) return "UAE";
      if (t.includes("south africa") || t.includes("south african")) return "SA";
      if (t.includes("torn")) return "TC";
      return "TC";
    }

    function formatDetailedStatus(statusObj) {
      if (!statusObj) return "-";
      const state = statusObj.state || "";
      const desc = statusObj.description || "";

      if (state === "Hospital") {
        const code = getCityCode(desc);
        return "Hosp (" + code + ")";
      }

      if (state === "Traveling") {
        const destCode = getCityCode(desc);
        if (desc.toLowerCase().includes("returning to torn")) {
          const fromPart = desc.split(/from/i)[1] || "";
          const originCode = getCityCode(fromPart);
          return originCode + " > TC";
        }
        return "TC > " + destCode;
      }

      if (state === "Abroad") {
        return getCityCode(desc);
      }

      return state;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diffSeconds) {
      if (state === "Okay") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId, isEnemy) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => ({ id, ...m }));
      members.sort((a, b) => (a.status.until || 9999999999) - (b.status.until || 9999999999));

      tbody.innerHTML = members.map(m => {
        const until = m.status.until || 0;
        const diff = until > 0 ? until - now : 0;
        const timerText = until > 0 ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(m.status.state, diff);
        const ready = isAttackReady(m.status.state, diff);
        const statusDisplay = formatDetailedStatus(m.status);

        const btnBaseClass = isEnemy ? "atk-btn" : "ally-atk-btn";
        const readyClass = ready ? (isEnemy ? " atk-ready" : " ally-ready") : "";

        const atkCol = '<td><a class="' + btnBaseClass + readyClass + '" data-enemy="' + (isEnemy ? "1" : "0") + '" data-state="' + m.status.state + '" data-until="' + until + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a></td>';

        return '<tr>' +
          '<td><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.status.state + '">' + statusDisplay + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + m.status.state + '" data-until="' + until + '">' + timerText + '</span></td>' +
          atkCol +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody", false);
      renderRoster(cachedData.enemy, "enemyBody", true);
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);

      renderChainBadge(chainState.ally, "allyChain");
      renderChainBadge(chainState.enemy, "enemyChain");

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
        }
      });

      document.querySelectorAll(".atk-btn, .ally-atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const isEnemy = btn.dataset.enemy === "1";
        const readyClass = isEnemy ? "atk-ready" : "ally-ready";
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff)) {
          btn.classList.add(readyClass);
        } else {
          btn.classList.remove(readyClass);
        }
      });
    }, 1000);

    setInterval(fetchWarData, 20000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
```
