<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 10px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .key-group { display: flex; gap: 6px; }
    button { padding: 6px 12px; border: 1px solid #333; border-radius: 5px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.15s; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input { padding: 6px 10px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 175px; font-size: 0.85rem; }
    .meta-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: 0.78rem; color: #999; margin-bottom: 10px; }
    .loc-badge { background: #1e293b; color: #93c5fd; border: 1px solid #334155; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-family: monospace; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 820px) { .board { grid-template-columns: 1fr; } }
    .panel { background: #181818; border-radius: 6px; padding: 10px; border: 1px solid #2a2a2a; overflow-x: auto; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2e2e2e; padding-bottom: 6px; margin-bottom: 4px; gap: 8px; flex-wrap: wrap; }
    .panel-header h2 { margin: 0; font-size: 1rem; white-space: nowrap; }
    .chain-badge { font-family: monospace; font-size: 0.78rem; padding: 2px 7px; border-radius: 4px; background: #252525; color: #aaa; border: 1px solid #383838; font-weight: 600; white-space: nowrap; }
    .chain-active { background: rgba(46, 125, 50, 0.25); color: #81c784; border-color: #2e7d32; }
    .chain-cooldown { background-color: #b3e5fc; color: #01579b; border-color: #81d4fa; box-shadow: 0 0 6px rgba(179, 229, 252, 0.45); }
    .chain-warn-yellow { animation: flashChainYellow 1.5s infinite; }
    .chain-warn-red { animation: flashChainRed 0.65s infinite; }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; table-layout: fixed; }
    th, td { text-align: left; padding: 0 4px; height: 26px; line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th { color: #888; font-weight: 600; border-bottom: 1px solid #2a2a2a; height: 24px; line-height: 24px; font-size: 0.75rem; }
    
    col.col-player { width: 38%; }
    col.col-lvl { width: 9%; }
    col.col-status { width: 23%; }
    col.col-timer { width: 16%; }
    col.col-action { width: 14%; }

    tbody tr { height: 26px; }
    tbody tr:nth-child(odd) { background-color: #181818; }
    tbody tr:nth-child(even) { background-color: #202020; }
    tbody tr:hover { background-color: #2a2a2a; }

    .player-cell { display: flex; align-items: center; gap: 5px; height: 26px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .dot-Online { background-color: #4caf50; box-shadow: 0 0 4px rgba(76, 175, 80, 0.6); }
    .dot-Idle { background-color: #ff9800; }
    .dot-Offline { background-color: #555555; }
    a.player-link { color: #f0f0f0; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }
    .last-act { color: #777; font-size: 0.72rem; flex-shrink: 0; }

    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: 600; }
    .Jail { color: #ffa726; font-weight: 600; }
    .Traveling, .Abroad { color: #42a5f5; }
    .Fallen { color: #616161; font-style: italic; }
    .timer { font-family: monospace; font-size: 0.8rem; padding: 1px 4px; border-radius: 3px; display: inline-block; line-height: 18px; }
    
    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 0 6px; height: 20px; line-height: 20px; border-radius: 3px; text-decoration: none; font-size: 0.72rem; font-weight: bold; display: inline-block; text-align: center; transition: 0.15s; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    .no-atk { color: #555; font-size: 0.78rem; padding-left: 8px; }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.8); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }
    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.32); color: #fff59d; border-color: #fdd835; }
      50% { background-color: #252525; color: #fdd835; border-color: #665c1e; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(211, 47, 47, 0.55); color: #ffffff; border-color: #ff5252; }
      50% { background-color: #252525; color: #ff8a80; border-color: #7f1d1d; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }

    @media (max-width: 480px) {
      body { padding: 6px; }
      .panel { padding: 8px; }
      button { padding: 5px 9px; font-size: 0.8rem; }
      input { width: 145px; font-size: 0.8rem; }
      table { font-size: 0.74rem; }
      th, td { padding: 0 3px; }
      .timer { font-size: 0.73rem; padding: 1px 3px; }
      a.atk-btn { padding: 0 5px; font-size: 0.68rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta-bar">
    <span id="statusBar">Paste a Public API key in the top right and click Load.</span>
    <span class="loc-badge" id="myLocBadge">Your Location: --</span>
  </div>

  <div class="board">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers</h2>
        <span class="chain-badge" id="allyChain">Chain: --</span>
      </div>
      <table>
        <colgroup>
          <col class="col-player" />
          <col class="col-lvl" />
          <col class="col-status" />
          <col class="col-timer" />
          <col class="col-action" />
        </colgroup>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: --</span>
      </div>
      <table>
        <colgroup>
          <col class="col-player" />
          <col class="col-lvl" />
          <col class="col-status" />
          <col class="col-timer" />
          <col class="col-action" />
        </colgroup>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const CITY_CODES = [
      { keys: ["torn city", "torn"], code: "TC" },
      { keys: ["mexico", "mexican"], code: "MEX" },
      { keys: ["cayman islands", "caymanian", "cayman"], code: "CAY" },
      { keys: ["canada", "canadian"], code: "CAN" },
      { keys: ["hawaii", "hawaiian"], code: "HAW" },
      { keys: ["united kingdom", "british", "uk"], code: "UK" },
      { keys: ["argentina", "argentinian"], code: "ARG" },
      { keys: ["switzerland", "swiss"], code: "SWI" },
      { keys: ["japan", "japanese"], code: "JAP" },
      { keys: ["china", "chinese"], code: "CHI" },
      { keys: ["united arab emirates", "emirati", "uae"], code: "UAE" },
      { keys: ["south africa", "south african"], code: "SA" }
    ];

    const savedFacId = Number(localStorage.getItem("torn_selected_faction"));
    let selectedFactionId = OUR_FACTIONS.some(f => f.id === savedFacId) ? savedFacId : 40449;
    let cachedData = { ally: null, enemy: null };
    let myLocationCode = "TC";
    const RELEASE_GRACE_SEC = 8;

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        localStorage.setItem("torn_selected_faction", String(fac.id));
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    function mapCityCode(text) {
      if (!text) return null;
      const lower = text.toLowerCase();
      for (const entry of CITY_CODES) {
        for (const k of entry.keys) {
          if (k === "uk" || k === "uae" || k === "tc" || k === "sa") {
            const regex = new RegExp("\b" + k + "\b", "i");
            if (regex.test(lower)) return entry.code;
          } else if (lower.includes(k)) {
            return entry.code;
          }
        }
      }
      return null;
    }

    function formatShortLastAction(lastAction) {
      if (!lastAction || !lastAction.timestamp) return "";
      const diff = Math.max(0, Math.floor(Date.now() / 1000) - Number(lastAction.timestamp));
      if (diff < 60) return diff + "s";
      const mins = Math.floor(diff / 60);
      if (mins < 60) return mins + "m";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "h";
      const days = Math.floor(hrs / 24);
      return days + "d";
    }

    function parseMemberLocation(status) {
      if (!status) return "TC";
      const state = status.state || "Okay";
      const desc = status.description || "";
      const details = status.details || "";
      const combined = (desc + " " + details).trim();

      if (state === "Traveling") return "Traveling";
      if (state === "Fallen") return "Fallen";

      const explicitCode = mapCityCode(combined);
      if (explicitCode) return explicitCode;

      if (state === "Abroad") return "Abroad";
      return "TC";
    }

    function formatMemberStatus(status) {
      if (!status) return "Okay (TC)";
      const state = status.state || "Okay";
      const desc = status.description || "";
      const details = status.details || "";
      const combined = (desc + " " + details).trim();

      if (state === "Fallen") return "Fallen";

      if (state === "Hospital") {
        const code = mapCityCode(combined) || "TC";
        return "Hosp (" + code + ")";
      }

      if (state === "Jail") {
        const code = mapCityCode(combined) || "TC";
        return "Jail (" + code + ")";
      }

      if (state === "Traveling") {
        const lower = combined.toLowerCase();

        const fromToMatch = lower.match(/from\s+([a-z\s]+?)\s+to\s+([a-z\s]+?)(?:$|\.|,|\s+in\s|\s+for\s)/);
        if (fromToMatch) {
          const fromCode = mapCityCode(fromToMatch[1]) || "TC";
          const toCode = mapCityCode(fromToMatch[2]) || "TC";
          return fromCode + " > " + toCode;
        }

        if (lower.includes("returning to torn")) {
          const fromMatch = lower.match(/from\s+([a-z\s]+?)(?:$|\.|,|\s+in\s|\s+for\s)/);
          const fromCode = fromMatch ? mapCityCode(fromMatch[1]) : null;
          if (fromCode && fromCode !== "TC") return fromCode + " > TC";
          const anyOther = mapCityCode(lower.replace("returning to torn", ""));
          return (anyOther || "Abroad") + " > TC";
        }

        const toMatch = lower.match(/to\s+([a-z\s]+?)(?:$|\.|,|\s+in\s|\s+for\s)/);
        if (toMatch) {
          const toCode = mapCityCode(toMatch[1]);
          if (toCode && toCode !== "TC") return "TC > " + toCode;
        }

        const destCode = mapCityCode(combined);
        if (destCode && destCode !== "TC") return "TC > " + destCode;
        return "Traveling";
      }

      if (state === "Abroad") {
        const code = mapCityCode(combined);
        return code ? "Okay (" + code + ")" : "Okay (Abroad)";
      }

      if (state === "Okay") {
        const code = mapCityCode(combined) || "TC";
        return "Okay (" + code + ")";
      }

      return state;
    }

    async function fetchTornEndpoint(endpointPath, key) {
      const sep = endpointPath.includes("?") ? "&" : "?";
      const tornUrl = "https://api.torn.com/" + endpointPath + sep + "key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";

      const attempts = [
        async () => {
          const res = await fetch(tornUrl);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        },
        async () => {
          const res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(tornUrl));
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        },
        async () => {
          const res = await fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl));
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        }
      ];

      let lastErr = null;
      for (const attempt of attempts) {
        try {
          const data = await attempt();
          if (data && data.error) throw new Error(data.error.error);
          if (data) return data;
        } catch (err) {
          lastErr = err;
          if (err.message && (err.message.includes("key") || err.message.includes("limit") || err.message.includes("Incorrect"))) {
            throw err;
          }
        }
      }
      throw lastErr || new Error("Unable to reach Torn API");
    }

    async function getMyLocation(key) {
      try {
        const userData = await fetchTornEndpoint("user/?selections=basic", key);
        if (userData && userData.status) {
          const loc = parseMemberLocation(userData.status);
          myLocationCode = loc;
          document.getElementById("myLocBadge").textContent = "Your Location: " + loc;
        }
      } catch (e) {
      }
    }

    async function getFactionFull(id, key) {
      const v1Data = await fetchTornEndpoint("faction/" + id + "?selections=basic,chain", key);

      try {
        const v2Data = await fetchTornEndpoint("v2/faction/" + id + "/members", key);
        if (v2Data && Array.isArray(v2Data.members) && v1Data.members) {
          v2Data.members.forEach(m2 => {
            const m1 = v1Data.members[String(m2.id)];
            if (m1 && m2.status) {
              if (m2.status.description) m1.status.description = m2.status.description;
              if (m2.status.details) m1.status.details = m2.status.details;
              if (m2.status.state) m1.status.state = m2.status.state;
              if (typeof m2.status.until === "number") m1.status.until = m2.status.until;
            }
          });
        }
      } catch (e) {
      }

      return v1Data;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function formatShortTime(sec) {
      if (sec <= 0) return "00:00";
      const h = Math.floor(sec / 3600);
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return h > 0 ? (h + ":" + m + ":" + s) : (m + ":" + s);
    }

    function updateChainBadge(elId, chainObj, isAlly) {
      const el = document.getElementById(elId);
      if (!chainObj || (!chainObj.current && !chainObj.cooldown)) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        el.dataset.end = "0";
        el.dataset.mode = "none";
        el.dataset.current = "0";
        el.dataset.max = "0";
        el.dataset.ally = isAlly ? "1" : "0";
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      el.dataset.ally = isAlly ? "1" : "0";

      if (chainObj.cooldown && chainObj.cooldown > 0) {
        const endUnix = chainObj.end ? Number(chainObj.end) : (now + Number(chainObj.cooldown));
        const rem = Math.max(0, endUnix - now);
        el.dataset.mode = "cooldown";
        el.dataset.end = String(endUnix);
        el.dataset.current = String(chainObj.current || 0);
        el.dataset.max = String(chainObj.max || 0);
        el.textContent = "Chain: " + (chainObj.current || 0) + " (CD " + formatShortTime(rem) + ")";
        el.className = "chain-badge chain-cooldown";
        return;
      }

      const timeoutRem = Number(chainObj.timeout || 0);
      const endUnix = now + timeoutRem;
      el.dataset.mode = "active";
      el.dataset.end = String(endUnix);
      el.dataset.current = String(chainObj.current || 0);
      el.dataset.max = String(chainObj.max || 0);
      renderChainTick(el, now);
    }

    function renderChainTick(el, now) {
      const mode = el.dataset.mode;
      if (!mode || mode === "none") return;
      const endUnix = Number(el.dataset.end || 0);
      const rem = Math.max(0, endUnix - now);
      const cur = el.dataset.current || "0";
      const max = el.dataset.max || "0";
      const isAlly = el.dataset.ally === "1";

      if (mode === "cooldown") {
        el.textContent = "Chain: " + cur + " (CD " + formatShortTime(rem) + ")";
        el.className = "chain-badge chain-cooldown";
      } else {
        el.textContent = "Chain: " + cur + "/" + max + " (" + formatShortTime(rem) + ")";
        let warnClass = "chain-badge chain-active";
        if (isAlly && rem > 0) {
          if (rem < 60) {
            warnClass += " chain-warn-red";
          } else if (rem < 150) {
            warnClass += " chain-warn-yellow";
          }
        } else if (!isAlly && rem > 0 && rem <= 60) {
          warnClass += " chain-warn-red";
        }
        el.className = warnClass;
      }
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Syncing live war data...";

      try {
        await getMyLocation(key);

        const allyData = await getFactionFull(selectedFactionId, key);
        cachedData.ally = allyData;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";
        updateChainBadge("allyChain", allyData.chain, true);

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionFull(enemyId, key);
          cachedData.enemy = enemyData;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
          updateChainBadge("enemyChain", enemyData.chain, false);
        } else {
          cachedData.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
          updateChainBadge("enemyChain", null, false);
        }

        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 15s • Updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isSameLocation(targetLoc) {
      if (!myLocationCode || myLocationCode === "Traveling" || myLocationCode === "Fallen") return false;
      if (!targetLoc || targetLoc === "Traveling" || targetLoc === "Fallen") return false;
      return myLocationCode === targetLoc;
    }

    function isAttackReady(state, diffSeconds, targetLoc) {
      if (state === "Fallen") return false;
      if (!isSameLocation(targetLoc)) return false;
      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function getSortGroup(m, formattedStatus, now) {
      const state = m.status.state || "Okay";
      const until = Number(m.status.until || 0);
      const isTimed = (state === "Hospital" || state === "Jail");
      const hasActiveGrace = isTimed && until > 0 && (now - until) <= RELEASE_GRACE_SEC;

      if (state === "Fallen") return 5;
      if (isTimed && (until === 0 || hasActiveGrace)) return 1;
      if (state === "Traveling") return 2;
      if (state === "Abroad" || (state === "Okay" && formattedStatus !== "Okay (TC)")) return 3;
      return 4;
    }

    function sortMembers(members, now) {
      return members.sort((a, b) => {
        const statusA = formatMemberStatus(a.status);
        const statusB = formatMemberStatus(b.status);
        const groupA = getSortGroup(a, statusA, now);
        const groupB = getSortGroup(b, statusB, now);

        if (groupA !== groupB) return groupA - groupB;

        if (groupA === 1) {
          const untilA = a.status.until || 9999999999;
          const untilB = b.status.until || 9999999999;
          if (untilA !== untilB) return untilA - untilB;
          return a.name.localeCompare(b.name);
        }

        if (groupA === 2 || groupA === 3) {
          const cmp = statusA.localeCompare(statusB);
          if (cmp !== 0) return cmp;
          return a.name.localeCompare(b.name);
        }

        return a.name.localeCompare(b.name);
      });
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const rawMembers = Object.entries(factionData.members).map(([id, m]) => ({ id, ...m }));
      const members = sortMembers(rawMembers, now);

      tbody.innerHTML = members.map(m => {
        const state = m.status.state || "Okay";
        const isFallen = state === "Fallen";
        const until = Number(m.status.until || 0);
        const isTimed = (state === "Hospital" || state === "Jail");
        const isReleasedPastGrace = isTimed && until > 0 && (now - until) > RELEASE_GRACE_SEC;

        const targetLoc = parseMemberLocation(m.status);
        const effectiveState = isReleasedPastGrace ? (targetLoc === "TC" ? "Okay" : "Abroad") : state;
        const displayStatus = isReleasedPastGrace ? ("Okay (" + targetLoc + ")") : formatMemberStatus(m.status);

        const diff = (isTimed && until > 0 && !isReleasedPastGrace) ? Math.max(0, until - now) : 0;
        const timerText = (isTimed && until > 0 && !isReleasedPastGrace) ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(effectiveState, diff);
        const readyClass = isAttackReady(effectiveState, diff, targetLoc) ? " atk-ready" : "";

        const dotState = m.last_action && m.last_action.status ? m.last_action.status : "Offline";
        const shortAct = formatShortLastAction(m.last_action);
        const actHtml = shortAct ? '<span class="last-act" data-ts="' + m.last_action.timestamp + '">' + shortAct + '</span>' : '';

        const actionCell = isFallen
          ? '<td><span class="no-atk">-</span></td>'
          : '<td><a class="atk-btn' + readyClass + '" data-state="' + effectiveState + '" data-until="' + (isReleasedPastGrace ? 0 : until) + '" data-loc="' + targetLoc + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a></td>';

        return '<tr>' +
          '<td><div class="player-cell"><span class="status-dot dot-' + dotState + '"></span><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a>' + actHtml + '</div></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + effectiveState + '">' + displayStatus + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + effectiveState + '" data-until="' + (isReleasedPastGrace ? 0 : until) + '" data-loc="' + targetLoc + '">' + timerText + '</span></td>' +
          actionCell +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      let needsResort = false;

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if ((state === "Hospital" || state === "Jail") && until > 0) {
          const elapsedSinceRelease = now - until;
          if (elapsedSinceRelease > RELEASE_GRACE_SEC) {
            needsResort = true;
          } else {
            const diff = Math.max(0, until - now);
            el.textContent = formatCountdown(diff);
            el.className = "timer " + getTimerAlertClass(state, diff);
          }
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const loc = btn.dataset.loc;
        const diff = until > 0 ? Math.max(0, until - now) : 0;
        if (isAttackReady(state, diff, loc)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });

      document.querySelectorAll(".last-act").forEach(el => {
        const ts = Number(el.dataset.ts);
        if (ts > 0) {
          el.textContent = formatShortLastAction({ timestamp: ts });
        }
      });

      renderChainTick(document.getElementById("allyChain"), now);
      renderChainTick(document.getElementById("enemyChain"), now);

      if (needsResort && (cachedData.ally || cachedData.enemy)) {
        renderTables();
      }
    }, 1000);

    setInterval(fetchWarData, 15000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
