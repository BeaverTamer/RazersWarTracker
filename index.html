<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 10px 12px;
      touch-action: pan-y;
      overflow-x: hidden;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .key-group { display: flex; gap: 6px; }
    button {
      padding: 6px 12px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #1e1e1e;
      color: #ccc;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      width: 175px;
      font-size: 0.84rem;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 10px;
    }
    .loc-badge {
      background: #1e242b;
      border: 1px solid #323c47;
      color: #90caf9;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 820px) {
      .board { grid-template-columns: 1fr; gap: 10px; }
    }
    .panel {
      background: #181818;
      border-radius: 6px;
      padding: 10px 10px 8px 10px;
      border: 1px solid #2a2a2a;
      min-width: 0;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2b2b2b;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Chain Badge Styling */
    .chain-badge {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      background: #232323;
      color: #999;
      border: 1px solid #333;
      white-space: nowrap;
    }
    .chain-active {
      background: rgba(46, 125, 50, 0.22);
      color: #81c784;
      border-color: #388e3c;
    }
    .chain-cooldown {
      background-color: #b3e5fc;
      color: #01579b;
      border-color: #4fc3f7;
      box-shadow: 0 0 6px rgba(179, 229, 252, 0.35);
    }
    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.3); color: #fff59d; border-color: #fbc02d; }
      50% { background-color: #232323; color: #fdd835; border-color: #555; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(211, 47, 47, 0.55); color: #ffffff; border-color: #ff5252; }
      50% { background-color: #232323; color: #ff5252; border-color: #555; }
    }
    .chain-warn-yellow { animation: flashChainYellow 1.5s infinite; }
    .chain-warn-red { animation: flashChainRed 0.65s infinite; }

    /* Table & Uniform Row Layout */
    table {
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
      font-size: 0.82rem;
    }
    thead tr { height: 24px; }
    th {
      text-align: left;
      padding: 0 4px;
      color: #888;
      font-weight: 600;
      font-size: 0.74rem;
      border-bottom: 1px solid #2a2a2a;
      white-space: nowrap;
    }
    tbody tr {
      height: 26px;
      background-color: #181818;
      transition: background-color 0.1s;
    }
    tbody tr:nth-child(even) {
      background-color: #202020;
    }
    tbody tr:hover {
      background-color: #282828;
    }
    td {
      text-align: left;
      padding: 0 4px;
      height: 26px;
      line-height: 26px;
      border: none;
      white-space: nowrap;
      vertical-align: middle;
    }

    /* Player Column: Dot + Name + Last Action */
    .player-cell {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 26px;
      max-width: 195px;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-Online { background-color: #4caf50; box-shadow: 0 0 4px rgba(76, 175, 80, 0.7); }
    .dot-Idle { background-color: #ff9800; }
    .dot-Offline { background-color: #555555; }

    a.player-link {
      color: #f0f0f0;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }

    .last-act {
      font-size: 0.68rem;
      color: #777;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* Status & Timer Styling */
    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: 600; }
    .Jail { color: #ffa726; font-weight: 600; }
    .Traveling { color: #42a5f5; font-weight: 600; }
    .Fallen { color: #757575; font-style: italic; }

    .timer {
      font-family: monospace;
      font-size: 0.78rem;
      padding: 1px 4px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1.25;
      vertical-align: middle;
    }
    .no-action {
      color: #555;
      font-size: 0.78rem;
      display: inline-block;
      width: 44px;
      text-align: center;
    }

    /* Unified Attack Button Styling */
    a.atk-btn {
      background: #7f1d1d;
      color: #e0e0e0;
      padding: 2px 7px;
      border-radius: 3px;
      text-decoration: none;
      font-size: 0.73rem;
      font-weight: 700;
      display: inline-block;
      line-height: 1.3;
      vertical-align: middle;
      transition: 0.15s;
    }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.75); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }

    /* Mobile Screen Adjustments */
    @media (max-width: 520px) {
      body { padding: 8px 6px; }
      .panel { padding: 8px 6px 6px 6px; }
      table { font-size: 0.75rem; }
      th { font-size: 0.68rem; padding: 0 2px; }
      td { padding: 0 2px; }
      .player-cell { max-width: 112px; gap: 3px; }
      .last-act { font-size: 0.64rem; }
      .timer { font-size: 0.71rem; padding: 1px 2px; }
      a.atk-btn { padding: 2px 5px; font-size: 0.68rem; }
      .no-action { width: 36px; }
      button { padding: 5px 8px; font-size: 0.78rem; }
      input { width: 150px; padding: 5px 8px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Paste Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta-bar">
    <span id="statusBar">Paste a Public API key in the top right and click Load.</span>
    <span class="loc-badge" id="myLocBadge">Your Location: --</span>
  </div>

  <div class="board" id="swipeBoard">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers</h2>
        <span class="chain-badge" id="allyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const CITY_CODES = [
      { keys: ["torn", "tc"], code: "TC" },
      { keys: ["mexico", "mexican", "mex"], code: "MEX" },
      { keys: ["cayman", "cay"], code: "CAY" },
      { keys: ["canada", "canadian", "can"], code: "CAN" },
      { keys: ["hawaii", "hawaiian", "haw"], code: "HAW" },
      { keys: ["united kingdom", "british", "uk"], code: "UK" },
      { keys: ["argentina", "argentinian", "arg"], code: "ARG" },
      { keys: ["switzerland", "swiss", "swi"], code: "SWI" },
      { keys: ["japan", "japanese", "jap"], code: "JAP" },
      { keys: ["china", "chinese", "chi"], code: "CHI" },
      { keys: ["uae", "emirati", "dubai"], code: "UAE" },
      { keys: ["south africa", "south african", "sa"], code: "SA" }
    ];

    function detectCityCode(text) {
      if (!text) return "TC";
      const lower = String(text).toLowerCase();
      for (const entry of CITY_CODES) {
        for (const k of entry.keys) {
          const regex = new RegExp("\\b" + k + "\\b", "i");
          if (regex.test(lower)) return entry.code;
        }
      }
      return "TC";
    }

    function detectForeignCityCode(text) {
      if (!text) return "";
      const lower = String(text).toLowerCase();
      for (const entry of CITY_CODES) {
        if (entry.code === "TC") continue;
        for (const k of entry.keys) {
          const regex = new RegExp("\\b" + k + "\\b", "i");
          if (regex.test(lower)) return entry.code;
        }
      }
      return "";
    }

    function parseUserLocation(userData) {
      if (!userData || !userData.status) return "--";
      const st = userData.status;
      const state = st.state || "";
      const combined = (st.description || "") + " " + (st.details || "");

      if (state === "Traveling") {
        return "Traveling";
      }
      if (state === "Abroad") {
        return detectForeignCityCode(combined) || "Abroad";
      }
      if (state === "Hospital" || state === "Jail") {
        return detectCityCode(combined);
      }
      return detectForeignCityCode(combined) || "TC";
    }

    function parseMemberStatus(statusObj) {
      if (!statusObj) return { text: "-", cssClass: "", tier: 4, sortKey: "", locationCode: "TC" };
      const state = statusObj.state || "";
      const desc = statusObj.description || "";
      const details = statusObj.details || "";
      const combined = (desc + " " + details).trim();
      const lowerDesc = desc.toLowerCase();
      const lowerCombined = combined.toLowerCase();

      if (state === "Fallen") {
        return { text: "Fallen", cssClass: "Fallen", tier: 5, sortKey: "", locationCode: "" };
      }

      if (state === "Hospital") {
        const city = detectCityCode(combined);
        return { text: "Hosp (" + city + ")", cssClass: "Hospital", tier: 1, sortKey: city, locationCode: city };
      }

      if (state === "Jail") {
        const city = detectCityCode(combined);
        return { text: "Jail (" + city + ")", cssClass: "Jail", tier: 1, sortKey: city, locationCode: city };
      }

      if (state === "Traveling" || lowerCombined.includes("traveling") || lowerCombined.includes("returning")) {
        let route = "";

        const fromToMatch = combined.match(/from\s+([a-zA-Z\s]+?)\s+to\s+([a-zA-Z\s]+)/i);
        if (fromToMatch) {
          const origin = detectCityCode(fromToMatch[1]);
          const dest = detectCityCode(fromToMatch[2]);
          route = origin + " > " + dest;
        }

        if (!route && (lowerDesc.includes("returning") || lowerCombined.includes("returning to torn"))) {
          const origin = detectForeignCityCode(combined);
          route = origin ? (origin + " > TC") : "Abroad > TC";
        }

        if (!route && (lowerDesc.includes("traveling to") || lowerCombined.includes("traveling to"))) {
          const dest = detectForeignCityCode(combined);
          if (dest) {
            route = "TC > " + dest;
          } else if (lowerCombined.includes("torn")) {
            route = "Abroad > TC";
          }
        }

        if (!route) {
          const foreign = detectForeignCityCode(combined);
          if (foreign) {
            route = lowerCombined.includes("from") ? (foreign + " > TC") : ("TC > " + foreign);
          } else {
            route = "Traveling";
          }
        }

        return { text: route, cssClass: "Traveling", tier: 2, sortKey: route, locationCode: "Traveling" };
      }

      if (state === "Abroad") {
        const city = detectForeignCityCode(combined) || "Abroad";
        return { text: "Okay (" + city + ")", cssClass: "Okay", tier: 3, sortKey: city, locationCode: city };
      }

      const foreignInOkay = detectForeignCityCode(combined);
      if (foreignInOkay) {
        return { text: "Okay (" + foreignInOkay + ")", cssClass: "Okay", tier: 3, sortKey: foreignInOkay, locationCode: foreignInOkay };
      }

      return { text: "Okay (TC)", cssClass: "Okay", tier: 4, sortKey: "TC", locationCode: "TC" };
    }

    function formatLastAction(lastActionObj) {
      if (!lastActionObj) return "";
      if (lastActionObj.relative) {
        const rel = String(lastActionObj.relative).toLowerCase();
        const m = rel.match(/(\d+)\s*(second|minute|hour|day|week|month|year)/);
        if (m) {
          const num = m[1];
          const unit = m[2];
          if (unit.startsWith("second")) return num + "s";
          if (unit.startsWith("minute")) return num + "m";
          if (unit.startsWith("hour")) return num + "h";
          if (unit.startsWith("day")) return num + "d";
          if (unit.startsWith("week")) return num + "w";
          if (unit.startsWith("month")) return num + "mo";
          if (unit.startsWith("year")) return num + "y";
        }
      }
      if (lastActionObj.timestamp) {
        const diff = Math.max(0, Math.floor(Date.now() / 1000) - Number(lastActionObj.timestamp));
        if (diff < 60) return diff + "s";
        if (diff < 3600) return Math.floor(diff / 60) + "m";
        if (diff < 86400) return Math.floor(diff / 3600) + "h";
        return Math.floor(diff / 86400) + "d";
      }
      return "";
    }

    function getOnlineDotClass(lastActionObj) {
      const st = lastActionObj && lastActionObj.status ? lastActionObj.status : "Offline";
      if (st === "Online") return "dot-Online";
      if (st === "Idle") return "dot-Idle";
      return "dot-Offline";
    }

    const savedTabId = Number(localStorage.getItem("torn_selected_faction"));
    let selectedFactionId = OUR_FACTIONS.some(f => f.id === savedTabId) ? savedTabId : 40449;
    let cachedData = { ally: null, enemy: null };
    let chainState = { ally: null, enemy: null };
    let myLocationCode = "--";
    let releaseGraceMap = {};

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => switchToFaction(fac.id);
      tabContainer.appendChild(btn);
    });

    function switchToFaction(facId) {
      if (selectedFactionId === facId) return;
      selectedFactionId = facId;
      localStorage.setItem("torn_selected_faction", String(facId));
      releaseGraceMap = {};
      updateActiveTab();
      fetchWarData();
    }

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    // Mobile Swipe Left / Right Gesture Support Between Faction Tabs
    let touchStartX = 0;
    let touchStartY = 0;
    const swipeZone = document.getElementById("swipeBoard");

    swipeZone.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    swipeZone.addEventListener("touchend", (e) => {
      if (!touchStartX || e.changedTouches.length !== 1) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      touchStartX = 0;
      touchStartY = 0;

      // Require clear horizontal swipe (> 55px) and mostly horizontal movement
      if (Math.abs(diffX) > 55 && Math.abs(diffX) > Math.abs(diffY) * 1.4) {
        const currentIndex = OUR_FACTIONS.findIndex(f => f.id === selectedFactionId);
        if (currentIndex === -1) return;

        if (diffX < 0) {
          // Swiped Left -> Next Faction Tab
          const nextIndex = (currentIndex + 1) % OUR_FACTIONS.length;
          switchToFaction(OUR_FACTIONS[nextIndex].id);
        } else {
          // Swiped Right -> Previous Faction Tab
          const prevIndex = (currentIndex - 1 + OUR_FACTIONS.length) % OUR_FACTIONS.length;
          switchToFaction(OUR_FACTIONS[prevIndex].id);
        }
      }
    }, { passive: true });

    async function fetchJsonWithFallback(tornUrl) {
      try {
        const directRes = await fetch(tornUrl);
        if (directRes.ok) {
          const directData = await directRes.json();
          if (directData && !directData.error) return directData;
          if (directData && directData.error) throw new Error(directData.error.error);
        }
      } catch (e) {
        if (e.message && !e.message.includes("fetch") && !e.message.includes("NetworkError")) {
          throw e;
        }
      }

      const proxy1 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(tornUrl);
      try {
        const res1 = await fetch(proxy1);
        if (res1.ok) {
          const data1 = await res1.json();
          if (data1 && !data1.error) return data1;
          if (data1 && data1.error) throw new Error(data1.error.error);
        }
      } catch (e) {
        if (e.message && !e.message.includes("fetch") && !e.message.includes("NetworkError")) {
          throw e;
        }
      }

      const proxy2 = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl);
      const res2 = await fetch(proxy2);
      if (!res2.ok) throw new Error("HTTP " + res2.status);
      const data2 = await res2.json();
      if (data2 && data2.error) throw new Error(data2.error.error);
      return data2;
    }

    async function fetchMyLocation(key) {
      const userUrl = "https://api.torn.com/user/?selections=basic&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      try {
        const userData = await fetchJsonWithFallback(userUrl);
        myLocationCode = parseUserLocation(userData);
        document.getElementById("myLocBadge").textContent = "Your Location: " + myLocationCode;
      } catch (e) {
        // Keep previous location if single poll blips
      }
    }

    async function getFactionFull(id, key) {
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?striptags=true&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";

      const [v1Data, v2MembersData] = await Promise.all([
        fetchJsonWithFallback(v1Url),
        fetchJsonWithFallback(v2MembersUrl).catch(() => null)
      ]);

      if (v1Data && v1Data.members && v2MembersData && Array.isArray(v2MembersData.members)) {
        v2MembersData.members.forEach(vm => {
          const mId = String(vm.id);
          if (v1Data.members[mId] && vm.status) {
            v1Data.members[mId].status = {
              state: vm.status.state || v1Data.members[mId].status.state,
              description: vm.status.description || v1Data.members[mId].status.description,
              details: vm.status.details || v1Data.members[mId].status.details || "",
              until: vm.status.until !== undefined ? vm.status.until : v1Data.members[mId].status.until
            };
          }
          if (v1Data.members[mId] && vm.last_action) {
            v1Data.members[mId].last_action = vm.last_action;
          }
        });
      }

      return v1Data;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function formatShortTime(sec) {
      if (sec <= 0) return "00:00";
      const h = Math.floor(sec / 3600);
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return h > 0 ? (h + ":" + m + ":" + s) : (m + ":" + s);
    }

    function updateChainDisplay(chainObj, elementId, isAlly) {
      const el = document.getElementById(elementId);
      if (!chainObj || (!chainObj.current && !chainObj.cooldown)) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        return;
      }

      const now = Math.floor(Date.now() / 1000);

      if (chainObj.cooldown && chainObj.cooldown > 0) {
        const remCd = Math.max(0, chainObj.endTimestamp - now);
        if (remCd > 0) {
          el.textContent = "Chain: " + chainObj.current + " (CD " + formatShortTime(remCd) + ")";
          el.className = "chain-badge chain-cooldown";
          return;
        }
      }

      if (chainObj.current && chainObj.current > 0) {
        const remTimeout = Math.max(0, chainObj.endTimestamp - now);
        const maxStr = chainObj.max ? "/" + chainObj.max : "";
        el.textContent = "Chain: " + chainObj.current + maxStr + " (" + formatShortTime(remTimeout) + ")";

        if (isAlly && remTimeout > 0 && remTimeout < 60) {
          el.className = "chain-badge chain-warn-red";
        } else if (isAlly && remTimeout > 0 && remTimeout < 150) {
          el.className = "chain-badge chain-warn-yellow";
        } else if (!isAlly && remTimeout > 0 && remTimeout <= 60) {
          el.className = "chain-badge chain-warn-red";
        } else {
          el.className = "chain-badge chain-active";
        }
        return;
      }

      el.textContent = "Chain: None";
      el.className = "chain-badge";
    }

    function storeChainSnapshot(rawChain) {
      if (!rawChain) return null;
      const now = Math.floor(Date.now() / 1000);
      const duration = rawChain.cooldown > 0 ? rawChain.cooldown : (rawChain.timeout || 0);
      return {
        current: rawChain.current || 0,
        max: rawChain.max || 0,
        cooldown: rawChain.cooldown || 0,
        endTimestamp: now + duration
      };
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Fetching data for Faction " + selectedFactionId + "...";

      try {
        await fetchMyLocation(key);

        const allyData = await getFactionFull(selectedFactionId, key);
        cachedData.ally = allyData;
        chainState.ally = storeChainSnapshot(allyData.chain);
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";
        updateChainDisplay(chainState.ally, "allyChain", true);

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionFull(enemyId, key);
          cachedData.enemy = enemyData;
          chainState.enemy = storeChainSnapshot(enemyData.chain);
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
          updateChainDisplay(chainState.enemy, "enemyChain", false);
        } else {
          cachedData.enemy = null;
          chainState.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
          updateChainDisplay(null, "enemyChain", false);
        }

        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 15s • Updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isSameLocationAsMe(targetLocCode) {
      if (!myLocationCode || myLocationCode === "--" || myLocationCode === "Traveling") return false;
      if (!targetLocCode || targetLocCode === "Traveling") return false;
      return myLocationCode === targetLocCode;
    }

    function isAttackReady(state, diffSeconds, targetLocCode) {
      if (state === "Fallen") return false;
      if (!isSameLocationAsMe(targetLocCode)) return false;
      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => {
        const rawState = m.status.state;
        const until = m.status.until || 0;
        const parsed = parseMemberStatus(m.status);
        const graceKey = tbodyId + "_" + id;

        if ((rawState === "Hospital" || rawState === "Jail") && until > 0 && until <= now) {
          if (!releaseGraceMap[graceKey]) {
            releaseGraceMap[graceKey] = now;
          }
          const elapsedSinceRelease = now - releaseGraceMap[graceKey];
          if (elapsedSinceRelease >= 8) {
            const loc = parsed.locationCode || "TC";
            const isAbroad = loc !== "TC";
            return {
              id,
              ...m,
              effectiveState: "Okay",
              effectiveUntil: 0,
              parsed: {
                text: "Okay (" + loc + ")",
                cssClass: "Okay",
                tier: isAbroad ? 3 : 4,
                sortKey: loc,
                locationCode: loc
              }
            };
          }
        } else {
          delete releaseGraceMap[graceKey];
        }

        return {
          id,
          ...m,
          effectiveState: rawState,
          effectiveUntil: until,
          parsed
        };
      });

      members.sort((a, b) => {
        if (a.parsed.tier !== b.parsed.tier) {
          return a.parsed.tier - b.parsed.tier;
        }
        if (a.parsed.tier === 1) {
          const aUntil = a.effectiveUntil || 9999999999;
          const bUntil = b.effectiveUntil || 9999999999;
          if (aUntil !== bUntil) return aUntil - bUntil;
        }
        if (a.parsed.tier === 2 || a.parsed.tier === 3) {
          const cmp = a.parsed.sortKey.localeCompare(b.parsed.sortKey);
          if (cmp !== 0) return cmp;
        }
        return (a.name || "").localeCompare(b.name || "");
      });

      tbody.innerHTML = members.map(m => {
        const until = m.effectiveUntil;
        const state = m.effectiveState;
        const diff = until > 0 ? until - now : 0;
        const isTimed = state === "Hospital" || state === "Jail";
        const timerText = (isTimed && until > 0) ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(state, diff);
        const targetLoc = m.parsed.locationCode;
        const isFallen = state === "Fallen";
        const readyClass = (!isFallen && isAttackReady(state, diff, targetLoc)) ? " atk-ready" : "";
        const dotClass = getOnlineDotClass(m.last_action);
        const lastActText = formatLastAction(m.last_action);

        const actionCell = isFallen
          ? '<td><span class="no-action">-</span></td>'
          : '<td><a class="atk-btn' + readyClass + '" data-state="' + state + '" data-until="' + until + '" data-loc="' + targetLoc + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a></td>';

        return '<tr data-grace-key="' + tbodyId + '_' + m.id + '" data-state="' + state + '" data-until="' + until + '">' +
          '<td><div class="player-cell"><span class="status-dot ' + dotClass + '"></span><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a><span class="last-act">' + lastActText + '</span></div></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.parsed.cssClass + '">' + m.parsed.text + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + state + '" data-until="' + until + '">' + timerText + '</span></td>' +
          actionCell +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      let needsResort = false;

      document.querySelectorAll("tbody tr[data-state]").forEach(row => {
        const st = row.dataset.state;
        const until = Number(row.dataset.until);
        const graceKey = row.dataset.graceKey;
        if ((st === "Hospital" || st === "Jail") && until > 0 && until <= now) {
          if (!releaseGraceMap[graceKey]) {
            releaseGraceMap[graceKey] = now;
          } else if (now - releaseGraceMap[graceKey] >= 8) {
            needsResort = true;
          }
        }
      });

      if (needsResort) {
        renderTables();
      } else {
        document.querySelectorAll(".timer").forEach(el => {
          const until = Number(el.dataset.until);
          const state = el.dataset.state;
          if ((state === "Hospital" || state === "Jail") && until > 0) {
            const diff = until - now;
            el.textContent = formatCountdown(diff);
            el.className = "timer " + getTimerAlertClass(state, diff);
          }
        });

        document.querySelectorAll(".atk-btn").forEach(btn => {
          const until = Number(btn.dataset.until);
          const state = btn.dataset.state;
          const loc = btn.dataset.loc;
          const diff = until > 0 ? until - now : 0;
          if (isAttackReady(state, diff, loc)) {
            btn.classList.add("atk-ready");
          } else {
            btn.classList.remove("atk-ready");
          }
        });
      }

      updateChainDisplay(chainState.ally, "allyChain", true);
      updateChainDisplay(chainState.enemy, "enemyChain", false);
    }, 1000);

    setInterval(fetchWarData, 15000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
