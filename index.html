<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 10px;
      overflow-x: hidden;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .key-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    button {
      padding: 6px 11px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #1e1e1e;
      color: #ccc;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.84rem;
      transition: 0.15s;
    }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input {
      padding: 6px 9px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      width: 175px;
      font-size: 0.84rem;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #999;
      margin-bottom: 10px;
    }
    .loc-badge {
      color: #90caf9;
      font-weight: 600;
    }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      touch-action: pan-y;
    }
    @media (max-width: 820px) {
      .board { grid-template-columns: 1fr; gap: 10px; }
    }
    .panel {
      background: #181818;
      border-radius: 7px;
      padding: 10px;
      border: 1px solid #2a2a2a;
      overflow-x: auto;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2e2e2e;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chain-badge {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 4px;
      background: #252525;
      color: #aaa;
      border: 1px solid #383838;
      white-space: nowrap;
    }
    .chain-active {
      background: rgba(46, 125, 50, 0.25);
      color: #81c784;
      border-color: #388e3c;
    }
    .chain-cooldown {
      background: #b3e5fc;
      color: #01579b;
      border-color: #81d4fa;
      box-shadow: 0 0 6px rgba(179, 229, 252, 0.4);
    }

    @keyframes chainYellowSlow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.32); color: #fff59d; border-color: #fdd835; }
      50% { background-color: rgba(253, 216, 53, 0.08); color: #fdd835; border-color: #665c1e; }
    }
    @keyframes chainRedFast {
      0%, 100% { background-color: rgba(229, 57, 53, 0.55); color: #ffffff; border-color: #ff5252; }
      50% { background-color: rgba(229, 57, 53, 0.12); color: #ff8a80; border-color: #7f1d1d; }
    }
    .chain-warn-yellow { animation: chainYellowSlow 1.6s infinite; }
    .chain-warn-red { animation: chainRedFast 0.65s infinite; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead tr {
      height: 24px;
      background: #181818;
    }
    th {
      text-align: left;
      padding: 0 5px;
      color: #888;
      font-weight: 600;
      border-bottom: 1px solid #2c2c2c;
      white-space: nowrap;
    }
    tbody tr {
      height: 26px;
      background: #181818;
    }
    tbody tr:nth-child(even) {
      background: #202020;
    }
    tbody tr:hover {
      background: #292929;
    }
    td {
      padding: 0 5px;
      line-height: 26px;
      white-space: nowrap;
      border: none;
    }
    .player-cell {
      max-width: 155px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .dot-Online { background: #4caf50; }
    .dot-Idle { background: #ff9800; }
    .dot-Offline { background: #555; }
    .last-act {
      color: #777;
      font-size: 0.74rem;
      margin-left: 3px;
    }
    a.player-link {
      color: #fff;
      text-decoration: none;
    }
    a.player-link:hover {
      text-decoration: underline;
      color: #90caf9;
    }

    .status-okay { color: #66bb6a; }
    .status-hosp { color: #ef5350; font-weight: bold; }
    .status-jail { color: #ffa726; font-weight: bold; }
    .status-travel { color: #42a5f5; }
    .status-fallen { color: #757575; font-style: italic; }

    .timer-cell {
      padding-right: 8px;
    }
    .timer {
      font-family: monospace;
      font-size: 0.84rem;
      padding: 1px 5px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1.3;
    }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.28); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.5); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.85); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }

    .action-cell {
      padding-left: 6px;
      text-align: right;
    }
    a.atk-btn {
      background: #7f1d1d;
      color: #e0e0e0;
      padding: 2px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.76rem;
      font-weight: bold;
      display: inline-block;
      line-height: 1.35;
      transition: 0.15s;
    }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }

    @media (max-width: 480px) {
      body { padding: 6px; }
      .panel { padding: 7px; }
      table { font-size: 0.76rem; }
      th, td { padding: 0 3px; }
      .player-cell { max-width: 108px; }
      .timer-cell { padding-right: 6px; }
      .timer { font-size: 0.76rem; padding: 1px 3px; }
      .action-cell { padding-left: 4px; }
      a.atk-btn { padding: 2px 6px; font-size: 0.72rem; }
      input { width: 150px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Paste Public Torn API Key" />
      <button class="load-btn" onclick="manualLoad()">Load</button>
    </div>
  </div>
  <div class="meta-bar">
    <span id="statusBar">Paste a Public API key in the top right and click Load.</span>
    <span class="loc-badge" id="userLocBadge">Your Location: --</span>
  </div>

  <div class="board" id="swipeBoard">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers</h2>
        <span class="chain-badge" id="allyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th style="text-align:right;">Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th style="text-align:right;">Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const CITY_CODES = [
      { match: /torn/i, code: "TC" },
      { match: /mexic/i, code: "MEX" },
      { match: /cayman/i, code: "CAY" },
      { match: /canad/i, code: "CAN" },
      { match: /hawai/i, code: "HAW" },
      { match: /united kingdom|british|uk/i, code: "UK" },
      { match: /argentin/i, code: "ARG" },
      { match: /switzer|swiss/i, code: "SWI" },
      { match: /japan/i, code: "JAP" },
      { match: /chin/i, code: "CHI" },
      { match: /uae|emirat/i, code: "UAE" },
      { match: /south africa/i, code: "SA" }
    ];

    let savedTab = Number(localStorage.getItem("razers_selected_tab"));
    let selectedFactionId = OUR_FACTIONS.some(f => f.id === savedTab) ? savedTab : 40449;
    let userCurrentCity = null;
    let cachedData = {
      ally: null,
      enemy: null,
      allyChain: null,
      enemyChain: null,
      fetchTime: 0
    };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      const val = keyInput.value.trim();
      localStorage.setItem("torn_pub_key", val);
      if (val.length === 16) {
        localStorage.removeItem("razers_home_detected_for");
        fetchWarData();
      }
    });

    function manualLoad() {
      const val = keyInput.value.trim();
      if (val) {
        localStorage.setItem("torn_pub_key", val);
        localStorage.removeItem("razers_home_detected_for");
        fetchWarData();
      }
    }

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => switchTab(fac.id);
      tabContainer.appendChild(btn);
    });

    function switchTab(id) {
      selectedFactionId = Number(id);
      localStorage.setItem("razers_selected_tab", String(selectedFactionId));
      updateActiveTab();
      fetchWarData();
    }

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    // Mobile swipe navigation left/right across tabs
    let touchStartX = 0;
    let touchStartY = 0;
    const swipeBoard = document.getElementById("swipeBoard");
    swipeBoard.addEventListener("touchstart", e => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }, { passive: true });

    swipeBoard.addEventListener("touchend", e => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const idx = OUR_FACTIONS.findIndex(f => f.id === selectedFactionId);
        if (idx !== -1) {
          const nextIdx = dx < 0
            ? (idx + 1) % OUR_FACTIONS.length
            : (idx - 1 + OUR_FACTIONS.length) % OUR_FACTIONS.length;
          switchTab(OUR_FACTIONS[nextIdx].id);
        }
      }
    }, { passive: true });

    function getCityCode(text) {
      if (!text) return null;
      for (const c of CITY_CODES) {
        if (c.match.test(text)) return c.code;
      }
      return null;
    }

    async function fetchTornJson(tornUrl) {
      const attempts = [
        async () => {
          const r = await fetch(tornUrl);
          if (!r.ok) throw new Error("Direct HTTP " + r.status);
          return await r.json();
        },
        async () => {
          const r = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(tornUrl));
          if (!r.ok) throw new Error("AllOrigins HTTP " + r.status);
          const wrap = await r.json();
          return JSON.parse(wrap.contents);
        },
        async () => {
          const r = await fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl));
          if (!r.ok) throw new Error("CodeTabs HTTP " + r.status);
          return await r.json();
        }
      ];

      let lastErr = null;
      for (const fn of attempts) {
        try {
          const data = await fn();
          if (data && data.error) throw new Error(data.error.error);
          if (data) return data;
        } catch (err) {
          lastErr = err;
          if (err && err.message && err.message.toLowerCase().includes("key")) {
            throw err;
          }
        }
      }
      throw lastErr || new Error("Failed to fetch");
    }

    async function updateUserContext(key) {
      const userUrl = "https://api.torn.com/user/?selections=basic&comment=RazersWarTracker&key=" + encodeURIComponent(key);
      const userData = await fetchTornJson(userUrl);

      // Auto-detect home faction on first load or when API key changes
      if (userData && userData.faction && userData.faction.faction_id) {
        const homeId = Number(userData.faction.faction_id);
        const lastDetectedKey = localStorage.getItem("razers_home_detected_for");
        if (lastDetectedKey !== key) {
          localStorage.setItem("razers_home_detected_for", key);
          if (OUR_FACTIONS.some(f => f.id === homeId) && selectedFactionId !== homeId) {
            selectedFactionId = homeId;
            localStorage.setItem("razers_selected_tab", String(homeId));
            updateActiveTab();
          }
        }
      }

      // Determine user's live city for same-city Attack button flashing
      const st = userData.status || {};
      const desc = st.description || "";
      const details = st.details || "";
      if (st.state === "Traveling") {
        userCurrentCity = null;
        document.getElementById("userLocBadge").textContent = "Your Location: Traveling";
      } else {
        const code = getCityCode(desc) || getCityCode(details) || "TC";
        userCurrentCity = code;
        document.getElementById("userLocBadge").textContent = "Your Location: " + code;
      }
    }

    async function getFactionFull(id, key) {
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&comment=RazersWarTracker&key=" + encodeURIComponent(key);
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?comment=RazersWarTracker&key=" + encodeURIComponent(key);

      const [v1Data, v2Data] = await Promise.all([
        fetchTornJson(v1Url),
        fetchTornJson(v2MembersUrl).catch(() => null)
      ]);

      // Merge v2 detailed flight descriptions into v1 members map
      if (v2Data && Array.isArray(v2Data.members) && v1Data && v1Data.members) {
        v2Data.members.forEach(m2 => {
          const m1 = v1Data.members[String(m2.id)];
          if (m1 && m2.status) {
            m1.status.description = m2.status.description || m1.status.description;
            m1.status.details = m2.status.details || m1.status.details;
          }
        });
      }
      return v1Data;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }

      try {
        await updateUserContext(key);
        document.getElementById("statusBar").textContent = "Syncing Faction " + selectedFactionId + "...";

        const allyData = await getFactionFull(selectedFactionId, key);
        cachedData.ally = allyData;
        cachedData.allyChain = allyData.chain || null;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionFull(enemyId, key);
          cachedData.enemy = enemyData;
          cachedData.enemyChain = enemyData.chain || null;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
        } else {
          cachedData.enemy = null;
          cachedData.enemyChain = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
        }

        cachedData.fetchTime = Math.floor(Date.now() / 1000);
        updateChainBadges();
        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • 15s sync • " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatShortTimer(sec) {
      if (sec <= 0) return "00:00";
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function renderSingleChainBadge(chainObj, elId, isAlly) {
      const el = document.getElementById(elId);
      if (!chainObj || !chainObj.current || chainObj.current === 0) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        return;
      }

      const elapsed = Math.floor(Date.now() / 1000) - cachedData.fetchTime;
      const cooldown = Math.max(0, (chainObj.cooldown || 0) - elapsed);
      const timeout = Math.max(0, (chainObj.timeout || 0) - elapsed);

      if (cooldown > 0) {
        el.textContent = "Chain: " + chainObj.current + " (CD " + formatShortTimer(cooldown) + ")";
        el.className = "chain-badge chain-cooldown";
        return;
      }

      if (timeout > 0) {
        const maxStr = chainObj.max ? "/" + chainObj.max : "";
        el.textContent = "Chain: " + chainObj.current + maxStr + " (" + formatShortTimer(timeout) + ")";
        let cls = "chain-badge chain-active";
        if (isAlly) {
          if (timeout < 60) cls += " chain-warn-red";
          else if (timeout < 150) cls += " chain-warn-yellow";
        } else {
          if (timeout < 60) cls += " chain-warn-red";
        }
        el.className = cls;
      } else {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
      }
    }

    function updateChainBadges() {
      renderSingleChainBadge(cachedData.allyChain, "allyChain", true);
      renderSingleChainBadge(cachedData.enemyChain, "enemyChain", false);
    }

    function parseMemberStatus(m) {
      const st = m.status || {};
      const state = st.state || "Okay";
      const desc = st.description || "";
      const details = st.details || "";
      const combined = desc + " " + details;

      if (state === "Fallen") {
        return {
          tier: 5,
          label: "Fallen",
          css: "status-fallen",
          city: null,
          sortKey: m.name.toLowerCase(),
          isFallen: true
        };
      }

      if (state === "Hospital") {
        const code = getCityCode(combined) || "TC";
        return {
          tier: 1,
          label: "Hosp (" + code + ")",
          css: "status-hosp",
          city: code,
          sortKey: m.name.toLowerCase(),
          isFallen: false
        };
      }

      if (state === "Jail") {
        const code = getCityCode(combined) || "TC";
        return {
          tier: 1,
          label: "Jail (" + code + ")",
          css: "status-jail",
          city: code,
          sortKey: m.name.toLowerCase(),
          isFallen: false
        };
      }

      if (state === "Traveling") {
        let route = "Traveling";
        const fromTo = combined.match(/from\s+([a-z\s]+?)\s+to\s+([a-z\s]+)/i);
        const retToTorn = combined.match(/returning\s+to\s+torn\s+from\s+([a-z\s]+)/i);
        const travTo = combined.match(/traveling\s+to\s+([a-z\s]+)/i);

        if (fromTo) {
          const c1 = getCityCode(fromTo[1]) || "TC";
          const c2 = getCityCode(fromTo[2]) || "TC";
          route = c1 + " > " + c2;
        } else if (retToTorn) {
          const c1 = getCityCode(retToTorn[1]) || "ABROAD";
          route = c1 + " > TC";
        } else if (travTo) {
          const c2 = getCityCode(travTo[1]) || "ABROAD";
          route = "TC > " + c2;
        }

        return {
          tier: 2,
          label: route,
          css: "status-travel",
          city: null,
          sortKey: route + "_" + m.name.toLowerCase(),
          isFallen: false
        };
      }

      // Okay or Abroad
      const code = getCityCode(combined) || "TC";
      const isAbroad = state === "Abroad" || code !== "TC";
      return {
        tier: isAbroad ? 3 : 4,
        label: "Okay (" + code + ")",
        css: "status-okay",
        city: code,
        sortKey: (isAbroad ? code + "_" : "") + m.name.toLowerCase(),
        isFallen: false
      };
    }

    function formatLastActionShort(relative) {
      if (!relative) return "";
      const m = relative.match(/(\d+)\s*(second|minute|hour|day|week|month|year)/i);
      if (!m) return "";
      const unitMap = { s: "s", m: "m", h: "h", d: "d", w: "w", y: "y" };
      const first = m[2][0].toLowerCase();
      if (m[2].toLowerCase().startsWith("mo")) return m[1] + "mo";
      return m[1] + (unitMap[first] || first);
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, city, diffSeconds) {
      if (!userCurrentCity || !city || userCurrentCity !== city) return false;
      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => {
        const until = (m.status && m.status.until) ? Number(m.status.until) : 0;
        const rawState = (m.status && m.status.state) ? m.status.state : "Okay";
        const diff = until > 0 ? until - now : 0;

        // 8-second post-release grace window before moving to Okay list
        const isExpiredTimer = (rawState === "Hospital" || rawState === "Jail") && until > 0 && diff <= -8;
        const effectiveMember = isExpiredTimer
          ? {
              ...m,
              id,
              status: {
                ...m.status,
                state: "Okay",
                until: 0,
                description: (m.status.description || "").replace(/hospital|jail/ig, "Okay")
              }
            }
          : { ...m, id };

        const parsed = parseMemberStatus(effectiveMember);
        return {
          ...effectiveMember,
          parsed,
          until: isExpiredTimer ? 0 : until,
          diff: isExpiredTimer ? 0 : diff
        };
      });

      members.sort((a, b) => {
        if (a.parsed.tier !== b.parsed.tier) return a.parsed.tier - b.parsed.tier;
        if (a.parsed.tier === 1) {
          const ua = a.until || 9999999999;
          const ub = b.until || 9999999999;
          if (ua !== ub) return ua - ub;
        }
        return a.parsed.sortKey.localeCompare(b.parsed.sortKey);
      });

      tbody.innerHTML = members.map(m => {
        const st = m.status.state;
        const dotStatus = (m.last_action && m.last_action.status) ? m.last_action.status : "Offline";
        const lastAct = formatLastActionShort(m.last_action ? m.last_action.relative : "");
        const timerText = m.until > 0 ? formatCountdown(m.diff) : "-";
        const alertClass = getTimerAlertClass(st, m.diff);
        const readyClass = !m.parsed.isFallen && isAttackReady(st, m.parsed.city, m.diff) ? " atk-ready" : "";

        const actionHtml = m.parsed.isFallen
          ? '<span style="color:#666;">-</span>'
          : '<a class="atk-btn' + readyClass + '" data-state="' + st + '" data-city="' + (m.parsed.city || "") + '" data-until="' + m.until + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a>';

        return '<tr>' +
          '<td class="player-cell"><span class="dot dot-' + dotStatus + '"></span><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a><span class="last-act">' + lastAct + '</span></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.parsed.css + '">' + m.parsed.label + '</td>' +
          '<td class="timer-cell"><span class="timer ' + alertClass + '" data-state="' + st + '" data-until="' + m.until + '">' + timerText + '</span></td>' +
          '<td class="action-cell">' + actionHtml + '</td>' +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    // 1-second local countdown, chain alert check, and post-release re-sort
    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      let needsResort = false;

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
          if ((state === "Hospital" || state === "Jail") && diff <= -8) {
            needsResort = true;
          }
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const city = btn.dataset.city;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, city, diff)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });

      updateChainBadges();

      if (needsResort && cachedData.ally) {
        renderTables();
      }
    }, 1000);

    // 15-second live API refresh
    setInterval(fetchWarData, 15000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
