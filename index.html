<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 12px 16px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .key-group { display: flex; gap: 6px; }
    button { padding: 7px 14px; border: 1px solid #333; border-radius: 5px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.88rem; transition: 0.15s; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input { padding: 6px 10px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 200px; font-size: 0.88rem; }
    .meta { font-size: 0.8rem; color: #999; margin-bottom: 10px; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 850px) { .board { grid-template-columns: 1fr; } }
    .panel { background: #181818; border-radius: 6px; padding: 10px 12px; border: 1px solid #2c2c2c; overflow-x: auto; }
    h2 { margin: 0 0 8px 0; font-size: 1.05rem; border-bottom: 1px solid #2e2e2e; padding-bottom: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .chain-badge { font-size: 0.8rem; font-family: monospace; padding: 3px 8px; border-radius: 4px; background: #242424; color: #aaa; border: 1px solid #383838; font-weight: 700; white-space: nowrap; }
    .chain-active { background: rgba(46, 125, 50, 0.25); color: #81c784; border-color: #388e3c; }
    .chain-cooldown { background-color: #b3e5fc; color: #01579b; border-color: #4fc3f7; box-shadow: 0 0 6px rgba(179, 229, 252, 0.4); }
    
    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.3); color: #fff59d; border-color: #fbc02d; }
      50% { background-color: rgba(253, 216, 53, 0.08); color: #fdd835; border-color: #665c1e; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(211, 47, 47, 0.85); color: #ffffff; border-color: #ff5252; }
      50% { background-color: rgba(183, 28, 28, 0.2); color: #ff8a80; border-color: #5c1919; }
    }
    .chain-warn-yellow { animation: flashChainYellow 1.5s infinite; }
    .chain-warn-red { animation: flashChainRed 0.65s infinite; }

    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #232323; white-space: nowrap; line-height: 1.25; }
    th { color: #888; font-weight: 600; font-size: 0.78rem; padding-bottom: 5px; }
    
    /* Subtle alternating row shading */
    tbody tr:nth-child(odd) { background-color: #181818; }
    tbody tr:nth-child(even) { background-color: #202020; }
    tbody tr:hover { background-color: #282828; }

    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: bold; }
    .Jail { color: #ffa726; font-weight: bold; }
    .Traveling, .Abroad { color: #42a5f5; font-weight: 600; }
    .timer { font-family: monospace; font-size: 0.88rem; padding: 1px 5px; border-radius: 3px; }
    a.player-link { color: #f0f0f0; text-decoration: none; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }
    
    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 2px 8px; border-radius: 3px; text-decoration: none; font-size: 0.76rem; font-weight: bold; display: inline-block; transition: 0.15s; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.75); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Paste Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta" id="statusBar">Paste a Public API key in the top right and click Load.</div>

  <div class="board">
    <div class="panel">
      <h2>
        <span id="allyTitle">Razers</span>
        <span id="allyChain" class="chain-badge">Chain: -</span>
      </h2>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>
        <span id="enemyTitle">Warring Opponent</span>
        <span id="enemyChain" class="chain-badge">Chain: -</span>
      </h2>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const CITY_CODES = [
      { match: "torn", code: "TC" },
      { match: "mexic", code: "MEX" },
      { match: "cayman", code: "CAY" },
      { match: "canad", code: "CAN" },
      { match: "hawai", code: "HAW" },
      { match: "united kingdom", code: "UK" },
      { match: "british", code: "UK" },
      { match: "uk", code: "UK" },
      { match: "argentin", code: "ARG" },
      { match: "switz", code: "SWI" },
      { match: "swiss", code: "SWI" },
      { match: "japan", code: "JAP" },
      { match: "chin", code: "CHI" },
      { match: "uae", code: "UAE" },
      { match: "emirates", code: "UAE" },
      { match: "emirati", code: "UAE" },
      { match: "south africa", code: "SA" }
    ];

    function detectCityCode(text) {
      if (!text) return null;
      const lower = text.toLowerCase();
      for (const entry of CITY_CODES) {
        if (lower.includes(entry.match)) return entry.code;
      }
      return null;
    }

    function formatDetailedStatus(statusObj) {
      if (!statusObj) return "-";
      const state = statusObj.state || "";
      const desc = statusObj.description || "";
      const lower = desc.toLowerCase();

      if (state === "Hospital") {
        const code = detectCityCode(desc);
        return code ? "Hosp (" + code + ")" : "Hosp (TC)";
      }
      if (state === "Jail") {
        const code = detectCityCode(desc);
        return code ? "Jail (" + code + ")" : "Jail (TC)";
      }
      if (state === "Traveling") {
        const code = detectCityCode(desc);
        if (lower.includes("returning to torn")) {
          return code ? code + " > TC" : "Abroad > TC";
        }
        if (lower.includes("traveling to")) {
          return code ? "TC > " + code : "TC > Abroad";
        }
        return code ? "TC > " + code : "Traveling";
      }
      if (state === "Abroad") {
        const code = detectCityCode(desc);
        return code || "Abroad";
      }
      return state || "-";
    }

    let selectedFactionId = 40449;
    let cachedData = { ally: null, enemy: null };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    async function fetchJsonWithFallback(tornUrl) {
      const endpoints = [
        tornUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(tornUrl),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl)
      ];

      let lastErr = null;
      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data.error) throw new Error(data.error.error);
          return data;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("Network error");
    }

    async function getFactionFull(id, key) {
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";

      const [v1Data, v2MembersData] = await Promise.all([
        fetchJsonWithFallback(v1Url),
        fetchJsonWithFallback(v2MembersUrl).catch(() => null)
      ]);

      if (v2MembersData && Array.isArray(v2MembersData.members) && v1Data.members) {
        for (const m of v2MembersData.members) {
          if (v1Data.members[m.id] && m.status) {
            v1Data.members[m.id].status = m.status;
          }
        }
      }

      return v1Data;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function formatShortTime(sec) {
      if (sec <= 0) return "00:00";
      const h = Math.floor(sec / 3600);
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return h > 0 ? h + ":" + m + ":" + s : m + ":" + s;
    }

    function updateChainBadge(elId, chainObj, isAlly) {
      const el = document.getElementById(elId);
      if (!chainObj || (!chainObj.current && !chainObj.cooldown)) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      if (chainObj.cooldown && chainObj.cooldown > 0) {
        const endUnix = chainObj.end ? chainObj.end + chainObj.cooldown : now + chainObj.cooldown;
        const rem = Math.max(0, endUnix - now);
        el.textContent = "Chain: " + (chainObj.current || 0) + " (CD " + formatShortTime(rem) + ")";
        el.className = "chain-badge chain-cooldown";
        return;
      }

      if (chainObj.current > 0) {
        const timeoutRem = chainObj.timeout || 0;
        const maxStr = chainObj.max ? "/" + chainObj.max : "";
        el.textContent = "Chain: " + chainObj.current + maxStr + " (" + formatShortTime(timeoutRem) + ")";

        if (isAlly) {
          if (timeoutRem > 0 && timeoutRem < 60) {
            el.className = "chain-badge chain-active chain-warn-red";
          } else if (timeoutRem > 0 && timeoutRem < 150) {
            el.className = "chain-badge chain-active chain-warn-yellow";
          } else {
            el.className = "chain-badge chain-active";
          }
        } else {
          el.className = timeoutRem > 0 && timeoutRem <= 60
            ? "chain-badge chain-active chain-warn-red"
            : "chain-badge chain-active";
        }
      } else {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
      }
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Fetching data for Faction " + selectedFactionId + "...";

      try {
        const allyData = await getFactionFull(selectedFactionId, key);
        allyData._fetchedAt = Math.floor(Date.now() / 1000);
        cachedData.ally = allyData;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";
        updateChainBadge("allyChain", allyData.chain, true);

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionFull(enemyId, key);
          enemyData._fetchedAt = Math.floor(Date.now() / 1000);
          cachedData.enemy = enemyData;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
          updateChainBadge("enemyChain", enemyData.chain, false);
        } else {
          cachedData.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
          updateChainBadge("enemyChain", null, false);
        }

        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 20s • Last updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diffSeconds) {
      if (state === "Okay") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => ({ id, ...m }));
      members.sort((a, b) => (a.status.until || 9999999999) - (b.status.until || 9999999999));

      tbody.innerHTML = members.map(m => {
        const until = m.status.until || 0;
        const diff = until > 0 ? until - now : 0;
        const timerText = until > 0 ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(m.status.state, diff);
        const readyClass = isAttackReady(m.status.state, diff) ? " atk-ready" : "";
        const statusDisplay = formatDetailedStatus(m.status);

        return '<tr>' +
          '<td><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.status.state + '">' + statusDisplay + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + m.status.state + '" data-until="' + until + '">' + timerText + '</span></td>' +
          '<td><a class="atk-btn' + readyClass + '" data-state="' + m.status.state + '" data-until="' + until + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a></td>' +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    function tickChainLocal(factionData, elId, isAlly) {
      if (!factionData || !factionData.chain || !factionData._fetchedAt) return;
      const elapsed = Math.floor(Date.now() / 1000) - factionData._fetchedAt;
      const c = factionData.chain;
      const liveChain = {
        current: c.current,
        max: c.max,
        timeout: c.timeout > 0 ? Math.max(0, c.timeout - elapsed) : 0,
        cooldown: c.cooldown > 0 ? Math.max(0, c.cooldown - elapsed) : 0,
        end: c.end
      };
      updateChainBadge(elId, liveChain, isAlly);
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);

      tickChainLocal(cachedData.ally, "allyChain", true);
      tickChainLocal(cachedData.enemy, "enemyChain", false);

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });
    }, 1000);

    setInterval(fetchWarData, 20000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
