<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 12px 14px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .key-group { display: flex; gap: 6px; }
    button { padding: 7px 14px; border: 1px solid #333; border-radius: 5px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.88rem; transition: 0.15s; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input { padding: 7px 10px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 205px; font-size: 0.88rem; }
    .meta { font-size: 0.8rem; color: #999; margin-bottom: 10px; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 820px) { .board { grid-template-columns: 1fr; } }
    .panel { background: #181818; border-radius: 6px; padding: 10px 10px 6px 10px; border: 1px solid #2b2b2b; overflow-x: auto; }
    h2 { margin: 0 0 8px 0; font-size: 1.02rem; border-bottom: 1px solid #303030; padding-bottom: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chain-badge { font-size: 0.8rem; font-family: monospace; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #242424; color: #aaa; border: 1px solid #383838; white-space: nowrap; }
    .chain-active { background: rgba(46, 125, 50, 0.25); color: #81c784; border-color: #388e3c; }
    .chain-cooldown { background: #b3e5fc; color: #01579b; border-color: #4fc3f7; box-shadow: 0 0 6px rgba(129, 212, 250, 0.45); }

    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.35); color: #fff59d; border-color: #fbc02d; }
      50% { background-color: rgba(253, 216, 53, 0.08); color: #fdd835; border-color: #7f6000; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(211, 47, 47, 0.85); color: #ffffff; border-color: #ff5252; }
      50% { background-color: rgba(183, 28, 28, 0.25); color: #ff8a80; border-color: #b71c1c; }
    }
    .chain-warn-yellow { animation: flashChainYellow 1.6s infinite; }
    .chain-warn-red { animation: flashChainRed 0.65s infinite; }

    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; table-layout: fixed; }
    thead tr { height: 26px; border-bottom: 1px solid #2e2e2e; }
    th { text-align: left; padding: 0 6px; color: #888; font-weight: 600; white-space: nowrap; line-height: 26px; }
    th.col-lvl { width: 42px; }
    th.col-status { width: 104px; }
    th.col-timer { width: 78px; }
    th.col-act { width: 66px; text-align: right; }

    tbody tr { height: 26px; border: none; }
    tbody tr:nth-child(odd) { background-color: #181818; }
    tbody tr:nth-child(even) { background-color: #202020; }
    tbody tr:hover { background-color: #2a2a2a; }

    td { text-align: left; padding: 0 6px; height: 26px; line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
    td.col-act { text-align: right; }

    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: 700; }
    .Jail { color: #ffa726; font-weight: 700; }
    .Traveling, .Abroad { color: #42a5f5; font-weight: 600; }
    .Federal { color: #ab47bc; font-weight: 600; }

    .timer { font-family: monospace; font-size: 0.84rem; padding: 1px 4px; border-radius: 3px; display: inline-block; line-height: 18px; vertical-align: middle; }
    a.player-link { color: #e8e8e8; text-decoration: none; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }

    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 0 8px; height: 20px; line-height: 20px; border-radius: 3px; text-decoration: none; font-size: 0.76rem; font-weight: 700; display: inline-block; vertical-align: middle; transition: 0.15s; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.75); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: 700; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: 700; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: 700; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Paste Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta" id="statusBar">Paste a Public API key in the top right and click Load.</div>

  <div class="board">
    <div class="panel">
      <h2>
        <span id="allyTitle">Razers</span>
        <span class="chain-badge" id="allyChain">Chain: -</span>
      </h2>
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th class="col-lvl">Lvl</th>
            <th class="col-status">Status</th>
            <th class="col-timer">Timer</th>
            <th class="col-act">Action</th>
          </tr>
        </thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>
        <span id="enemyTitle">Warring Opponent</span>
        <span class="chain-badge" id="enemyChain">Chain: -</span>
      </h2>
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th class="col-lvl">Lvl</th>
            <th class="col-status">Status</th>
            <th class="col-timer">Timer</th>
            <th class="col-act">Action</th>
          </tr>
        </thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const COUNTRY_CODES = [
      { keys: ["torn", "torn city"], code: "TC" },
      { keys: ["mexico", "mexican"], code: "MEX" },
      { keys: ["cayman", "cayman islands", "caymanian"], code: "CAY" },
      { keys: ["canada", "canadian"], code: "CAN" },
      { keys: ["hawaii", "hawaiian"], code: "HAW" },
      { keys: ["united kingdom", "uk", "british", "london"], code: "UK" },
      { keys: ["argentina", "argentinian"], code: "ARG" },
      { keys: ["switzerland", "swiss"], code: "SWI" },
      { keys: ["japan", "japanese"], code: "JAP" },
      { keys: ["china", "chinese"], code: "CHI" },
      { keys: ["uae", "united arab emirates", "emirati", "dubai"], code: "UAE" },
      { keys: ["south africa", "south african"], code: "SA" }
    ];

    let selectedFactionId = 40449;
    let cachedData = { ally: null, enemy: null };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    async function fetchJsonWithFallback(tornUrl) {
      const proxyUrls = [
        tornUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(tornUrl),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl)
      ];

      let lastErr = null;
      for (const targetUrl of proxyUrls) {
        try {
          const res = await fetch(targetUrl);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data.error) throw new Error(data.error.error);
          return data;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("Unable to reach Torn API");
    }

    async function getFactionFull(id, key) {
      const encodedKey = encodeURIComponent(key);
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&comment=RazersWarTracker&key=" + encodedKey;
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?comment=RazersWarTracker&key=" + encodedKey;

      const [v1Data, v2MembersData] = await Promise.all([
        fetchJsonWithFallback(v1Url),
        fetchJsonWithFallback(v2MembersUrl).catch(() => null)
      ]);

      if (v2MembersData && Array.isArray(v2MembersData.members)) {
        const mergedMembers = {};
        v2MembersData.members.forEach(m => {
          mergedMembers[m.id] = m;
        });
        v1Data.members = mergedMembers;
      }

      return v1Data;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function extractCountryCode(text) {
      if (!text) return null;
      const lower = text.toLowerCase();
      for (const entry of COUNTRY_CODES) {
        for (const k of entry.keys) {
          const regex = new RegExp("\\b" + k + "\\b", "i");
          if (regex.test(lower)) return entry.code;
        }
      }
      return null;
    }

    function getParsedMemberInfo(m) {
      const state = (m.status && m.status.state) ? m.status.state : "Okay";
      const desc = (m.status && m.status.description) ? m.status.description : "";
      const details = (m.status && m.status.details) ? m.status.details : "";
      const fullText = (desc + " " + details).trim();
      const lower = fullText.toLowerCase();

      if (state === "Hospital") {
        const code = extractCountryCode(fullText) || "TC";
        return {
          group: 1,
          label: "Hosp (" + code + ")",
          startLoc: code
        };
      }

      if (state === "Jail") {
        const code = extractCountryCode(fullText) || "TC";
        return {
          group: 1,
          label: "Jail (" + code + ")",
          startLoc: code
        };
      }

      if (state === "Traveling") {
        const code = extractCountryCode(fullText);
        if (code && code !== "TC") {
          if (lower.includes("returning to torn") || lower.includes("from ")) {
            return {
              group: 2,
              label: code + " > TC",
              startLoc: code
            };
          }
          return {
            group: 2,
            label: "TC > " + code,
            startLoc: "TC"
          };
        }
        return {
          group: 2,
          label: "Traveling",
          startLoc: "ZZZ"
        };
      }

      if (state === "Abroad") {
        const code = extractCountryCode(fullText) || "Abroad";
        return {
          group: 3,
          label: "Okay (" + code + ")",
          startLoc: code
        };
      }

      if (state === "Okay") {
        const code = extractCountryCode(fullText);
        if (code && code !== "TC") {
          return {
            group: 3,
            label: "Okay (" + code + ")",
            startLoc: code
          };
        }
        return {
          group: 4,
          label: "Okay (TC)",
          startLoc: "TC"
        };
      }

      return {
        group: 5,
        label: state,
        startLoc: "ZZZ"
      };
    }

    function formatShortTime(seconds) {
      if (seconds <= 0) return "00:00";
      const h = Math.floor(seconds / 3600);
      const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
      const s = String(seconds % 60).padStart(2, "0");
      return h > 0 ? (String(h).padStart(2, "0") + ":" + m + ":" + s) : (m + ":" + s);
    }

    function updateChainBadge(badgeId, chainObj, isAlly) {
      const badge = document.getElementById(badgeId);
      if (!chainObj || (!chainObj.current && !chainObj.cooldown)) {
        badge.textContent = "Chain: None";
        badge.className = "chain-badge";
        return;
      }

      const now = Math.floor(Date.now() / 1000);

      if (chainObj.cooldown && chainObj.cooldown > 0) {
        const endTs = chainObj.end ? (chainObj.end + chainObj.cooldown) : (now + chainObj.cooldown);
        const rem = Math.max(0, endTs - now);
        if (rem > 0) {
          badge.textContent = "Chain: " + chainObj.current + " (CD " + formatShortTime(rem) + ")";
          badge.className = "chain-badge chain-cooldown";
          return;
        }
      }

      if (chainObj.current && chainObj.current > 0) {
        let rem = 0;
        if (chainObj.timeout && chainObj.timeout > 0) {
          const fetchedAt = chainObj._fetchedAt || now;
          rem = Math.max(0, chainObj.timeout - (now - fetchedAt));
        }
        const maxStr = chainObj.max ? ("/" + chainObj.max) : "";
        badge.textContent = "Chain: " + chainObj.current + maxStr + (rem > 0 ? (" (" + formatShortTime(rem) + ")") : "");

        let warnClass = "chain-badge chain-active";
        if (rem > 0) {
          if (isAlly) {
            if (rem < 60) {
              warnClass += " chain-warn-red";
            } else if (rem < 150) {
              warnClass += " chain-warn-yellow";
            }
          } else {
            if (rem <= 60) {
              warnClass += " chain-warn-red";
            }
          }
        }
        badge.className = warnClass;
        return;
      }

      badge.textContent = "Chain: None";
      badge.className = "chain-badge";
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Fetching live data for Faction " + selectedFactionId + "...";

      try {
        const fetchTime = Math.floor(Date.now() / 1000);
        const allyData = await getFactionFull(selectedFactionId, key);
        if (allyData.chain) allyData.chain._fetchedAt = fetchTime;
        cachedData.ally = allyData;

        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";
        updateChainBadge("allyChain", allyData.chain, true);

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyFetchTime = Math.floor(Date.now() / 1000);
          const enemyData = await getFactionFull(enemyId, key);
          if (enemyData.chain) enemyData.chain._fetchedAt = enemyFetchTime;
          cachedData.enemy = enemyData;

          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
          updateChainBadge("enemyChain", enemyData.chain, false);
        } else {
          cachedData.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
          updateChainBadge("enemyChain", null, false);
        }

        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 20s • Last updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diffSeconds) {
      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => {
        const parsed = getParsedMemberInfo(m);
        return { id, ...m, parsed };
      });

      members.sort((a, b) => {
        if (a.parsed.group !== b.parsed.group) {
          return a.parsed.group - b.parsed.group;
        }
        if (a.parsed.group === 1) {
          return (a.status.until || 9999999999) - (b.status.until || 9999999999);
        }
        if (a.parsed.group === 2) {
          const locCmp = a.parsed.startLoc.localeCompare(b.parsed.startLoc);
          if (locCmp !== 0) return locCmp;
          return a.parsed.label.localeCompare(b.parsed.label);
        }
        if (a.parsed.group === 3) {
          const locCmp = a.parsed.startLoc.localeCompare(b.parsed.startLoc);
          if (locCmp !== 0) return locCmp;
        }
        return (a.name || "").localeCompare(b.name || "");
      });

      tbody.innerHTML = members.map(m => {
        const state = (m.status && m.status.state) ? m.status.state : "Okay";
        const until = (m.status && m.status.until) ? m.status.until : 0;
        const diff = until > 0 ? until - now : 0;
        const timerText = (state === "Hospital" || state === "Jail") && until > 0 ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(state, diff);
        const readyClass = isAttackReady(state, diff) ? " atk-ready" : "";
        const atkUrl = "https://www.torn.com/page.php?sid=attack&user2ID=" + m.id;
        const statusClass = (state === "Abroad") ? "Okay" : state;

        return '<tr>' +
          '<td><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a></td>' +
          '<td class="col-lvl">' + m.level + '</td>' +
          '<td class="col-status ' + statusClass + '">' + m.parsed.label + '</td>' +
          '<td class="col-timer"><span class="timer ' + alertClass + '" data-state="' + state + '" data-until="' + until + '">' + timerText + '</span></td>' +
          '<td class="col-act"><a class="atk-btn' + readyClass + '" data-state="' + state + '" data-until="' + until + '" href="' + atkUrl + '" target="_blank">Attack</a></td>' +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);

      if (cachedData.ally && cachedData.ally.chain) {
        updateChainBadge("allyChain", cachedData.ally.chain, true);
      }
      if (cachedData.enemy && cachedData.enemy.chain) {
        updateChainBadge("enemyChain", cachedData.enemy.chain, false);
      }

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if ((state === "Hospital" || state === "Jail") && until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });
    }, 1000);

    setInterval(fetchWarData, 20000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
