<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .key-group { display: flex; gap: 8px; }
    button { padding: 10px 18px; border: 1px solid #333; border-radius: 6px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: 0.15s; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input { padding: 9px 12px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 220px; }
    .meta { font-size: 0.85rem; color: #999; margin-bottom: 16px; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 850px) { .board { grid-template-columns: 1fr; } }
    .panel { background: #1a1a1a; border-radius: 8px; padding: 16px; border: 1px solid #2c2c2c; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 8px; }
    h2 { margin: 0; font-size: 1.15rem; }
    .chain-badge { font-family: monospace; font-size: 0.85rem; font-weight: 700; padding: 4px 10px; border-radius: 5px; background: #252525; color: #888; border: 1px solid #383838; white-space: nowrap; }
    .chain-active { background: rgba(46, 125, 50, 0.25); color: #81c784; border-color: #4caf50; }
    .chain-cooldown { background-color: #b3e5fc; color: #01579b; border-color: #4fc3f7; box-shadow: 0 0 8px rgba(179, 229, 252, 0.45); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #262626; white-space: nowrap; }
    th { color: #888; font-weight: 600; }
    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: bold; }
    .Jail { color: #ffa726; font-weight: bold; }
    .Traveling, .Abroad { color: #42a5f5; font-weight: 600; }
    .timer { font-family: monospace; font-size: 0.95rem; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    a.player-link { color: #fff; text-decoration: none; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }
    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: bold; display: inline-block; transition: 0.15s; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.28); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.5); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.35); color: #fff59d; border-color: #fdd835; }
      50% { background-color: #252525; color: #fdd835; border-color: #555; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.6); color: #ffffff; border-color: #ff5252; }
      50% { background-color: #252525; color: #ff5252; border-color: #555; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 8px rgba(76, 175, 80, 0.8); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .chain-yellow-slow { animation: flashChainYellow 1.6s infinite; }
    .chain-red-fast { animation: flashChainRed 0.65s infinite; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Paste Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta" id="statusBar">Paste a Public API key in the top right and click Load.</div>

  <div class="board">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers</h2>
        <span class="chain-badge" id="allyChain">Chain: -</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: -</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const CITY_CODES = [
      { match: /torn/i, code: "TC" },
      { match: /mexico|mexican/i, code: "MEX" },
      { match: /cayman/i, code: "CAY" },
      { match: /canada|canadian/i, code: "CAN" },
      { match: /hawaii/i, code: "HAW" },
      { match: /united kingdom|british|uk/i, code: "UK" },
      { match: /argentina|argentinian/i, code: "ARG" },
      { match: /switzerland|swiss/i, code: "SWI" },
      { match: /japan|japanese/i, code: "JAP" },
      { match: /china|chinese/i, code: "CHI" },
      { match: /uae|emirates|emirati/i, code: "UAE" },
      { match: /south africa/i, code: "SA" }
    ];

    function getCityCode(text) {
      if (!text) return null;
      for (const entry of CITY_CODES) {
        if (entry.match.test(text)) return entry.code;
      }
      return null;
    }

    function formatDetailedStatus(statusObj) {
      if (!statusObj) return "Unknown";
      const state = statusObj.state || "Unknown";
      const desc = statusObj.description || "";
      const details = statusObj.details || "";
      const fullText = (desc + " " + details).trim();

      if (state === "Okay") return "Okay";

      if (state === "Hospital") {
        const city = getCityCode(fullText);
        return city ? "Hosp (" + city + ")" : "Hosp (TC)";
      }

      if (state === "Jail") {
        const city = getCityCode(fullText);
        return city ? "Jail (" + city + ")" : "Jail (TC)";
      }

      if (state === "Traveling") {
        if (/returning to torn/i.test(fullText)) {
          const fromPart = fullText.replace(/returning to torn from/i, "");
          const fromCity = getCityCode(fromPart);
          return fromCity ? fromCity + " > TC" : "Abroad > TC";
        }
        if (/traveling to/i.test(fullText)) {
          const toPart = fullText.replace(/traveling to/i, "");
          const toCity = getCityCode(toPart);
          return toCity ? "TC > " + toCity : "TC > Abroad";
        }
        const anyCity = getCityCode(fullText);
        return anyCity ? "TC > " + anyCity : "Traveling";
      }

      if (state === "Abroad") {
        const city = getCityCode(fullText);
        return city || "Abroad";
      }

      return state;
    }

    let selectedFactionId = 40449;
    let cachedData = { ally: null, enemy: null };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    async function fetchJsonWithFallback(tornUrl) {
      const strategies = [
        async () => {
          const r = await fetch(tornUrl);
          if (!r.ok) throw new Error("Direct HTTP " + r.status);
          return await r.json();
        },
        async () => {
          const r = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(tornUrl));
          if (!r.ok) throw new Error("Relay1 HTTP " + r.status);
          const wrapped = await r.json();
          return JSON.parse(wrapped.contents);
        },
        async () => {
          const r = await fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl));
          if (!r.ok) throw new Error("Relay2 HTTP " + r.status);
          return await r.json();
        }
      ];

      let lastErr = null;
      for (const attempt of strategies) {
        try {
          const data = await attempt();
          if (data && typeof data === "object") return data;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("Network blocked by browser or proxy");
    }

    async function getFaction(id, key) {
      const cleanKey = encodeURIComponent(key);
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + cleanKey + "&comment=RazersWarTracker";
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?striptags=true&key=" + cleanKey + "&comment=RazersWarTracker";

      const [v1Data, v2MembersData] = await Promise.all([
        fetchJsonWithFallback(v1Url),
        fetchJsonWithFallback(v2MembersUrl).catch(() => null)
      ]);

      if (v1Data.error) throw new Error(v1Data.error.error);

      if (v2MembersData && !v2MembersData.error && Array.isArray(v2MembersData.members)) {
        const mergedMembers = {};
        for (const m of v2MembersData.members) {
          mergedMembers[m.id] = {
            name: m.name,
            level: m.level,
            status: m.status || { state: "Unknown", description: "", until: 0 }
          };
        }
        v1Data.members = mergedMembers;
      }

      return v1Data;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function formatShortClock(sec) {
      if (sec <= 0) return "00:00";
      const h = Math.floor(sec / 3600);
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return h > 0 ? h + ":" + m + ":" + s : m + ":" + s;
    }

    function updateChainDisplay(chainObj, elementId, isAlly) {
      const el = document.getElementById(elementId);
      if (!chainObj || (!chainObj.current && !chainObj.cooldown)) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const end = chainObj.end || 0;
      const start = chainObj.start || 0;
      const rawTimeout = chainObj.timeout || 0;
      const rawCooldown = chainObj.cooldown || 0;

      if (rawCooldown > 0) {
        const baseTime = end > 0 ? end : start;
        const cdLeft = baseTime > 0 ? Math.max(0, (baseTime + rawCooldown) - now) : rawCooldown;
        el.textContent = "Chain: " + chainObj.current + " (CD " + formatShortClock(cdLeft) + ")";
        el.className = "chain-badge chain-cooldown";
        return;
      }

      if (chainObj.current > 0) {
        const rem = end > 0 ? Math.max(0, end - now) : rawTimeout;
        const maxStr = chainObj.max ? "/" + chainObj.max : "";
        el.textContent = "Chain: " + chainObj.current + maxStr + " (" + formatShortClock(rem) + ")";

        if (isAlly) {
          if (rem > 0 && rem < 60) {
            el.className = "chain-badge chain-red-fast";
          } else if (rem > 0 && rem < 150) {
            el.className = "chain-badge chain-yellow-slow";
          } else {
            el.className = "chain-badge chain-active";
          }
        } else {
          el.className = "chain-badge chain-active";
        }
        return;
      }

      el.textContent = "Chain: None";
      el.className = "chain-badge";
    }

    function updateAllChains() {
      updateChainDisplay(cachedData.ally ? cachedData.ally.chain : null, "allyChain", true);
      updateChainDisplay(cachedData.enemy ? cachedData.enemy.chain : null, "enemyChain", false);
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Fetching live war data...";

      try {
        const allyData = await getFaction(selectedFactionId, key);
        cachedData.ally = allyData;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFaction(enemyId, key);
          cachedData.enemy = enemyData;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
        } else {
          cachedData.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
        }

        updateAllChains();
        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 20s • Last updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diffSeconds) {
      if (state === "Okay") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => ({ id, ...m }));
      members.sort((a, b) => (a.status.until || 9999999999) - (b.status.until || 9999999999));

      tbody.innerHTML = members.map(m => {
        const until = m.status.until || 0;
        const diff = until > 0 ? until - now : 0;
        const timerText = until > 0 ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(m.status.state, diff);
        const readyClass = isAttackReady(m.status.state, diff) ? " atk-ready" : "";
        const detailedStatus = formatDetailedStatus(m.status);
        const attackHref = "https://www.torn.com/page.php?sid=attack&user2ID=" + m.id;

        return '<tr>' +
          '<td><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.status.state + '">' + detailedStatus + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + m.status.state + '" data-until="' + until + '">' + timerText + '</span></td>' +
          '<td><a class="atk-btn' + readyClass + '" data-state="' + m.status.state + '" data-until="' + until + '" href="' + attackHref + '" target="_blank">Attack</a></td>' +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);

      updateAllChains();

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });
    }, 1000);

    setInterval(fetchWarData, 20000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
