<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 12px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .key-group { display: flex; gap: 6px; }
    button { padding: 6px 14px; border: 1px solid #333; border-radius: 5px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.88rem; transition: 0.15s; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input { padding: 6px 10px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 205px; font-size: 0.88rem; }
    .meta { font-size: 0.8rem; color: #888; margin-bottom: 10px; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .board { grid-template-columns: 1fr; } }
    .panel { background: #181818; border-radius: 6px; padding: 10px; border: 1px solid #2a2a2a; }
    h2 { margin: 0 0 6px 0; font-size: 1.05rem; border-bottom: 1px solid #2e2e2e; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; border-spacing: 0; font-size: 0.84rem; }
    thead tr { height: 24px; }
    th { text-align: left; padding: 0 6px; border-bottom: 1px solid #2c2c2c; color: #888; font-weight: 600; white-space: nowrap; font-size: 0.8rem; line-height: 24px; }
    tbody tr { height: 26px; }
    tbody tr:nth-child(odd) { background-color: #181818; }
    tbody tr:nth-child(even) { background-color: #202020; }
    tbody tr:hover { background-color: #282828; }
    td { text-align: left; padding: 0 6px; border: none; white-space: nowrap; height: 26px; line-height: 26px; vertical-align: middle; }
    .Okay { color: #66bb6a; }
    .OkayAbroad { color: #81c784; }
    .Hospital { color: #ef5350; font-weight: bold; }
    .Jail { color: #ffa726; font-weight: bold; }
    .Traveling { color: #42a5f5; }
    .Fallen { color: #9e9e9e; font-style: italic; }
    .timer { font-family: monospace; font-size: 0.86rem; padding: 1px 5px; border-radius: 3px; display: inline-block; line-height: 1.2; }
    a.player-link { color: #e8e8e8; text-decoration: none; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }
    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 2px 8px; border-radius: 3px; text-decoration: none; font-size: 0.78rem; font-weight: bold; display: inline-block; line-height: 1.25; transition: 0.15s; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    .fallen-dash { color: #555; font-size: 0.8rem; }

    /* Chain Tracker Badges */
    .chain-badge { font-size: 0.78rem; font-family: monospace; padding: 2px 7px; border-radius: 4px; background: #222; border: 1px solid #383838; color: #aaa; font-weight: 600; white-space: nowrap; }
    .chain-active { background: rgba(46, 125, 50, 0.25); border-color: #4caf50; color: #81c784; }
    .chain-cooldown { background: #b3e5fc; border-color: #4fc3f7; color: #01579b; box-shadow: 0 0 6px rgba(179, 229, 252, 0.35); }

    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.32); border-color: #fdd835; color: #fff59d; }
      50% { background-color: rgba(253, 216, 53, 0.08); border-color: #9e8615; color: #fdd835; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(211, 47, 47, 0.55); border-color: #ff5252; color: #ffffff; }
      50% { background-color: rgba(211, 47, 47, 0.12); border-color: #8e1c1c; color: #ff8a80; }
    }
    .chain-warn-yellow { animation: flashChainYellow 1.6s infinite; }
    .chain-warn-red { animation: flashChainRed 0.65s infinite; }

    /* Member Timer Warning Animations */
    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.8); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Paste Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta" id="statusBar">Paste a Public API key in the top right and click Load.</div>

  <div class="board">
    <div class="panel">
      <h2>
        <span id="allyTitle">Razers [40449]</span>
        <span class="chain-badge" id="allyChain" data-is-ally="1">Chain: -</span>
      </h2>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>
        <span id="enemyTitle">Warring Opponent</span>
        <span class="chain-badge" id="enemyChain" data-is-ally="0">Chain: -</span>
      </h2>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const COUNTRY_CODES = [
      { code: "MEX", terms: ["mexico", "mexican"] },
      { code: "CAY", terms: ["cayman", "caymanian"] },
      { code: "CAN", terms: ["canada", "canadian"] },
      { code: "HAW", terms: ["hawaii", "hawaiian"] },
      { code: "UK",  terms: ["united kingdom", "british", "uk"] },
      { code: "ARG", terms: ["argentina", "argentinian"] },
      { code: "SWI", terms: ["switzerland", "swiss"] },
      { code: "JAP", terms: ["japan", "japanese"] },
      { code: "CHI", terms: ["china", "chinese"] },
      { code: "UAE", terms: ["uae", "emirati", "united arab emirates"] },
      { code: "SA",  terms: ["south africa", "south african"] },
      { code: "TC",  terms: ["torn city", "torn"] }
    ];

    let selectedFactionId = 40449;
    let cachedData = { ally: null, enemy: null };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    async function fetchJsonWithFallback(targetUrl) {
      const endpoints = [
        targetUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl)
      ];

      let lastErr = null;
      for (const ep of endpoints) {
        try {
          const res = await fetch(ep);
          if (!res.ok) {
            lastErr = new Error("HTTP " + res.status);
            continue;
          }
          const text = await res.text();
          const data = JSON.parse(text);
          if (data && data.error) {
            throw new Error(data.error.error || "Torn API error");
          }
          return data;
        } catch (err) {
          lastErr = err;
          if (err.message && (err.message.includes("key") || err.message.includes("Incorrect"))) {
            throw err;
          }
        }
      }
      throw lastErr || new Error("Unable to reach Torn API");
    }

    async function getFactionFull(id, key) {
      const basicUrl = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      const membersV2Url = "https://api.torn.com/v2/faction/" + id + "/members?striptags=true&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";

      const [basicData, v2Data] = await Promise.all([
        fetchJsonWithFallback(basicUrl),
        fetchJsonWithFallback(membersV2Url).catch(() => null)
      ]);

      if (v2Data && Array.isArray(v2Data.members)) {
        basicData.v2Members = v2Data.members;
      }
      return basicData;
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function updateChainBadge(badgeId, chainObj, isAlly) {
      const el = document.getElementById(badgeId);
      if (!chainObj || (!chainObj.current && !chainObj.cooldown)) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        el.dataset.end = "0";
        el.dataset.mode = "none";
        el.dataset.current = "0";
        el.dataset.max = "0";
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      el.dataset.current = chainObj.current || 0;
      el.dataset.max = chainObj.max || 0;

      if (chainObj.cooldown && chainObj.cooldown > 0) {
        const endUnix = chainObj.end ? chainObj.end : (now + chainObj.cooldown);
        el.dataset.mode = "cooldown";
        el.dataset.end = endUnix;
        renderChainTick(el, now);
      } else if (chainObj.timeout && chainObj.timeout > 0) {
        const endUnix = chainObj.end ? chainObj.end : (now + chainObj.timeout);
        el.dataset.mode = "active";
        el.dataset.end = endUnix;
        renderChainTick(el, now);
      } else {
        el.textContent = "Chain: " + chainObj.current + "/" + chainObj.max;
        el.className = "chain-badge chain-active";
        el.dataset.mode = "static";
        el.dataset.end = "0";
      }
    }

    function renderChainTick(el, now) {
      const mode = el.dataset.mode;
      const endUnix = Number(el.dataset.end);
      const isAlly = el.dataset.isAlly === "1";
      if (!endUnix || mode === "none" || mode === "static") return;

      const diff = Math.max(0, endUnix - now);
      const m = String(Math.floor(diff / 60)).padStart(2, "0");
      const s = String(diff % 60).padStart(2, "0");

      if (mode === "cooldown") {
        el.textContent = "Chain: " + el.dataset.current + " (CD " + m + ":" + s + ")";
        el.className = "chain-badge chain-cooldown";
      } else if (mode === "active") {
        el.textContent = "Chain: " + el.dataset.current + "/" + el.dataset.max + " (" + m + ":" + s + ")";
        if (isAlly && diff > 0 && diff < 60) {
          el.className = "chain-badge chain-warn-red";
        } else if (isAlly && diff > 0 && diff < 150) {
          el.className = "chain-badge chain-warn-yellow";
        } else if (!isAlly && diff > 0 && diff <= 60) {
          el.className = "chain-badge chain-warn-red";
        } else {
          el.className = "chain-badge chain-active";
        }
      }
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Fetching data for Faction " + selectedFactionId + "...";

      try {
        const allyData = await getFactionFull(selectedFactionId, key);
        cachedData.ally = allyData;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";
        updateChainBadge("allyChain", allyData.chain, true);

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionFull(enemyId, key);
          cachedData.enemy = enemyData;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
          updateChainBadge("enemyChain", enemyData.chain, false);
        } else {
          cachedData.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
          updateChainBadge("enemyChain", null, false);
        }

        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 20s • Last updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function detectCountryCode(text) {
      if (!text) return null;
      const lower = text.toLowerCase();
      for (const c of COUNTRY_CODES) {
        for (const term of c.terms) {
          const regex = new RegExp("\\b" + term + "\\b", "i");
          if (regex.test(lower)) return c.code;
        }
      }
      return null;
    }

    function parseMemberStatus(statusObj) {
      const state = statusObj.state || "Okay";
      const desc = statusObj.description || "";
      const details = statusObj.details || "";
      const combined = (desc + " " + details).trim();
      const lowerDesc = desc.toLowerCase();

      if (state === "Fallen") {
        return { text: "Fallen", css: "Fallen", tier: 5, sortKey: "" };
      }

      if (state === "Hospital") {
        const code = detectCountryCode(combined) || "TC";
        return { text: "Hosp (" + code + ")", css: "Hospital", tier: 1, sortKey: code };
      }

      if (state === "Jail") {
        const code = detectCountryCode(combined) || "TC";
        return { text: "Jail (" + code + ")", css: "Jail", tier: 1, sortKey: code };
      }

      if (state === "Traveling") {
        if (lowerDesc.includes("returning to torn")) {
          const origin = detectCountryCode(desc.replace(/returning to torn/i, "")) || "ABROAD";
          const route = origin + " > TC";
          return { text: route, css: "Traveling", tier: 2, sortKey: origin };
        }
        if (lowerDesc.includes("traveling to")) {
          const dest = detectCountryCode(desc.replace(/traveling to/i, "")) || "ABROAD";
          const route = "TC > " + dest;
          return { text: route, css: "Traveling", tier: 2, sortKey: "TC" };
        }
        const fallbackCode = detectCountryCode(combined);
        if (fallbackCode && fallbackCode !== "TC") {
          const route = "TC > " + fallbackCode;
          return { text: route, css: "Traveling", tier: 2, sortKey: "TC" };
        }
        return { text: "Traveling", css: "Traveling", tier: 2, sortKey: "ZZZ" };
      }

      if (state === "Abroad") {
        const code = detectCountryCode(combined) || "ABROAD";
        return { text: "Okay (" + code + ")", css: "OkayAbroad", tier: 3, sortKey: code };
      }

      if (state === "Okay") {
        const code = detectCountryCode(combined);
        if (code && code !== "TC") {
          return { text: "Okay (" + code + ")", css: "OkayAbroad", tier: 3, sortKey: code };
        }
        return { text: "Okay (TC)", css: "Okay", tier: 4, sortKey: "TC" };
      }

      return { text: state, css: state, tier: 4, sortKey: state };
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diffSeconds) {
      if (state === "Fallen") return false;
      if (state === "Okay") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || (!factionData.members && !factionData.v2Members)) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      let members = [];

      if (Array.isArray(factionData.v2Members) && factionData.v2Members.length > 0) {
        members = factionData.v2Members.map(m => ({
          id: m.id,
          name: m.name,
          level: m.level,
          status: m.status || { state: "Okay", description: "", until: 0 }
        }));
      } else {
        members = Object.entries(factionData.members).map(([id, m]) => ({ id, ...m }));
      }

      // Attach parsed status metadata for accurate multi-tier sorting
      members.forEach(m => {
        m.parsed = parseMemberStatus(m.status);
      });

      // Tier 1: Hospital/Jail (soonest to longest)
      // Tier 2: Traveling (alphabetically by starting location)
      // Tier 3: Abroad / Okay overseas (alphabetically by country code)
      // Tier 4: Okay (TC) (alphabetically by player name)
      // Tier 5: Fallen
      members.sort((a, b) => {
        if (a.parsed.tier !== b.parsed.tier) {
          return a.parsed.tier - b.parsed.tier;
        }
        if (a.parsed.tier === 1) {
          const untilA = a.status.until || 9999999999;
          const untilB = b.status.until || 9999999999;
          if (untilA !== untilB) return untilA - untilB;
        }
        if (a.parsed.tier === 2 || a.parsed.tier === 3) {
          const cmp = a.parsed.sortKey.localeCompare(b.parsed.sortKey);
          if (cmp !== 0) return cmp;
        }
        return (a.name || "").localeCompare(b.name || "");
      });

      tbody.innerHTML = members.map(m => {
        const until = m.status.until || 0;
        const diff = until > 0 ? until - now : 0;
        const timerText = until > 0 ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(m.status.state, diff);
        const readyClass = isAttackReady(m.status.state, diff) ? " atk-ready" : "";
        const isFallen = m.status.state === "Fallen";

        const actionCell = isFallen
          ? '<span class="fallen-dash">-</span>'
          : '<a class="atk-btn' + readyClass + '" data-state="' + m.status.state + '" data-until="' + until + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a>';

        return '<tr>' +
          '<td><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.parsed.css + '">' + m.parsed.text + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + m.status.state + '" data-until="' + until + '">' + timerText + '</span></td>' +
          '<td>' + actionCell + '</td>' +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);

      renderChainTick(document.getElementById("allyChain"), now);
      renderChainTick(document.getElementById("enemyChain"), now);

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });
    }, 1000);

    setInterval(fetchWarData, 20000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
