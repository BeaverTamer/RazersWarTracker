<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 10px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .key-group { display: flex; gap: 6px; align-items: center; }
    button { padding: 7px 13px; border: 1px solid #333; border-radius: 5px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.15s; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input { padding: 6px 10px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 175px; font-size: 0.85rem; }
    .meta-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #888; margin-bottom: 10px; gap: 6px; }
    .loc-badge { background: #222; border: 1px solid #383838; color: #b0bec5; padding: 2px 7px; border-radius: 4px; font-weight: 600; font-family: monospace; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; touch-action: pan-y; }
    @media (max-width: 820px) { .board { grid-template-columns: 1fr; gap: 10px; } }
    .panel { background: #181818; border-radius: 6px; padding: 10px; border: 1px solid #2a2a2a; overflow-x: auto; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2e2e2e; padding-bottom: 6px; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
    h2 { margin: 0; font-size: 1rem; color: #fff; }
    .chain-badge { font-family: monospace; font-size: 0.8rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; background: #252525; color: #999; border: 1px solid #383838; white-space: nowrap; }
    .chain-active { background: rgba(46, 125, 50, 0.25); color: #81c784; border-color: #4caf50; }
    .chain-cooldown { background: #b3e5fc; color: #01579b; border-color: #4fc3f7; box-shadow: 0 0 6px rgba(179, 229, 252, 0.45); }

    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.35); color: #fff59d; border-color: #fdd835; }
      50% { background-color: rgba(253, 216, 53, 0.08); color: #fdd835; border-color: #9e8714; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.55); color: #ffffff; border-color: #ff5252; }
      50% { background-color: rgba(229, 57, 53, 0.12); color: #ff8a80; border-color: #8e1e1b; }
    }
    .chain-warn-yellow { animation: flashChainYellow 1.5s infinite; }
    .chain-warn-red { animation: flashChainRed 0.6s infinite; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead tr { height: 24px; border-bottom: 1px solid #2e2e2e; }
    th { text-align: left; padding: 0 5px; color: #777; font-weight: 600; font-size: 0.76rem; white-space: nowrap; }
    tbody tr { height: 26px; }
    tbody tr:nth-child(odd) { background-color: #181818; }
    tbody tr:nth-child(even) { background-color: #202020; }
    tbody tr:hover { background-color: #292929; }
    td { text-align: left; padding: 0 5px; height: 26px; line-height: 26px; white-space: nowrap; border: none; vertical-align: middle; }

    .player-cell { display: flex; align-items: center; gap: 5px; max-width: 145px; overflow: hidden; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .dot-Online { background-color: #4caf50; box-shadow: 0 0 4px rgba(76, 175, 80, 0.7); }
    .dot-Idle { background-color: #ff9800; }
    .dot-Offline { background-color: #555555; }
    a.player-link { color: #f0f0f0; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }
    .last-act { color: #757575; font-size: 0.72rem; flex-shrink: 0; }

    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: 600; }
    .Jail { color: #ffa726; font-weight: 600; }
    .Traveling { color: #42a5f5; }
    .Fallen { color: #757575; font-style: italic; }

    .timer-col { padding-right: 8px; }
    .timer { font-family: monospace; font-size: 0.82rem; padding: 1px 5px; border-radius: 3px; display: inline-block; line-height: 18px; vertical-align: middle; }
    .action-col { padding-left: 6px; text-align: right; }
    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 0 8px; height: 20px; line-height: 20px; border-radius: 3px; text-decoration: none; font-size: 0.75rem; font-weight: bold; display: inline-block; vertical-align: middle; transition: 0.15s; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    .no-action { color: #555; font-size: 0.8rem; display: inline-block; width: 46px; text-align: center; }

    @media (max-width: 480px) {
      body { padding: 7px; }
      .panel { padding: 7px; }
      table { font-size: 0.78rem; }
      th, td { padding: 0 3px; }
      .player-cell { max-width: 108px; gap: 4px; }
      .timer-col { padding-right: 6px; }
      .timer { font-size: 0.76rem; padding: 1px 4px; }
      .action-col { padding-left: 5px; }
      a.atk-btn { padding: 0 6px; font-size: 0.72rem; }
      .no-action { width: 38px; }
    }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.8); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="text" id="apiKey" placeholder="Public Torn API Key" autocomplete="on" spellcheck="false" />
      <button class="load-btn" onclick="manualLoad()">Load</button>
    </div>
  </div>
  <div class="meta-row">
    <span id="statusBar">Enter a Public API key in the top right and click Load.</span>
    <span class="loc-badge" id="userLocBadge">Your Location: --</span>
  </div>

  <div class="board" id="swipeBoard">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers</h2>
        <span class="chain-badge" id="allyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th class="timer-col">Timer</th><th class="action-col">Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th class="timer-col">Timer</th><th class="action-col">Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    const CITY_CODES = [
      { match: /torn/i, code: "TC" },
      { match: /mexic/i, code: "MEX" },
      { match: /cayman/i, code: "CAY" },
      { match: /canad/i, code: "CAN" },
      { match: /hawai/i, code: "HAW" },
      { match: /british|united kingdom|uk|london/i, code: "UK" },
      { match: /argentin/i, code: "ARG" },
      { match: /switz|swiss/i, code: "SWI" },
      { match: /japan/i, code: "JAP" },
      { match: /chin/i, code: "CHI" },
      { match: /emirat|uae|dubai/i, code: "UAE" },
      { match: /south africa|sa/i, code: "SA" }
    ];

    const URL_PARAMS = new URLSearchParams(window.location.search);
    const KEY_STORAGE_NAME = "razers_torn_pub_key_v1";

    function saveApiKey(val) {
      const clean = (val || "").trim();
      if (!clean) return;
      try {
        localStorage.setItem(KEY_STORAGE_NAME, clean);
      } catch (e) {}
      document.cookie = KEY_STORAGE_NAME + "=" + encodeURIComponent(clean) + "; path=/; max-age=31536000; SameSite=Lax";
    }

    function loadSavedApiKey() {
      const fromUrl = URL_PARAMS.get("key");
      if (fromUrl && fromUrl.trim().length === 16) {
        saveApiKey(fromUrl.trim());
        return fromUrl.trim();
      }
      try {
        const fromLocal = localStorage.getItem(KEY_STORAGE_NAME) || localStorage.getItem("torn_pub_key");
        if (fromLocal && fromLocal.trim()) {
          saveApiKey(fromLocal.trim());
          return fromLocal.trim();
        }
      } catch (e) {}
      const cookieMatch = document.cookie.match(new RegExp("(?:^|; )" + KEY_STORAGE_NAME + "=([^;]*)"));
      if (cookieMatch) {
        const decoded = decodeURIComponent(cookieMatch[1]).trim();
        if (decoded) return decoded;
      }
      return "";
    }

    const savedTab = Number(sessionStorage.getItem("torn_active_tab"));
    let hasSessionTab = OUR_FACTIONS.some(f => f.id === savedTab);
    let selectedFactionId = hasSessionTab ? savedTab : 40449;
    let detectedHomeForKey = "";
    let cachedData = { ally: null, enemy: null };
    let userLocation = "TC";

    const keyInput = document.getElementById("apiKey");
    keyInput.value = loadSavedApiKey();

    keyInput.addEventListener("input", () => {
      const val = keyInput.value.trim();
      saveApiKey(val);
      if (val.length === 16) {
        hasSessionTab = false;
        sessionStorage.removeItem("torn_active_tab");
        detectedHomeForKey = "";
        fetchWarData();
      }
    });

    function manualLoad() {
      const val = keyInput.value.trim();
      saveApiKey(val);
      fetchWarData();
    }

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => selectFactionTab(fac.id);
      tabContainer.appendChild(btn);
    });

    function selectFactionTab(facId) {
      selectedFactionId = facId;
      hasSessionTab = true;
      sessionStorage.setItem("torn_active_tab", String(facId));
      updateActiveTab();
      fetchWarData();
    }

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    // Mobile touch swipe left/right to switch tabs
    let touchStartX = 0;
    let touchStartY = 0;
    const swipeBoard = document.getElementById("swipeBoard");

    swipeBoard.addEventListener("touchstart", e => {
      if (e.changedTouches.length > 0) {
        touchStartX = e.changedTouches[0].clientX;
        touchStartY = e.changedTouches[0].clientY;
      }
    }, { passive: true });

    swipeBoard.addEventListener("touchend", e => {
      if (e.changedTouches.length > 0) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          const idx = OUR_FACTIONS.findIndex(f => f.id === selectedFactionId);
          if (idx !== -1) {
            const nextIdx = dx < 0
              ? (idx + 1) % OUR_FACTIONS.length
              : (idx - 1 + OUR_FACTIONS.length) % OUR_FACTIONS.length;
            selectFactionTab(OUR_FACTIONS[nextIdx].id);
          }
        }
      }
    }, { passive: true });

    async function fetchTornJson(tornUrl) {
      const relays = [
        tornUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(tornUrl),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl)
      ];

      let lastErr = new Error("Unable to reach Torn API");
      for (const target of relays) {
        try {
          const res = await fetch(target);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          const data = JSON.parse(text);
          if (data && data.contents) {
            const inner = JSON.parse(data.contents);
            if (inner.error) throw new Error(inner.error.error);
            return inner;
          }
          if (data.error) throw new Error(data.error.error);
          return data;
        } catch (err) {
          lastErr = err;
          if (err.message && (err.message.includes("key") || err.message.includes("limit") || err.message.includes("ID"))) {
            throw err;
          }
        }
      }
      throw lastErr;
    }

    async function getUserProfile(key) {
      const url = "https://api.torn.com/user/?selections=basic&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      return await fetchTornJson(url);
    }

    async function getFactionFull(id, key) {
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";

      const [v1Data, v2Members] = await Promise.all([
        fetchTornJson(v1Url),
        fetchTornJson(v2MembersUrl).catch(() => null)
      ]);

      if (v2Members && Array.isArray(v2Members.members) && v1Data.members) {
        v2Members.members.forEach(m => {
          const existing = v1Data.members[String(m.id)];
          if (existing && m.status) {
            existing.status.description = m.status.description || existing.status.description;
            existing.status.details = m.status.details || existing.status.details;
            existing.status.state = m.status.state || existing.status.state;
            existing.status.until = m.status.until !== undefined ? m.status.until : existing.status.until;
          }
          if (existing && m.last_action) {
            existing.last_action = m.last_action;
          }
        });
      }
      return v1Data;
    }

    function detectCityCode(text) {
      if (!text) return null;
      for (const item of CITY_CODES) {
        if (item.match.test(text)) return item.code;
      }
      return null;
    }

    function updateUserLocation(userData) {
      if (!userData || !userData.status) return;
      const st = userData.status;
      const state = st.state || "";
      const fullText = (st.description || "") + " " + (st.details || "");

      if (state === "Traveling") {
        userLocation = "Traveling";
        document.getElementById("userLocBadge").textContent = "Your Location: Traveling";
        return;
      }

      const city = detectCityCode(fullText) || "TC";
      userLocation = city;
      document.getElementById("userLocBadge").textContent = "Your Location: " + city;
    }

    function formatShortLastAction(lastAction) {
      if (!lastAction) return "";
      if (lastAction.relative) {
        const rel = lastAction.relative.toLowerCase();
        const m = rel.match(/(\d+)\s*(second|minute|hour|day|week|month|year)/);
        if (m) {
          const unitMap = { second: "s", minute: "m", hour: "h", day: "d", week: "w", month: "mo", year: "y" };
          return m[1] + (unitMap[m[2]] || "");
        }
      }
      if (lastAction.timestamp) {
        const diff = Math.max(0, Math.floor(Date.now() / 1000) - Number(lastAction.timestamp));
        if (diff < 60) return diff + "s";
        if (diff < 3600) return Math.floor(diff / 60) + "m";
        if (diff < 86400) return Math.floor(diff / 3600) + "h";
        return Math.floor(diff / 86400) + "d";
      }
      return "";
    }

    function formatMemberStatus(statusObj) {
      const state = statusObj.state || "Okay";
      const desc = statusObj.description || "";
      const details = statusObj.details || "";
      const combined = (desc + " " + details).trim();

      if (state === "Fallen") {
        return { text: "Fallen", cssClass: "Fallen", tier: 5, sortKey: "", cityCode: "" };
      }

      if (state === "Hospital") {
        const code = detectCityCode(combined) || "TC";
        return { text: "Hosp (" + code + ")", cssClass: "Hospital", tier: 1, sortKey: code, cityCode: code };
      }

      if (state === "Jail") {
        const code = detectCityCode(combined) || "TC";
        return { text: "Jail (" + code + ")", cssClass: "Jail", tier: 1, sortKey: code, cityCode: code };
      }

      if (state === "Traveling") {
        const returnMatch = combined.match(/returning\s+to\s+torn\s+from\s+([a-z\s]+)/i);
        if (returnMatch) {
          const fromCode = detectCityCode(returnMatch[1]) || "ABROAD";
          const route = fromCode + " > TC";
          return { text: route, cssClass: "Traveling", tier: 2, sortKey: route, cityCode: "Traveling" };
        }

        const fromToMatch = combined.match(/from\s+([a-z\s]+?)\s+to\s+([a-z\s]+)/i);
        if (fromToMatch) {
          const fromCode = detectCityCode(fromToMatch[1]) || "TC";
          const toCode = detectCityCode(fromToMatch[2]) || "ABROAD";
          const route = fromCode + " > " + toCode;
          return { text: route, cssClass: "Traveling", tier: 2, sortKey: route, cityCode: "Traveling" };
        }

        const toMatch = combined.match(/(?:traveling|flying)\s+to\s+([a-z\s]+)/i);
        if (toMatch) {
          const toCode = detectCityCode(toMatch[1]) || "ABROAD";
          const route = "TC > " + toCode;
          return { text: route, cssClass: "Traveling", tier: 2, sortKey: route, cityCode: "Traveling" };
        }

        const fallbackCode = detectCityCode(combined);
        if (fallbackCode && fallbackCode !== "TC") {
          const route = "TC > " + fallbackCode;
          return { text: route, cssClass: "Traveling", tier: 2, sortKey: route, cityCode: "Traveling" };
        }

        return { text: "Traveling", cssClass: "Traveling", tier: 2, sortKey: "ZZZ", cityCode: "Traveling" };
      }

      if (state === "Abroad") {
        const code = detectCityCode(combined) || "ABROAD";
        return { text: "Okay (" + code + ")", cssClass: "Okay", tier: 3, sortKey: code, cityCode: code };
      }

      const okayCode = detectCityCode(combined) || "TC";
      if (okayCode !== "TC") {
        return { text: "Okay (" + okayCode + ")", cssClass: "Okay", tier: 3, sortKey: okayCode, cityCode: okayCode };
      }
      return { text: "Okay (TC)", cssClass: "Okay", tier: 4, sortKey: "TC", cityCode: "TC" };
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    function formatMinSec(sec) {
      if (sec <= 0) return "00:00";
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function updateChainBadge(elementId, chainObj, isAlly) {
      const el = document.getElementById(elementId);
      if (!chainObj || !chainObj.current || chainObj.current === 0) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        el.dataset.timeout = "0";
        el.dataset.cooldown = "0";
        el.dataset.current = "0";
        el.dataset.max = "0";
        el.dataset.ally = isAlly ? "1" : "0";
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const current = chainObj.current;
      const max = chainObj.max || "";
      const timeout = chainObj.timeout || 0;
      const cooldown = chainObj.cooldown || 0;

      el.dataset.current = current;
      el.dataset.max = max;
      el.dataset.timeout = timeout > 0 ? (now + timeout) : "0";
      el.dataset.cooldown = cooldown > 0 ? (now + cooldown) : "0";
      el.dataset.ally = isAlly ? "1" : "0";

      renderChainTick(el, now);
    }

    function renderChainTick(el, now) {
      const current = Number(el.dataset.current || 0);
      if (current <= 0) return;

      const max = el.dataset.max;
      const timeoutUntil = Number(el.dataset.timeout || 0);
      const cooldownUntil = Number(el.dataset.cooldown || 0);
      const isAlly = el.dataset.ally === "1";

      if (cooldownUntil > now) {
        const rem = cooldownUntil - now;
        el.textContent = "Chain: " + current + " (CD " + formatMinSec(rem) + ")";
        el.className = "chain-badge chain-cooldown";
      } else if (timeoutUntil > now) {
        const rem = timeoutUntil - now;
        const countLabel = max ? (current + "/" + max) : current;
        el.textContent = "Chain: " + countLabel + " (" + formatMinSec(rem) + ")";

        if (isAlly) {
          if (rem < 60) {
            el.className = "chain-badge chain-warn-red";
          } else if (rem < 150) {
            el.className = "chain-badge chain-warn-yellow";
          } else {
            el.className = "chain-badge chain-active";
          }
        } else {
          el.className = rem <= 60 ? "chain-badge chain-warn-red" : "chain-badge chain-active";
        }
      } else {
        el.textContent = "Chain: " + current;
        el.className = "chain-badge";
      }
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please enter a Torn Public API key first.";
        return;
      }
      saveApiKey(key);
      document.getElementById("statusBar").textContent = "Fetching data for Faction " + selectedFactionId + "...";

      try {
        const userData = await getUserProfile(key);
        updateUserLocation(userData);

        if (!hasSessionTab && detectedHomeForKey !== key) {
          detectedHomeForKey = key;
          const userFacId = userData && userData.faction ? Number(userData.faction.faction_id) : 0;
          const matchedHome = OUR_FACTIONS.find(f => f.id === userFacId);
          if (matchedHome) {
            selectedFactionId = matchedHome.id;
            updateActiveTab();
          }
        }

        const allyData = await getFactionFull(selectedFactionId, key);
        cachedData.ally = allyData;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";
        updateChainBadge("allyChain", allyData.chain, true);

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionFull(enemyId, key);
          cachedData.enemy = enemyData;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
          updateChainBadge("enemyChain", enemyData.chain, false);
        } else {
          cachedData.enemy = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
          updateChainBadge("enemyChain", null, false);
        }

        renderTables();
        document.getElementById("statusBar").textContent = allyData.name + " • Syncs every 15s • " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isSameLocation(targetCity) {
      if (!userLocation || userLocation === "Traveling") return false;
      return targetCity === userLocation;
    }

    function isAttackReady(state, diffSeconds, targetCity) {
      if (state === "Fallen") return false;
      if (!isSameLocation(targetCity)) return false;
      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const members = Object.entries(factionData.members).map(([id, m]) => {
        const rawState = m.status.state || "Okay";
        const until = m.status.until || 0;
        const parsed = formatMemberStatus(m.status);

        let effectiveState = rawState;
        let effectiveParsed = parsed;
        let effectiveUntil = until;
        let sortTier = parsed.tier;
        let sortUntil = until;

        if ((rawState === "Hospital" || rawState === "Jail") && until > 0) {
          const diff = until - now;
          if (diff <= -8) {
            effectiveState = "Okay";
            effectiveUntil = 0;
            const releasedCity = parsed.cityCode || "TC";
            effectiveParsed = {
              text: "Okay (" + releasedCity + ")",
              cssClass: "Okay",
              tier: releasedCity === "TC" ? 4 : 3,
              sortKey: releasedCity,
              cityCode: releasedCity
            };
            sortTier = effectiveParsed.tier;
            sortUntil = 9999999999;
          } else {
            sortTier = 1;
            sortUntil = until;
          }
        }

        return {
          id,
          ...m,
          effectiveState,
          effectiveUntil,
          parsed: effectiveParsed,
          sortTier,
          sortUntil
        };
      });

      members.sort((a, b) => {
        if (a.sortTier !== b.sortTier) return a.sortTier - b.sortTier;
        if (a.sortTier === 1) {
          return (a.sortUntil || 9999999999) - (b.sortUntil || 9999999999);
        }
        if (a.sortTier === 2 || a.sortTier === 3) {
          const cmp = a.parsed.sortKey.localeCompare(b.parsed.sortKey);
          if (cmp !== 0) return cmp;
        }
        return (a.name || "").localeCompare(b.name || "");
      });

      tbody.innerHTML = members.map(m => {
        const until = m.effectiveUntil;
        const diff = until > 0 ? until - now : 0;
        const timerText = until > 0 ? formatCountdown(diff) : "-";
        const alertClass = getTimerAlertClass(m.effectiveState, diff);

        const laStatus = m.last_action && m.last_action.status ? m.last_action.status : "Offline";
        const laShort = formatShortLastAction(m.last_action);
        const laTag = laShort ? '<span class="last-act">' + laShort + '</span>' : '';

        const isFallen = m.effectiveState === "Fallen";
        const readyClass = isAttackReady(m.effectiveState, diff, m.parsed.cityCode) ? " atk-ready" : "";

        const actionCell = isFallen
          ? '<td class="action-col"><span class="no-action">-</span></td>'
          : '<td class="action-col"><a class="atk-btn' + readyClass + '" data-state="' + m.effectiveState + '" data-until="' + until + '" data-city="' + m.parsed.cityCode + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a></td>';

        return '<tr>' +
          '<td><div class="player-cell"><span class="status-dot dot-' + laStatus + '" title="' + laStatus + '"></span><a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a>' + laTag + '</div></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.parsed.cssClass + '">' + m.parsed.text + '</td>' +
          '<td class="timer-col"><span class="timer ' + alertClass + '" data-state="' + m.effectiveState + '" data-until="' + until + '" data-city="' + m.parsed.cityCode + '">' + timerText + '</span></td>' +
          actionCell +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      let needsResort = false;

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
          if ((state === "Hospital" || state === "Jail") && diff <= -8) {
            needsResort = true;
          }
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const city = btn.dataset.city || "";
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff, city)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });

      if (needsResort) {
        renderTables();
      }

      const allyChainEl = document.getElementById("allyChain");
      const enemyChainEl = document.getElementById("enemyChain");
      if (allyChainEl) renderChainTick(allyChainEl, now);
      if (enemyChainEl) renderChainTick(enemyChainEl, now);
    }, 1000);

    setInterval(fetchWarData, 15000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
