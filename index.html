<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 10px;
      font-size: 0.85rem;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .key-group {
      display: flex;
      gap: 6px;
    }
    button {
      padding: 6px 12px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #1e1e1e;
      color: #ccc;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      width: 170px;
      font-size: 0.85rem;
    }
    .meta {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 10px;
    }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 820px) {
      .board { grid-template-columns: 1fr; gap: 14px; }
      body { padding: 6px; }
    }
    .panel {
      background: #181818;
      border-radius: 6px;
      padding: 10px;
      border: 1px solid #2a2a2a;
      overflow-x: auto;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2e2e2e;
      padding-bottom: 7px;
      margin-bottom: 6px;
      gap: 8px;
    }
    h2 {
      margin: 0;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chain-badge {
      font-family: monospace;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: #252525;
      color: #aaa;
      border: 1px solid #383838;
      white-space: nowrap;
      font-weight: 600;
    }
    .chain-active {
      background: rgba(46, 125, 50, 0.25);
      color: #81c784;
      border-color: #388e3c;
    }
    .chain-cooldown {
      background: #b3e5fc;
      color: #01579b;
      border-color: #4fc3f7;
      box-shadow: 0 0 6px rgba(79, 195, 247, 0.45);
    }
    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.3); color: #fff59d; border-color: #fbc02d; }
      50% { background-color: #252525; color: #fdd835; border-color: #555; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.55); color: #ffffff; border-color: #ff5252; }
      50% { background-color: #252525; color: #ff5252; border-color: #555; }
    }
    .chain-warn-yellow { animation: flashChainYellow 1.5s infinite; }
    .chain-warn-red { animation: flashChainRed 0.65s infinite; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead tr {
      height: 24px;
    }
    th {
      text-align: left;
      padding: 0 4px;
      color: #777;
      font-weight: 600;
      border-bottom: 1px solid #2b2b2b;
      white-space: nowrap;
    }
    tbody tr {
      height: 26px;
      background-color: #181818;
    }
    tbody tr:nth-child(even) {
      background-color: #202020;
    }
    tbody tr:hover {
      background-color: #292929;
    }
    td {
      padding: 0 4px;
      height: 26px;
      line-height: 26px;
      white-space: nowrap;
      vertical-align: middle;
    }

    /* Player cell with dot + name + compact last action */
    .player-cell {
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: 175px;
    }
    @media (max-width: 480px) {
      .player-cell { max-width: 130px; }
      table { font-size: 0.76rem; }
      td, th { padding: 0 3px; }
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }
    .dot-Online { background-color: #4caf50; box-shadow: 0 0 4px rgba(76, 175, 80, 0.7); }
    .dot-Idle { background-color: #ff9800; }
    .dot-Offline { background-color: #555555; }

    a.player-link {
      color: #f0f0f0;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a.player-link:hover {
      text-decoration: underline;
      color: #90caf9;
    }
    .last-act {
      color: #777;
      font-size: 0.72rem;
      font-family: monospace;
      flex-shrink: 0;
    }

    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: 600; }
    .Jail { color: #ffa726; font-weight: 600; }
    .Traveling, .Abroad { color: #42a5f5; }
    .Fallen { color: #666666; font-style: italic; }

    .timer {
      font-family: monospace;
      font-size: 0.82rem;
      padding: 1px 4px;
      border-radius: 3px;
    }
    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.25); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.45); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }

    a.atk-btn {
      background: #7f1d1d;
      color: #e0e0e0;
      padding: 2px 7px;
      border-radius: 3px;
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: bold;
      display: inline-block;
      line-height: 1.3;
    }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.8); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }
    .no-atk { color: #555; font-family: monospace; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>
  <div class="meta" id="statusBar">Paste a Public API key in the top right and click Load.</div>

  <div class="board">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers [40449]</h2>
        <span class="chain-badge" id="allyChain">Chain: None</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: None</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    let selectedFactionId = 40449;
    let cachedData = {
      ally: null,
      enemy: null,
      allyChain: null,
      enemyChain: null
    };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      localStorage.setItem("torn_pub_key", keyInput.value.trim());
      if (keyInput.value.trim().length === 16) fetchWarData();
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => {
        selectedFactionId = fac.id;
        updateActiveTab();
        fetchWarData();
      };
      tabContainer.appendChild(btn);
    });

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    async function fetchWithFallback(targetUrl) {
      try {
        const directRes = await fetch(targetUrl);
        if (directRes.ok) {
          const json = await directRes.json();
          if (!json.error) return json;
          throw new Error(json.error.error);
        }
      } catch (e) {
        if (e.message && !e.message.includes("Failed to fetch") && !e.message.includes("NetworkError")) {
          throw e;
        }
      }

      const proxies = [
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl)
      ];

      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) {
            const json = await res.json();
            if (json.error) throw new Error(json.error.error);
            return json;
          }
        } catch (err) {
          if (err.message && !err.message.includes("Failed to fetch") && !err.message.includes("HTTP")) {
            throw err;
          }
        }
      }
      throw new Error("Unable to reach Torn API");
    }

    async function getFactionFull(id, key) {
      const v1Url = "https://api.torn.com/faction/" + id + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
      const v2MembersUrl = "https://api.torn.com/v2/faction/" + id + "/members?key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";

      const [basicData, membersV2Data] = await Promise.all([
        fetchWithFallback(v1Url),
        fetchWithFallback(v2MembersUrl).catch(() => null)
      ]);

      let mergedMembers = [];
      if (membersV2Data && Array.isArray(membersV2Data.members)) {
        mergedMembers = membersV2Data.members;
      } else if (basicData.members) {
        mergedMembers = Object.entries(basicData.members).map(([mid, m]) => ({ id: Number(mid), ...m }));
      }

      return {
        id: basicData.ID || id,
        name: basicData.name || ("Faction " + id),
        ranked_wars: basicData.ranked_wars || null,
        territory_wars: basicData.territory_wars || null,
        raid_wars: basicData.raid_wars || null,
        chain: basicData.chain || null,
        members: mergedMembers
      };
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }
      document.getElementById("statusBar").textContent = "Syncing faction data...";

      try {
        const allyData = await getFactionFull(selectedFactionId, key);
        cachedData.ally = allyData;
        cachedData.allyChain = allyData.chain;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.id + "]";

        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyData = await getFactionFull(enemyId, key);
          cachedData.enemy = enemyData;
          cachedData.enemyChain = enemyData.chain;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.id + "]";
        } else {
          cachedData.enemy = null;
          cachedData.enemyChain = null;
          document.getElementById("enemyTitle").textContent = "No Active War";
        }

        updateChainBadges();
        renderTables();
        document.getElementById("statusBar").textContent = "Showing " + allyData.name + " • Auto-syncing every 20s • Updated " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatShortTime(sec) {
      if (sec <= 0) return "00:00";
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function updateSingleChain(chainObj, elId, isAlly) {
      const el = document.getElementById(elId);
      if (!chainObj || !chainObj.current || chainObj.current === 0) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const current = chainObj.current;
      const max = chainObj.max || "";
      const countText = max ? (current + "/" + max) : String(current);

      if (chainObj.cooldown && chainObj.cooldown > 0) {
        const cdLeft = chainObj.end ? Math.max(0, (chainObj.end + chainObj.cooldown) - now) : chainObj.cooldown;
        el.textContent = "Chain: " + current + " (CD " + formatShortTime(cdLeft) + ")";
        el.className = "chain-badge chain-cooldown";
        return;
      }

      const timeoutLeft = chainObj.timeout !== undefined ? chainObj.timeout : 0;
      el.textContent = "Chain: " + countText + " (" + formatShortTime(timeoutLeft) + ")";

      let cls = "chain-badge chain-active";
      if (isAlly) {
        if (timeoutLeft > 0 && timeoutLeft < 60) {
          cls = "chain-badge chain-warn-red";
        } else if (timeoutLeft > 0 && timeoutLeft < 150) {
          cls = "chain-badge chain-warn-yellow";
        }
      } else {
        if (timeoutLeft > 0 && timeoutLeft <= 60) {
          cls = "chain-badge chain-warn-red";
        }
      }
      el.className = cls;
    }

    function updateChainBadges() {
      updateSingleChain(cachedData.allyChain, "allyChain", true);
      updateSingleChain(cachedData.enemyChain, "enemyChain", false);
    }

    const COUNTRY_CODES = [
      { match: /torn/i, code: "TC" },
      { match: /mexico|mexican/i, code: "MEX" },
      { match: /cayman/i, code: "CAY" },
      { match: /canada|canadian/i, code: "CAN" },
      { match: /hawaii|hawaiian/i, code: "HAW" },
      { match: /united kingdom|uk|british|london/i, code: "UK" },
      { match: /argentina|argentinian/i, code: "ARG" },
      { match: /switzerland|swiss/i, code: "SWI" },
      { match: /japan|japanese/i, code: "JAP" },
      { match: /china|chinese/i, code: "CHI" },
      { match: /uae|emirates|emirati|dubai/i, code: "UAE" },
      { match: /south africa|south african/i, code: "SA" }
    ];

    function getCountryCode(text) {
      if (!text) return "TC";
      for (const item of COUNTRY_CODES) {
        if (item.match.test(text)) return item.code;
      }
      return "TC";
    }

    function parseMemberLocationAndLabel(m) {
      const state = m.status ? m.status.state : "Okay";
      const desc = (m.status && m.status.description) ? m.status.description : "";

      if (state === "Fallen") {
        return { tier: 5, label: "Fallen", sortKey: m.name.toLowerCase(), cssClass: "Fallen", isFallen: true };
      }

      if (state === "Hospital") {
        const code = getCountryCode(desc);
        return { tier: 1, label: "Hosp (" + code + ")", sortKey: "", cssClass: "Hospital", isFallen: false };
      }

      if (state === "Jail") {
        const code = getCountryCode(desc);
        return { tier: 1, label: "Jail (" + code + ")", sortKey: "", cssClass: "Jail", isFallen: false };
      }

      if (state === "Traveling") {
        if (/returning to torn from/i.test(desc)) {
          const fromCode = getCountryCode(desc.replace(/returning to torn from/i, ""));
          const route = fromCode + " > TC";
          return { tier: 2, label: route, sortKey: route, cssClass: "Traveling", isFallen: false };
        }
        if (/traveling to/i.test(desc)) {
          const toCode = getCountryCode(desc.replace(/traveling to/i, ""));
          const route = "TC > " + toCode;
          return { tier: 2, label: route, sortKey: route, cssClass: "Traveling", isFallen: false };
        }
        return { tier: 2, label: "Traveling", sortKey: "ZZZ", cssClass: "Traveling", isFallen: false };
      }

      if (state === "Abroad") {
        const code = getCountryCode(desc);
        return { tier: 3, label: "Okay (" + code + ")", sortKey: code, cssClass: "Abroad", isFallen: false };
      }

      // Default Okay in Torn City
      return { tier: 4, label: "Okay (TC)", sortKey: m.name.toLowerCase(), cssClass: "Okay", isFallen: false };
    }

    function formatLastAction(lastAction) {
      if (!lastAction || !lastAction.timestamp) return "";
      const diff = Math.max(0, Math.floor(Date.now() / 1000) - lastAction.timestamp);
      if (diff < 60) return diff + "s";
      if (diff < 3600) return Math.floor(diff / 60) + "m";
      if (diff < 86400) return Math.floor(diff / 3600) + "h";
      return Math.floor(diff / 86400) + "d";
    }

    function formatCountdown(diffSeconds) {
      if (diffSeconds <= 0) return "00:00:00";
      const h = String(Math.floor(diffSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(diffSeconds % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function getTimerAlertClass(state, diffSeconds) {
      if ((state !== "Hospital" && state !== "Jail") || diffSeconds <= 0) return "";
      if (diffSeconds <= 120) return "timer-red-fast";
      if (diffSeconds <= 300) return "timer-yellow-slow";
      if (diffSeconds <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diffSeconds) {
      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diffSeconds <= 20) return true;
      return false;
    }

    function renderRoster(factionData, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members || factionData.members.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const enriched = factionData.members.map(m => {
        const parsed = parseMemberLocationAndLabel(m);
        const until = (m.status && m.status.until) ? m.status.until : 0;
        return { ...m, parsed, until };
      });

      enriched.sort((a, b) => {
        if (a.parsed.tier !== b.parsed.tier) return a.parsed.tier - b.parsed.tier;
        if (a.parsed.tier === 1) {
          return (a.until || 9999999999) - (b.until || 9999999999);
        }
        if (a.parsed.sortKey !== b.parsed.sortKey) {
          return a.parsed.sortKey.localeCompare(b.parsed.sortKey);
        }
        return a.name.localeCompare(b.name);
      });

      tbody.innerHTML = enriched.map(m => {
        const state = m.status ? m.status.state : "Okay";
        const diff = m.until > 0 ? m.until - now : 0;
        const showTimer = (state === "Hospital" || state === "Jail") && m.until > 0;
        const timerText = showTimer ? formatCountdown(diff) : "-";
        const alertClass = showTimer ? getTimerAlertClass(state, diff) : "";

        const onlineStatus = (m.last_action && m.last_action.status) ? m.last_action.status : "Offline";
        const lastActStr = formatLastAction(m.last_action);

        let actionHtml = '<span class="no-atk">-</span>';
        if (!m.parsed.isFallen) {
          const readyClass = isAttackReady(state, diff) ? " atk-ready" : "";
          actionHtml = '<a class="atk-btn' + readyClass + '" data-state="' + state + '" data-until="' + m.until + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a>';
        }

        return '<tr>' +
          '<td><div class="player-cell">' +
            '<span class="status-dot dot-' + onlineStatus + '" title="' + onlineStatus + '"></span>' +
            '<a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a>' +
            (lastActStr ? '<span class="last-act">' + lastActStr + '</span>' : '') +
          '</div></td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.parsed.cssClass + '">' + m.parsed.label + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + state + '" data-until="' + (showTimer ? m.until : 0) + '">' + timerText + '</span></td>' +
          '<td>' + actionHtml + '</td>' +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, "allyBody");
      renderRoster(cachedData.enemy, "enemyBody");
    }

    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0) {
          const diff = until - now;
          el.textContent = formatCountdown(diff);
          el.className = "timer " + getTimerAlertClass(state, diff);
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });

      if (cachedData.allyChain && cachedData.allyChain.timeout > 0 && !cachedData.allyChain.cooldown) {
        cachedData.allyChain.timeout = Math.max(0, cachedData.allyChain.timeout - 1);
      }
      if (cachedData.enemyChain && cachedData.enemyChain.timeout > 0 && !cachedData.enemyChain.cooldown) {
        cachedData.enemyChain.timeout = Math.max(0, cachedData.enemyChain.timeout - 1);
      }
      updateChainBadges();
    }, 1000);

    setInterval(fetchWarData, 20000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
