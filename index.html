<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 10px 12px;
      font-size: 0.84rem;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .key-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    button {
      padding: 7px 12px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #1e1e1e;
      color: #ccc;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.84rem;
      transition: 0.15s;
    }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.load-btn:hover { background: #1976d2; }
    input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      width: 175px;
      font-size: 0.84rem;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.78rem;
      color: #999;
      margin-bottom: 10px;
    }
    .loc-badge {
      color: #90caf9;
      font-weight: 600;
    }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      touch-action: pan-y;
    }
    @media (max-width: 850px) {
      .board { grid-template-columns: 1fr; }
    }
    .panel {
      background: #181818;
      border-radius: 6px;
      padding: 10px;
      border: 1px solid #2a2a2a;
      overflow-x: auto;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2e2e2e;
      padding-bottom: 7px;
      margin-bottom: 4px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chain-badge {
      font-family: monospace;
      font-size: 0.78rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: #252525;
      color: #aaa;
      border: 1px solid #383838;
      white-space: nowrap;
      font-weight: 600;
    }
    .chain-active {
      background: rgba(46, 125, 50, 0.25);
      color: #81c784;
      border-color: #388e3c;
    }
    .chain-cooldown {
      background: #b3e5fc;
      color: #01579b;
      border-color: #4fc3f7;
      box-shadow: 0 0 6px rgba(179, 229, 252, 0.45);
    }

    @keyframes flashChainYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.35); color: #fff59d; border-color: #fbc02d; }
      50% { background-color: #252525; color: #fdd835; border-color: #555; }
    }
    @keyframes flashChainRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.55); color: #ffffff; border-color: #ff5252; }
      50% { background-color: #252525; color: #ff5252; border-color: #555; }
    }
    .chain-yellow-slow { animation: flashChainYellow 1.5s infinite; }
    .chain-red-fast { animation: flashChainRed 0.6s infinite; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead tr {
      height: 24px;
      border-bottom: 1px solid #2e2e2e;
    }
    th {
      text-align: left;
      padding: 0 5px;
      color: #888;
      font-weight: 600;
      white-space: nowrap;
    }
    tbody tr {
      height: 26px;
    }
    tbody tr:nth-child(odd) {
      background-color: #181818;
    }
    tbody tr:nth-child(even) {
      background-color: #202020;
    }
    tbody tr:hover {
      background-color: #282828;
    }
    td {
      padding: 0 5px;
      line-height: 26px;
      white-space: nowrap;
      vertical-align: middle;
    }

    .player-cell {
      max-width: 155px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .dot-Online { background-color: #4caf50; box-shadow: 0 0 4px #4caf50; }
    .dot-Idle { background-color: #ff9800; }
    .dot-Offline { background-color: #555; }

    a.player-link {
      color: #f0f0f0;
      text-decoration: none;
      font-weight: 500;
    }
    a.player-link:hover {
      text-decoration: underline;
      color: #90caf9;
    }
    .last-act {
      color: #777;
      font-size: 0.74rem;
      margin-left: 4px;
    }

    .st-okay { color: #66bb6a; }
    .st-hosp { color: #ef5350; font-weight: 600; }
    .st-jail { color: #ffa726; font-weight: 600; }
    .st-travel { color: #42a5f5; }
    .st-fallen { color: #757575; font-style: italic; }

    .timer {
      font-family: monospace;
      font-size: 0.82rem;
      padding: 1px 5px;
      border-radius: 3px;
      display: inline-block;
      line-height: 18px;
    }

    @keyframes flashYellow {
      0%, 100% { background-color: rgba(253, 216, 53, 0.28); color: #fff59d; }
      50% { background-color: transparent; color: #fdd835; }
    }
    @keyframes flashRed {
      0%, 100% { background-color: rgba(229, 57, 53, 0.5); color: #ffffff; }
      50% { background-color: transparent; color: #ff5252; }
    }
    @keyframes flashAttackReady {
      0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 7px rgba(76, 175, 80, 0.85); }
      50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; }
    }

    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }

    a.atk-btn {
      background: #7f1d1d;
      color: #e0e0e0;
      padding: 2px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: bold;
      display: inline-block;
      line-height: 16px;
      transition: 0.15s;
    }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    .atk-ready { animation: flashAttackReady 1.5s infinite; }

    @media (max-width: 520px) {
      body { padding: 6px; font-size: 0.78rem; }
      button { padding: 6px 9px; font-size: 0.78rem; }
      input { width: 145px; font-size: 0.78rem; }
      .panel { padding: 7px 6px; }
      table { font-size: 0.76rem; }
      th, td { padding: 0 3px; }
      .player-cell { max-width: 112px; }
      .timer { font-size: 0.75rem; padding: 1px 4px; }
      a.atk-btn { padding: 2px 6px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" placeholder="Public Torn API Key" />
      <button class="load-btn" onclick="fetchWarData()">Load</button>
    </div>
  </div>

  <div class="meta-row">
    <span id="statusBar">Paste a Public API key and click Load.</span>
    <span class="loc-badge" id="userLocationBadge">Your Location: --</span>
  </div>

  <div class="board" id="swipeBoard">
    <div class="panel">
      <div class="panel-header">
        <h2 id="allyTitle">Razers [40449]</h2>
        <span class="chain-badge" id="allyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="allyBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="enemyTitle">Warring Opponent</h2>
        <span class="chain-badge" id="enemyChain">Chain: --</span>
      </div>
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
        <tbody id="enemyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];

    // sessionStorage persists across page refreshes (F5/Reload) within the same tab,
    // while a brand-new browser tab or window starts fresh and auto-detects the user's home faction.
    const savedSessionTab = Number(sessionStorage.getItem("torn_session_tab"));
    let selectedFactionId = OUR_FACTIONS.some(f => f.id === savedSessionTab) ? savedSessionTab : 40449;
    let homeFactionChecked = Boolean(savedSessionTab);

    let userCityCode = null;
    let cachedData = {
      ally: null,
      enemy: null,
      allyChain: null,
      enemyChain: null,
      allyV2Map: {},
      enemyV2Map: {}
    };

    const keyInput = document.getElementById("apiKey");
    keyInput.value = localStorage.getItem("torn_pub_key") || "";
    keyInput.addEventListener("input", () => {
      const val = keyInput.value.trim();
      localStorage.setItem("torn_pub_key", val);
      if (val.length === 16) {
        homeFactionChecked = false;
        sessionStorage.removeItem("torn_session_tab");
        fetchWarData();
      }
    });

    const tabContainer = document.getElementById("factionTabs");
    OUR_FACTIONS.forEach(fac => {
      const btn = document.createElement("button");
      btn.textContent = fac.name;
      btn.dataset.id = fac.id;
      btn.onclick = () => switchFactionTab(fac.id);
      tabContainer.appendChild(btn);
    });

    function switchFactionTab(facId) {
      selectedFactionId = facId;
      homeFactionChecked = true;
      sessionStorage.setItem("torn_session_tab", String(facId));
      updateActiveTab();
      fetchWarData();
    }

    function updateActiveTab() {
      document.querySelectorAll("#factionTabs button").forEach(b => {
        b.classList.toggle("active", Number(b.dataset.id) === selectedFactionId);
      });
      const current = OUR_FACTIONS.find(f => f.id === selectedFactionId);
      if (current) {
        document.getElementById("allyTitle").textContent = current.name + " [" + current.id + "]";
      }
    }

    // Mobile swipe left/right between tabs
    let touchStartX = 0;
    let touchStartY = 0;
    const swipeBoard = document.getElementById("swipeBoard");
    swipeBoard.addEventListener("touchstart", e => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }, { passive: true });

    swipeBoard.addEventListener("touchend", e => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const idx = OUR_FACTIONS.findIndex(f => f.id === selectedFactionId);
        if (idx !== -1) {
          const nextIdx = dx < 0
            ? (idx + 1) % OUR_FACTIONS.length
            : (idx - 1 + OUR_FACTIONS.length) % OUR_FACTIONS.length;
          switchFactionTab(OUR_FACTIONS[nextIdx].id);
        }
      }
    }, { passive: true });

    async function fetchTornJson(tornUrl) {
      const strategies = [
        () => fetch(tornUrl),
        () => fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(tornUrl)),
        () => fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(tornUrl))
      ];
      let lastErr = null;
      for (const run of strategies) {
        try {
          const res = await run();
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data && data.error) throw new Error(data.error.error || "API Error");
          return data;
        } catch (e) {
          lastErr = e;
          if (e.message && (e.message.includes("Incorrect key") || e.message.includes("Access level") || e.message.includes("Too many requests"))) {
            throw e;
          }
        }
      }
      throw lastErr || new Error("Failed to fetch");
    }

    const COUNTRY_CODES = [
      { keys: ["torn", "torn city"], code: "TC" },
      { keys: ["mexico", "mexican"], code: "MEX" },
      { keys: ["cayman", "cayman islands", "caymanian"], code: "CAY" },
      { keys: ["canada", "canadian"], code: "CAN" },
      { keys: ["hawaii", "hawaiian"], code: "HAW" },
      { keys: ["united kingdom", "uk", "british", "england"], code: "UK" },
      { keys: ["argentina", "argentinian"], code: "ARG" },
      { keys: ["switzerland", "swiss"], code: "SWI" },
      { keys: ["japan", "japanese"], code: "JAP" },
      { keys: ["china", "chinese"], code: "CHI" },
      { keys: ["uae", "united arab emirates", "emirati", "dubai"], code: "UAE" },
      { keys: ["south africa", "south african"], code: "SA" }
    ];

    function matchCountryCode(text) {
      if (!text) return null;
      const lower = text.toLowerCase();
      for (const entry of COUNTRY_CODES) {
        for (const k of entry.keys) {
          const regex = new RegExp("\b" + k.replace(/[.*+?^${}()|[\]\]/g, "\$&") + "\b", "i");
          if (regex.test(lower)) return entry.code;
        }
      }
      return null;
    }

    function parseMemberStatus(member, v2Member) {
      const st = (v2Member && v2Member.status) ? v2Member.status : (member.status || {});
      const state = st.state || "Okay";
      const desc = st.description || "";
      const details = st.details || "";
      const combined = (desc + " " + details).trim();

      if (state === "Fallen") {
        return { tier: 5, label: "Fallen", css: "st-fallen", cityCode: null, sortKey: member.name.toLowerCase() };
      }

      if (state === "Hospital") {
        const code = matchCountryCode(combined) || "TC";
        return { tier: 1, label: "Hosp (" + code + ")", css: "st-hosp", cityCode: code, sortKey: "" };
      }

      if (state === "Jail") {
        const code = matchCountryCode(combined) || "TC";
        return { tier: 1, label: "Jail (" + code + ")", css: "st-jail", cityCode: code, sortKey: "" };
      }

      if (state === "Traveling") {
        const lower = combined.toLowerCase();
        let fromCode = "TC";
        let toCode = "TC";

        const fromToMatch = lower.match(/from\s+([a-z\s]+?)\s+to\s+([a-z\s]+)/i);
        const returnFromMatch = lower.match(/returning\s+to\s+torn\s+from\s+([a-z\s]+)/i);
        const travelingToMatch = lower.match(/traveling\s+to\s+([a-z\s]+)/i);

        if (fromToMatch) {
          fromCode = matchCountryCode(fromToMatch[1]) || "TC";
          toCode = matchCountryCode(fromToMatch[2]) || "TC";
        } else if (returnFromMatch) {
          fromCode = matchCountryCode(returnFromMatch[1]) || "Abroad";
          toCode = "TC";
        } else if (travelingToMatch) {
          fromCode = "TC";
          toCode = matchCountryCode(travelingToMatch[1]) || "Abroad";
        } else if (lower.includes("returning")) {
          fromCode = matchCountryCode(lower) || "Abroad";
          toCode = "TC";
        } else {
          const found = matchCountryCode(lower);
          if (found && found !== "TC") {
            fromCode = "TC";
            toCode = found;
          }
        }

        const route = fromCode + " > " + toCode;
        return { tier: 2, label: route, css: "st-travel", cityCode: null, sortKey: route };
      }

      if (state === "Abroad") {
        const code = matchCountryCode(combined) || "Abroad";
        return { tier: 3, label: "Okay (" + code + ")", css: "st-okay", cityCode: code, sortKey: code + "_" + member.name.toLowerCase() };
      }

      // State === "Okay"
      const abroadCode = matchCountryCode(combined);
      if (abroadCode && abroadCode !== "TC") {
        return { tier: 3, label: "Okay (" + abroadCode + ")", css: "st-okay", cityCode: abroadCode, sortKey: abroadCode + "_" + member.name.toLowerCase() };
      }

      return { tier: 4, label: "Okay (TC)", css: "st-okay", cityCode: "TC", sortKey: member.name.toLowerCase() };
    }

    function parseUserCity(userData) {
      if (!userData || !userData.status) return "TC";
      const st = userData.status;
      if (st.state === "Traveling") return "Traveling";
      const combined = ((st.description || "") + " " + (st.details || "")).trim();
      const code = matchCountryCode(combined);
      return code || "TC";
    }

    function formatShortLastAction(lastActionObj) {
      if (!lastActionObj || !lastActionObj.timestamp) return "";
      const diff = Math.max(0, Math.floor(Date.now() / 1000) - Number(lastActionObj.timestamp));
      if (diff < 60) return diff + "s";
      if (diff < 3600) return Math.floor(diff / 60) + "m";
      if (diff < 86400) return Math.floor(diff / 3600) + "h";
      return Math.floor(diff / 86400) + "d";
    }

    function findOpponentId(factionData, ourId) {
      if (factionData.ranked_wars) {
        for (const war of Object.values(factionData.ranked_wars)) {
          const ids = Object.keys(war.factions).map(Number);
          const opp = ids.find(id => id !== Number(ourId));
          if (opp) return opp;
        }
      }
      if (factionData.territory_wars) {
        for (const war of Object.values(factionData.territory_wars)) {
          const opp = war.assaulting_faction === Number(ourId) ? war.defending_faction : war.assaulting_faction;
          if (opp) return opp;
        }
      }
      if (factionData.raid_wars) {
        for (const war of Object.values(factionData.raid_wars)) {
          const opp = war.raiding_faction === Number(ourId) ? war.defending_faction : war.raiding_faction;
          if (opp) return opp;
        }
      }
      return null;
    }

    async function getFactionV2Map(id, key) {
      try {
        const url = "https://api.torn.com/v2/faction/" + id + "/members?key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
        const data = await fetchTornJson(url);
        const map = {};
        if (data && Array.isArray(data.members)) {
          data.members.forEach(m => { map[m.id] = m; });
        }
        return map;
      } catch (e) {
        return {};
      }
    }

    async function fetchWarData() {
      const key = keyInput.value.trim();
      if (!key) {
        document.getElementById("statusBar").textContent = "Please paste a Torn Public API key first.";
        return;
      }

      try {
        // 1. Check visitor's own profile (home faction on initial page load + live city location)
        const userUrl = "https://api.torn.com/user/?selections=basic&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
        const userData = await fetchTornJson(userUrl);

        if (!homeFactionChecked && userData && userData.faction && userData.faction.faction_id) {
          const myFacId = Number(userData.faction.faction_id);
          if (OUR_FACTIONS.some(f => f.id === myFacId)) {
            selectedFactionId = myFacId;
            sessionStorage.setItem("torn_session_tab", String(myFacId));
            updateActiveTab();
          }
          homeFactionChecked = true;
        }

        userCityCode = parseUserCity(userData);
        document.getElementById("userLocationBadge").textContent = "Your Location: " + userCityCode;

        // 2. Fetch selected friendly faction basic + chain + v2 members
        const allyUrl = "https://api.torn.com/faction/" + selectedFactionId + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
        const [allyData, allyV2Map] = await Promise.all([
          fetchTornJson(allyUrl),
          getFactionV2Map(selectedFactionId, key)
        ]);

        cachedData.ally = allyData;
        cachedData.allyChain = allyData.chain || null;
        cachedData.allyV2Map = allyV2Map;
        document.getElementById("allyTitle").textContent = allyData.name + " [" + allyData.ID + "]";

        // 3. Detect warring opponent and fetch their basic + chain + v2 members
        const enemyId = findOpponentId(allyData, selectedFactionId);
        if (enemyId) {
          const enemyUrl = "https://api.torn.com/faction/" + enemyId + "?selections=basic,chain&key=" + encodeURIComponent(key) + "&comment=RazersWarTracker";
          const [enemyData, enemyV2Map] = await Promise.all([
            fetchTornJson(enemyUrl),
            getFactionV2Map(enemyId, key)
          ]);
          cachedData.enemy = enemyData;
          cachedData.enemyChain = enemyData.chain || null;
          cachedData.enemyV2Map = enemyV2Map;
          document.getElementById("enemyTitle").textContent = enemyData.name + " [" + enemyData.ID + "]";
        } else {
          cachedData.enemy = null;
          cachedData.enemyChain = null;
          cachedData.enemyV2Map = {};
          document.getElementById("enemyTitle").textContent = "No Active War";
        }

        updateChainBadges();
        renderTables();
        document.getElementById("statusBar").textContent = "Syncing every 15s • Updated " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("statusBar").textContent = "Torn API Error: " + err.message;
      }
    }

    function formatMMSS(sec) {
      const s = Math.max(0, sec);
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      const r = String(s % 60).padStart(2, "0");
      return m + ":" + r;
    }

    function formatHHMMSS(sec) {
      if (sec <= 0) return "00:00:00";
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }

    function renderSingleChain(chainObj, elId, isAlly) {
      const el = document.getElementById(elId);
      if (!chainObj || (!chainObj.current && !chainObj.cooldown)) {
        el.textContent = "Chain: None";
        el.className = "chain-badge";
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      if (chainObj.cooldown && chainObj.cooldown > 0) {
        const cdLeft = chainObj.end ? Math.max(0, (chainObj.end + chainObj.cooldown) - now) : chainObj.cooldown;
        el.textContent = "Chain: " + (chainObj.current || 0) + " (CD " + formatMMSS(cdLeft) + ")";
        el.className = "chain-badge chain-cooldown";
        return;
      }

      const current = chainObj.current || 0;
      const max = chainObj.max || 10;
      const timeoutLeft = chainObj.timeout || 0;

      el.textContent = "Chain: " + current + "/" + max + " (" + formatMMSS(timeoutLeft) + ")";
      let cls = "chain-badge chain-active";
      if (isAlly && timeoutLeft > 0) {
        if (timeoutLeft < 60) cls = "chain-badge chain-red-fast";
        else if (timeoutLeft < 150) cls = "chain-badge chain-yellow-slow";
      } else if (!isAlly && timeoutLeft > 0 && timeoutLeft <= 60) {
        cls = "chain-badge chain-red-fast";
      }
      el.className = cls;
    }

    function updateChainBadges() {
      renderSingleChain(cachedData.allyChain, "allyChain", true);
      renderSingleChain(cachedData.enemyChain, "enemyChain", false);
    }

    function getTimerAlertClass(state, diff) {
      if ((state !== "Hospital" && state !== "Jail") || diff <= 0) return "";
      if (diff <= 120) return "timer-red-fast";
      if (diff <= 300) return "timer-yellow-slow";
      if (diff <= 600) return "timer-yellow-solid";
      return "";
    }

    function isAttackReady(state, diff, targetCity) {
      if (state === "Fallen") return false;
      if (!userCityCode || userCityCode === "Traveling" || !targetCity) return false;
      if (targetCity !== userCityCode) return false;

      if (state === "Okay" || state === "Abroad") return true;
      if ((state === "Hospital" || state === "Jail") && diff <= 20) return true;
      return false;
    }

    function renderRoster(factionData, v2Map, tbodyId) {
      const tbody = document.getElementById(tbodyId);
      if (!factionData || !factionData.members) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#777;">No active opponent or data found.</td></tr>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const list = Object.entries(factionData.members).map(([id, m]) => {
        const v2 = v2Map[id] || v2Map[Number(id)] || null;
        const st = (v2 && v2.status) ? v2.status : (m.status || {});
        const state = st.state || "Okay";
        const until = st.until || 0;
        const diff = until > 0 ? until - now : 0;
        const parsed = parseMemberStatus(m, v2);

        // 8-second grace period after hospital/jail timer expires before re-sorting down
        let effectiveTier = parsed.tier;
        let effectiveLabel = parsed.label;
        let effectiveCss = parsed.css;
        let effectiveState = state;
        let effectiveSort = parsed.sortKey;

        if ((state === "Hospital" || state === "Jail") && until > 0 && diff <= -8) {
          const city = parsed.cityCode || "TC";
          effectiveState = city === "TC" ? "Okay" : "Abroad";
          effectiveTier = city === "TC" ? 4 : 3;
          effectiveLabel = "Okay (" + city + ")";
          effectiveCss = "st-okay";
          effectiveSort = city === "TC" ? m.name.toLowerCase() : (city + "_" + m.name.toLowerCase());
        }

        const lastActObj = (v2 && v2.last_action) ? v2.last_action : m.last_action;
        const actStatus = lastActObj && lastActObj.status ? lastActObj.status : "Offline";
        const actShort = formatShortLastAction(lastActObj);

        return {
          id,
          name: m.name,
          level: m.level,
          state: effectiveState,
          until,
          diff,
          tier: effectiveTier,
          label: effectiveLabel,
          css: effectiveCss,
          cityCode: parsed.cityCode,
          sortKey: effectiveSort,
          actStatus,
          actShort
        };
      });

      list.sort((a, b) => {
        if (a.tier !== b.tier) return a.tier - b.tier;
        if (a.tier === 1) return (a.until || 9999999999) - (b.until || 9999999999);
        return a.sortKey.localeCompare(b.sortKey);
      });

      tbody.innerHTML = list.map(m => {
        const showTimer = (m.tier === 1 && m.until > 0);
        const timerText = showTimer ? formatHHMMSS(m.diff) : "-";
        const alertClass = showTimer ? getTimerAlertClass(m.state, m.diff) : "";
        const readyClass = isAttackReady(m.state, m.diff, m.cityCode) ? " atk-ready" : "";

        const actionCell = m.state === "Fallen"
          ? '<td style="color:#666;">-</td>'
          : '<td><a class="atk-btn' + readyClass + '" data-state="' + m.state + '" data-until="' + m.until + '" data-city="' + (m.cityCode || "") + '" href="https://www.torn.com/page.php?sid=attack&user2ID=' + m.id + '" target="_blank">Attack</a></td>';

        return '<tr>' +
          '<td class="player-cell">' +
            '<span class="dot dot-' + m.actStatus + '" title="' + m.actStatus + '"></span>' +
            '<a class="player-link" href="https://www.torn.com/profiles.php?XID=' + m.id + '" target="_blank">' + m.name + '</a>' +
            (m.actShort ? '<span class="last-act">' + m.actShort + '</span>' : '') +
          '</td>' +
          '<td>' + m.level + '</td>' +
          '<td class="' + m.css + '" data-city="' + (m.cityCode || "") + '">' + m.label + '</td>' +
          '<td><span class="timer ' + alertClass + '" data-state="' + m.state + '" data-until="' + (showTimer ? m.until : 0) + '" data-city="' + (m.cityCode || "") + '">' + timerText + '</span></td>' +
          actionCell +
        '</tr>';
      }).join("");
    }

    function renderTables() {
      renderRoster(cachedData.ally, cachedData.allyV2Map, "allyBody");
      renderRoster(cachedData.enemy, cachedData.enemyV2Map, "enemyBody");
    }

    // 1-second local countdown tick + 8-second post-release transition
    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      let needsResort = false;

      document.querySelectorAll(".timer").forEach(el => {
        const until = Number(el.dataset.until);
        const state = el.dataset.state;
        if (until > 0 && (state === "Hospital" || state === "Jail")) {
          const diff = until - now;
          if (diff <= -8) {
            needsResort = true;
          } else {
            el.textContent = formatHHMMSS(diff);
            el.className = "timer " + getTimerAlertClass(state, diff);
          }
        }
      });

      document.querySelectorAll(".atk-btn").forEach(btn => {
        const until = Number(btn.dataset.until);
        const state = btn.dataset.state;
        const city = btn.dataset.city;
        const diff = until > 0 ? until - now : 0;
        if (isAttackReady(state, diff, city)) {
          btn.classList.add("atk-ready");
        } else {
          btn.classList.remove("atk-ready");
        }
      });

      // Tick active chain timers locally every second
      if (cachedData.allyChain && cachedData.allyChain.timeout > 0) {
        cachedData.allyChain.timeout = Math.max(0, cachedData.allyChain.timeout - 1);
      }
      if (cachedData.enemyChain && cachedData.enemyChain.timeout > 0) {
        cachedData.enemyChain.timeout = Math.max(0, cachedData.enemyChain.timeout - 1);
      }
      updateChainBadges();

      if (needsResort) {
        renderTables();
      }
    }, 1000);

    // 15-second API sync
    setInterval(fetchWarData, 15000);

    updateActiveTab();
    if (keyInput.value) fetchWarData();
  </script>
</body>
</html>
