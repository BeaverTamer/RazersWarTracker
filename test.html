<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razers Alliance War Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 10px; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .key-group { display: flex; gap: 5px; align-items: center; }
    button { padding: 7px 11px; border: 1px solid #333; border-radius: 5px; background: #1e1e1e; color: #ccc; cursor: pointer; font-weight: 600; font-size: 0.83rem; }
    button:hover { background: #2c2c2c; color: #fff; }
    button.active { background: #2e7d32; color: #fff; border-color: #4caf50; }
    button.load-btn { background: #1565c0; color: #fff; border-color: #1976d2; }
    button.toggle-btn { background: #262626; color: #bbb; padding: 7px 9px; }
    input { padding: 7px 10px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: #fff; width: 140px; font-size: 0.83rem; }
    .find-box { width: 110px; }
    select { padding: 7px 8px; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: #ccc; font-size: 0.83rem; cursor: pointer; font-weight: 600; }
    select:hover { background: #2c2c2c; color: #fff; }
    .sub-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #999; margin-bottom: 8px; gap: 8px; }
    .loc-badge { color: #90caf9; font-weight: 600; white-space: nowrap; }
    .war-banner { display: none; background: #1a1a1a; border: 1px solid #303030; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }
    .war-scores-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; flex-wrap: wrap; }
    .war-team-ally { color: #81c784; }
    .war-team-enemy { color: #e57373; }
    .war-center-info { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; flex-wrap: wrap; }
    .lead-badge { padding: 2px 8px; border-radius: 4px; font-weight: 700; background: #2c2c2c; color: #ddd; }
    .lead-ally { background: rgba(46, 125, 50, 0.3); color: #a5d6a7; border: 1px solid #4caf50; }
    .lead-enemy { background: rgba(198, 40, 40, 0.3); color: #ef9a9a; border: 1px solid #e53935; }
    .target-text { color: #bbb; font-family: monospace; font-size: 0.8rem; }
    .war-end-countdown { color: #90caf9; font-family: monospace; font-size: 0.8rem; font-weight: 700; }
    .war-bar-track { width: 100%; height: 7px; background: #2a2a2a; border-radius: 4px; overflow: hidden; display: flex; }
    .war-bar-ally { background: #43a047; height: 100%; transition: width 0.4s ease; }
    .war-bar-enemy { background: #e53935; height: 100%; transition: width 0.4s ease; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; touch-action: pan-y; }
    @media (max-width: 850px) { .board { grid-template-columns: 1fr; } }
    .panel { background: #181818; border-radius: 6px; padding: 10px; border: 1px solid #2a2a2a; overflow-x: auto; contain: content; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2e2e2e; padding-bottom: 6px; margin-bottom: 6px; gap: 8px; }
    .panel-header-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; overflow: visible; }
    .panel-header h2 { margin: 0; font-size: 1rem; display: flex; align-items: center; min-width: 0; flex: 0 1 auto; overflow: hidden; }
    .faction-title-link { color: #fff; text-decoration: none; display: inline-flex; align-items: center; min-width: 0; max-width: 88px; }
    .faction-title-link:hover { opacity: 0.85; }
    .faction-tag { height: 22px; width: auto; max-width: 88px; object-fit: contain; display: block; }
    .faction-short-tag { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
    .master-alarm-btn, .clear-flags-btn {
      background: #252525;
      border: 1px solid #383838;
      color: #aaa;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 0.75rem;
      border-radius: 4px;
      height: 22px;
      line-height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .master-alarm-btn:hover, .clear-flags-btn:hover { background: #333; color: #fff; }
    .master-alarm-btn.alarm-active { background: rgba(253, 216, 53, 0.2); color: #fdd835; border-color: #fdd835; }
    .clear-flags-btn { margin-left: 4px; }
    .collapse-btn { background: #252525; color: #aaa; border: 1px solid #383838; padding: 2px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; flex-shrink: 0; }
    .collapse-btn:hover { background: #333; color: #fff; }
    .panel.collapsed table, .panel.collapsed .chain-badge { display: none; }
    .panel.collapsed { padding-bottom: 6px; border-style: dashed; }
    .chain-badge { font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #252525; color: #aaa; border: 1px solid #383838; white-space: nowrap; font-family: monospace; flex-shrink: 0; }
    .chain-active { background: rgba(46, 125, 50, 0.25); color: #81c784; border-color: #4caf50; }
    .chain-cooldown { background: #b3e5fc; color: #01579b; border-color: #4fc3f7; box-shadow: 0 0 6px rgba(179, 229, 252, 0.4); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; color: #888; font-weight: 600; padding: 4px 5px; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
    tbody tr { min-height: 26px; height: auto; }
    tbody tr:nth-child(odd) { background-color: #181818; }
    tbody tr:nth-child(even) { background-color: #202020; }
    tbody tr:hover { background-color: #2a2a2a; }
    tbody tr.row-flagged-med { background-color: #291719 !important; border-left: 3px solid #e57373; }
    tbody tr.row-flagged-on_it { background-color: #232528 !important; border-left: 3px solid #9e9e9e; }
    td { padding: 2px 5px; line-height: 1.25; white-space: nowrap; vertical-align: middle; }
    .player-stack { display: flex; flex-direction: column; justify-content: center; }
    .player-cell { display: flex; align-items: center; gap: 4px; max-width: 162px; line-height: 26px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-Online { background: #4caf50; }
    .dot-Idle { background: #ff9800; }
    .dot-Offline { background: #555; }
    a.player-link { color: #fff; text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
    a.player-link.revivable-on { color: #ff5252; font-weight: 700; animation: none; }
    a.player-link:hover { text-decoration: underline; color: #90caf9; }
    a.player-link.revivable-on:hover { color: #ff5252; }
    .last-act { color: #777; font-size: 0.72rem; flex-shrink: 0; }
    .alarm-btn { background: none; border: none; cursor: pointer; padding: 0; font-size: 0.75rem; opacity: 0.3; transition: opacity 0.2s; flex-shrink: 0; }
    .alarm-btn:hover { opacity: 0.7; }
    .alarm-btn.alarm-active { opacity: 1; filter: drop-shadow(0 0 3px rgba(253, 216, 53, 0.6)); }
    .flag-btn { background: none; border: none; cursor: pointer; padding: 0 2px; font-size: 0.78rem; font-weight: 700; line-height: 1; color: #777; opacity: 0.35; transition: opacity 0.15s, color 0.15s; flex-shrink: 0; }
    .flag-btn:hover { opacity: 0.85; color: #ddd; }
    .flag-btn.flag-med { opacity: 1; color: #ef9a9a; }
    .flag-btn.flag-on_it { opacity: 1; color: #bdbdbd; }
    .flag-subline { display: flex; align-items: center; gap: 3px; padding-left: 14px; font-size: 0.71rem; line-height: 1.15; padding-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
    .flag-subline.flag-med { color: #ffcdd2; }
    .flag-subline.flag-on_it { color: #cfd8dc; }
    .flag-arrow { color: #888; font-weight: 700; flex-shrink: 0; }
    .flag-by { color: #a5a5a5; overflow: hidden; text-overflow: ellipsis; }
    .flag-by-latest { color: #fff; font-weight: 700; }
    .Okay { color: #66bb6a; }
    .Hospital { color: #ef5350; font-weight: 600; }
    .Jail { color: #ffa726; font-weight: 600; }
    .Traveling { color: #42a5f5; }
    .Fallen { color: #757575; font-style: italic; }
    .timer { font-family: monospace; font-size: 0.82rem; padding: 1px 4px; border-radius: 3px; }
    .timer-flight { color: #90caf9; }
    .flag-elapsed { display: block; font-size: 0.62rem; color: #999; line-height: 1.1; margin-top: 1px; font-family: monospace; white-space: nowrap; }
    a.atk-btn { background: #7f1d1d; color: #e0e0e0; padding: 2px 7px; border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: 700; display: inline-block; line-height: 18px; }
    a.atk-btn:hover { background: #b71c1c; color: #fff; }
    @media (max-width: 480px) {
      body { padding: 6px; }
      table { font-size: 0.76rem; }
      td, th { padding: 0 3px; }
      .player-cell { max-width: 114px; }
      .flag-subline { max-width: 150px; }
      .timer { font-size: 0.75rem; padding: 1px 2px; }
      a.atk-btn { padding: 2px 5px; font-size: 0.72rem; }
      input { width: 110px; }
      .find-box { width: 82px; }
      .faction-tag { height: 20px; }
    }
    @keyframes flashYellow { 0%, 100% { background-color: rgba(253, 216, 53, 0.28); color: #fff59d; } 50% { background-color: transparent; color: #fdd835; } }
    @keyframes flashRed { 0%, 100% { background-color: rgba(229, 57, 53, 0.48); color: #ffffff; } 50% { background-color: transparent; color: #ff5252; } }
    @keyframes flashReady { 0%, 100% { background-color: #2e7d32; color: #ffffff; box-shadow: 0 0 6px rgba(76, 175, 80, 0.8); } 50% { background-color: #1b5e20; color: #a5d6a7; box-shadow: none; } }
    @keyframes flashLanded { 0%, 100% { background-color: rgba(76, 175, 80, 0.45); } 50% { background-color: rgba(76, 175, 80, 0.15); } }
    .timer-yellow-solid { background-color: rgba(253, 216, 53, 0.22); color: #fdd835; font-weight: bold; }
    .timer-yellow-slow { animation: flashYellow 1.6s infinite; font-weight: bold; }
    .timer-red-fast { animation: flashRed 0.65s infinite; font-weight: bold; }
    .atk-ready { animation: flashReady 1.5s infinite; }
    .row-landed { animation: flashLanded 1s ease infinite; }
    #lockScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    #lockScreen[hidden] { display: none !important; }
    .lock-card { width: min(440px, 100%); background: #181818; border: 1px solid #2a2a2a; border-radius: 8px; padding: 22px; }
    .lock-card h1 { margin: 0 0 8px; font-size: 1.05rem; font-weight: 600; text-align: center; }
    .lock-banner { display: block; width: 100%; height: auto; border-radius: 6px; margin-bottom: 14px; }
    .lock-card p { margin: 0; color: #aaa; font-size: 0.9rem; line-height: 1.45; }
    .lock-card input { width: 100%; margin: 14px 0; }
    .lock-actions { display: flex; gap: 8px; }
    .lock-error { color: #ef9a9a; min-height: 1.2em; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="lockScreen">
    <form class="lock-card" id="lockForm">
      <img class="lock-banner" src="razers.png" alt="Razers" />
      <h1>Welcome Razers, please input a public key.</h1>
      <input id="lockKey" type="password" autocomplete="off" placeholder="Public Torn API key" />
      <div class="lock-actions">
        <button type="submit" class="load-btn">Unlock</button>
        <button type="button" class="toggle-btn" id="lockShow">Show</button>
      </div>
      <p class="lock-error" id="lockError"></p>
    </form>
  </div>
  <div id="app" style="display:none">
  <div class="top-bar">
    <div class="tabs" id="factionTabs"></div>
    <div class="key-group">
      <input type="password" id="apiKey" autocomplete="on" placeholder="Public Torn API Key" />
      <button class="toggle-btn" id="toggleKeyBtn" onclick="toggleKeyVisibility()">Show</button>
      <select id="refreshIntervalSelect" onchange="updateRefreshInterval()">
        <option value="15000">15s (12 calls/min)</option>
        <option value="30000">30s (6 calls/min)</option>
        <option value="60000">1m (3 calls/min)</option>
        <option value="300000">5m (0.6 calls/min)</option>
      </select>
      <button class="load-btn" onclick="manualLoad()">Load</button>
    </div>
  </div>
  <div class="sub-bar">
    <span id="statusBar">Enter a Public Torn API key and click Load.</span>
    <span class="loc-badge" id="myLocBadge">Your Location: --</span>
  </div>
  <div class="war-banner" id="warBanner">
    <div class="war-scores-row">
      <span class="war-team-ally" id="warAllyScore">Razers: 0</span>
      <div class="war-center-info">
        <span class="lead-badge" id="warLeadBadge">Tied</span>
        <span class="target-text" id="warTargetText">Lead: 0 / 0 Target</span>
        <span class="war-end-countdown" id="warEndCountdown"></span>
      </div>
      <span class="war-team-enemy" id="warEnemyScore">0 :Opponent</span>
    </div>
    <div class="war-bar-track">
      <div class="war-bar-ally" id="warBarAlly" style="width: 50%;"></div>
      <div class="war-bar-enemy" id="warBarEnemy" style="width: 50%;"></div>
    </div>
  </div>
  <div class="board" id="swipeBoard">
    <div class="panel" id="allyPanel">
      <div class="panel-header">
        <div class="panel-header-left">
          <button class="collapse-btn" id="allyCollapseBtn" onclick="togglePanel('ally')">[-]</button>
          <h2><a id="allyTitleLink" class="faction-title-link" href="#" target="_blank" title="Razers">Razers</a></h2>
          <button class="master-alarm-btn" id="allyMasterBtn" onclick="toggleFactionMasterAlarm('ally')" title="Toggle All Ally Alarms">🔔 All</button>
          <button class="clear-flags-btn" onclick="clearFactionFlags('ally')" title="Clear every flag you set, on every faction">+⚔ Clear</button>
          <button class="clear-flags-btn" id="masterClearBtn" style="display:none" onclick="masterClearAllFlags()" title="Clear every flag on the two factions on this page">⚔ All</button>
        </div>
        <span class="chain-badge" id="allyChain">⛓️ --</span>
      </div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
          <tbody id="allyBody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel" id="enemyPanel">
      <div class="panel-header">
        <div class="panel-header-left">
          <button class="collapse-btn" id="enemyCollapseBtn" onclick="togglePanel('enemy')">[-]</button>
          <h2><a id="enemyTitleLink" class="faction-title-link" href="#" target="_blank" title="Warring Opponent">Opponent</a></h2>
          <button class="master-alarm-btn" id="enemyMasterBtn" onclick="toggleFactionMasterAlarm('enemy')" title="Toggle All Enemy Alarms">🔔 All</button>
          <button class="clear-flags-btn" onclick="clearFactionFlags('enemy')" title="Clear every flag you set, on every faction">+⚔ Clear</button>
        </div>
        <span class="chain-badge" id="enemyChain">⛓️ --</span>
      </div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Player</th><th>Lvl</th><th>Status</th><th>Timer</th><th>Action</th></tr></thead>
          <tbody id="enemyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  </div>
  <script>
    const OUR_FACTIONS = [
      { id: 40449, name: "Razers" },
      { id: 48277, name: "HellRazers" },
      { id: 48628, name: "OccamsRazers" },
      { id: 40385, name: "RazerResistance" }
    ];
    const FLAGS_DB_URL = "https://razerswartracker-default-rtdb.firebaseio.com";
    const FLAG_TTL_SEC = 600;
    const REVIVE_PACE_MS = 2500;

    const CITY_CODES = [
      { keys: ["torn"], code: "TC" },
      { keys: ["mexico", "mexican"], code: "MEX" },
      { keys: ["cayman"], code: "CAY" },
      { keys: ["canada", "canadian"], code: "CAN" },
      { keys: ["hawaii", "hawaiian"], code: "HAW" },
      { keys: ["united kingdom", "uk", "british"], code: "UK" },
      { keys: ["argentina", "argentinian"], code: "ARG" },
      { keys: ["switzerland", "swiss"], code: "SWI" },
      { keys: ["japan", "japanese"], code: "JAP" },
      { keys: ["china", "chinese"], code: "CHI" },
      { keys: ["uae", "emirates", "emirati"], code: "UAE" },
      { keys: ["south africa", "south african"], code: "SA" }
    ];
    let selectedFactionId = Number(sessionStorage.getItem("razers_tab")) || 40449;
    let homeDetected = Boolean(sessionStorage.getItem("razers_tab"));
    let myCityCode = "TC";
    let currentUserName = sessionStorage.getItem("razers_user_name") || "Razer";
    let currentUserId = Number(sessionStorage.getItem("razers_user_id") || 0);
    let cachedData = { ally: null, enemy: null };
    let activeWarInfo = null;
    let apiIntervalId = null;
    let reviveTimerId = null;
    let reviveBusy = false;
    let playerQuery = "";
    let liveCountdownNodes = [];
    let liveFlightNodes = [];
    const triggeredAlarms = new Set();
    let activeAlarms = {};
    try { activeAlarms = JSON.parse(localStorage.getItem("razers_alarms") || "{}"); } catch(e) { activeAlarms = {}; }

    let targetFlags = {};
    try { targetFlags = JSON.parse(localStorage.getItem("razers_target_flags") || "{}"); } catch(e) { targetFlags = {}; }

    // reviveCache[uid] = { revivable: boolean, at: number, hospUntil: number }
    // When revivable === true, it stays until a hospital check finds revivable === false.
    let reviveCache = {};
    try { reviveCache = JSON.parse(localStorage.getItem("razers_revive_cache") || "{}"); } catch(e) { reviveCache = {}; }

    let enemyHospTracker = {}; // uid -> { inHosp: boolean, until: number, checkedForUntil: number }

    function saveLocalFlags() {
      try { localStorage.setItem("razers_target_flags", JSON.stringify(targetFlags)); } catch(e) {}
    }

    function saveLocalRevives() {
      try { localStorage.setItem("razers_revive_cache", JSON.stringify(reviveCache)); } catch(e) {}
    }

    function pruneExpiredFlags() {
      const now = (Date.now() / 1000) | 0;
      let changed = false;
      for (const [uid, f] of Object.entries(targetFlags)) {
        if (!f || !f.type || !f.at || (now - f.at) >= FLAG_TTL_SEC) {
          delete targetFlags[uid];
          changed = true;
        }
      }
      if (changed) saveLocalFlags();
    }

    function updateEnemyHospitalTracker(enemyData) {
      if (!enemyData || !Array.isArray(enemyData.members)) return;
      for (let i = 0; i < enemyData.members.length; i++) {
        const m = enemyData.members[i];
        const id = String(m.id);
        const isHosp = m.rawState === "Hospital" && m.rawState !== "Fallen";
        const prev = enemyHospTracker[id] || { inHosp: false, until: 0, checkedForUntil: 0 };
        const hospMark = isHosp ? (Number(m.until) || 1) : 0;
        let checkedForUntil = prev.checkedForUntil || 0;
        if (isHosp && !prev.inHosp) {
          // Newly entered hospital: allow a fresh check for this hospital stint
          checkedForUntil = 0;
        } else if (isHosp && hospMark > 0 && checkedForUntil > 0 && hospMark > checkedForUntil + 15) {
          // Hospital timer extended significantly into a new stint
          checkedForUntil = 0;
        }
        enemyHospTracker[id] = {
          inHosp: isHosp,
          until: hospMark,
          checkedForUntil: checkedForUntil
        };
      }
    }

    function callerKey(uid, by) {
      return String(uid) + "\~" + encodeURIComponent(String(by || ""));
    }
    function splitFlagKey(key) {
      const s = String(key);
      const i = s.indexOf("\~");
      if (i === -1) return { uid: s, personal: false };
      return { uid: s.slice(0, i), personal: true };
    }
    function escHtml(s) {
      return String(s || "").replace(/[&<>"']/g, ch => {
        if (ch === "&") return "&" + "amp;";
        if (ch === "<") return "&" + "lt;";
        if (ch === ">") return "&" + "gt;";
        if (ch === '"') return "&" + "quot;";
        return "&" + "#39;";
      });
    }
    function getCalls(uid) {
      const id = String(uid);
      const calls = [];
      let legacy = null;
      for (const [k, f] of Object.entries(targetFlags)) {
        if (!f || (f.type !== "med" && f.type !== "on_it") || !f.by) continue;
        const p = splitFlagKey(k);
        if (p.uid !== id) continue;
        if (p.personal) calls.push(f);
        else legacy = f;
      }
      if (!calls.length && legacy) calls.push(legacy);
      calls.sort((a, b) => Number(b.at) - Number(a.at));
      return calls;
    }
    function migrateLegacy(id) {
      const bare = targetFlags[id];
      const hasPersonal = Object.keys(targetFlags).some(k => {
        const p = splitFlagKey(k);
        return p.personal && p.uid === id;
      });
      if (!hasPersonal && bare && bare.by) {
        const k = callerKey(id, bare.by);
        targetFlags[k] = { type: bare.type, by: bare.by, at: bare.at };
        pushFlagToRemote(k, targetFlags[k], true);
      }
    }
    function refreshPrimaryLocal(id) {
      const calls = getCalls(id);
      if (!calls.length) {
        delete targetFlags[id];
        return null;
      }
      const latest = { type: calls[0].type, by: calls[0].by, at: Number(calls[0].at) };
      targetFlags[id] = latest;
      return latest;
    }
    function isBeaverTamer() {
      return String(currentUserName || "").replace(/\s+/g, "").toLowerCase() === "beavertamer";
    }
    function canMasterClear() {
      if (isBeaverTamer()) return true;
      const fac = cachedData.ally;
      if (!fac || !currentUserId) return false;
      return currentUserId === Number(fac.leaderId) || currentUserId === Number(fac.coLeaderId);
    }
    function updateMasterClearVisibility() {
      const btn = document.getElementById("masterClearBtn");
      if (!btn) return;

        if (!res.ok) throw new Error("HTTP " + res.status);
        const remote = await res.json();
        const now = (Date.now() / 1000) | 0;
        const next = {};
        if (remote && typeof remote === "object") {
          for (const [uid, f] of Object.entries(remote)) {
            if (f && (f.type === "med" || f.type === "on_it") && f.by && f.at && (now - Number(f.at)) < FLAG_TTL_SEC) {

    async function syncRevivesFromRemote() {
      const base = getDbBaseUrl();
      if (!base) return;
      try {
        const res = await fetch(base + "/revives.json");
        if (!res.ok) return;
        const remote = await res.json();
        const next = { ...reviveCache };
        if (remote && typeof remote === "object") {
          for (const [uid, r] of Object.entries(remote)) {
            if (r && typeof r.revivable === "boolean") {
              const prev = next[String(uid)];
              const remoteAt = Number(r.at || 0);
              const prevAt = prev ? Number(prev.at || 0) : 0;
              if (!prev || remoteAt >= prevAt) {
                next[String(uid)] = {
                  revivable: r.revivable,
                  at: remoteAt || ((Date.now() / 1000) | 0),
                  hospUntil: Number(r.hospUntil || (prev && prev.hospUntil) || 0)
                };
              }
            }
          }
        }
        reviveCache = next;
        saveLocalRevives();
      } catch(e) {}
    }

    function getHospitalizedEnemiesToCheck() {
      if (!cachedData.enemy || !Array.isArray(cachedData.enemy.members)) return [];
      const queue = [];
      for (let i = 0; i < cachedData.enemy.members.length; i++) {
        const m = cachedData.enemy.members[i];
        if (m.rawState !== "Hospital" || m.rawState === "Fallen") continue;
        const id = String(m.id);
        const hospMark = Number(m.until) || 1;
        const tr = enemyHospTracker[id];
        const alreadyCheckedThisStint = Boolean(tr && tr.checkedForUntil > 0 && Math.abs(hospMark - tr.checkedForUntil) <= 15);
        const cached = reviveCache[id];
        const alreadyCheckedForUntil = Boolean(cached && cached.hospUntil > 0 && Math.abs(hospMark - Number(cached.hospUntil)) <= 15);
        if (!alreadyCheckedThisStint && !alreadyCheckedForUntil) {
          queue.push(m);
        }
      }
      return queue;
    }

    function clearFactionFlags() {
      const ids = new Set();
      Object.keys(targetFlags).forEach(k => {
        const f = targetFlags[k];
        if (f && f.by === currentUserName) ids.add(splitFlagKey(k).uid);
      });
      if (!ids.size) {
        statusBarEl.textContent = "No flags set by you";
        return;
      }
      let cleared = 0;
      ids.forEach(id => {
        Object.keys(targetFlags).forEach(k => {
          const p = splitFlagKey(k);
          if (!p.personal || p.uid !== id) return;
          const f = targetFlags[k];
          if (f && f.by === currentUserName) {
            delete targetFlags[k];
            pushFlagToRemote(k, null, true);
            cleared++;
          }
        });
        const personalLeft = Object.keys(targetFlags).some(k => {
          const p = splitFlagKey(k);
          return p.personal && p.uid === id;
        });
        const bare = targetFlags[id];
        if (!personalLeft && bare && bare.by === currentUserName) {
          delete targetFlags[id];
          pushFlagToRemote(id, null, true);
          cleared++;
          return;
        }
        const calls = getCalls(id);
        if (!calls.length) {
          if (targetFlags[id]) delete targetFlags[id];
          pushFlagToRemote(id, null, true);
        } else {
          const latest = { type: calls[0].type, by: calls[0].by, at: Number(calls[0].at) };
          targetFlags[id] = latest;
          pushFlagToRemote(id, latest, true);
        }
      });
      saveLocalFlags();
      renderTables();
      statusBarEl.textContent = "Cleared " + cleared + " of your flag(s) on every faction";
    }

      const profile = data.profile || {};
      const pName = profile.name || data.name;
      const pId = profile.id || profile.player_id || data.id || data.player_id || 0;
      if (pName || pId) rememberUser(pName, pId);
      return { factionId: Number(faction.id || faction.faction_id || profile.faction_id || 0), factionName: faction.name || faction.faction_name || "no faction", playerName: pName || "This key" };
    }
    function lockBoard(message) {
      clearSavedKey();
      keyInput.value = "";
      if (apiIntervalId) { clearInterval(apiIntervalId); apiIntervalId = null; }
      if (reviveTimerId) { clearInterval(reviveTimerId); reviveTimerId = null; }
      if (verifyTimer) { clearTimeout(verifyTimer); verifyTimer = null; }
      boardStarted = false;
      document.getElementById("app").style.display = "none";
      document.getElementById("lockScreen").hidden = false;
      lockError.textContent = message || "";
    }
    async function runVerify() {
      const key = keyInput.value.trim();
      if (!key) return;
      try {
        const who = await readOwner(key);
        if (!OUR_FACTIONS.some(f => f.id === who.factionId)) { lockBoard(who.playerName + " is no longer in a Razer faction."); return; }
        localStorage.setItem("razers_verified_at", String(Date.now()));
        if (who.factionId !== selectedFactionId) {
          selectedFactionId = who.factionId;
          sessionStorage.setItem("razers_tab", String(selectedFactionId));
          updateActiveTab();
        }
        scheduleVerify();
      } catch (err) {
        verifyTimer = setTimeout(runVerify, 30 * 60 * 1000);
      }
    }
    function openBoard(key) {
      document.getElementById("lockScreen").hidden = true;
      document.getElementById("app").style.display = "";
      keyInput.value = key;
      saveApiKey(key);
      if (!boardStarted) { boardStarted = true; setupApiInterval(); setupFlagsInterval(); setupReviveLoop(); }
      homeDetected = false;
      updateActiveTab();
      fetchAllData();
      scheduleVerify();
    }
    async function tryUnlock(raw) {
      const key = (raw || "").trim();
      if (!/^[A-Za-z0-9]{16,32}$/.test(key)) { lockError.textContent = "Enter the 16-character public key from Torn. Not your email login."; return; }
      lockError.textContent = "Checking…";
      try {
        const who = await readOwner(key);
        if (!OUR_FACTIONS.some(f => f.id === who.factionId)) {
          clearSavedKey();
          lockError.textContent = who.playerName + " is in " + (who.factionId ? who.factionName : "no faction") + ". Only Razers, HellRazers, OccamsRazers, and RazerResistance can open this board.";
          return;
        }
        localStorage.setItem("razers_verified_at", String(Date.now()));
        selectedFactionId = who.factionId;
        sessionStorage.setItem("razers_tab", String(selectedFactionId));
        openBoard(key);
      } catch (err) {
        lockError.textContent = (err && err.message) ? err.message : "Could not reach Torn.";
      }
    }
    document.getElementById("lockShow").onclick = function () {
      if (lockKeyInput.type === "password") { lockKeyInput.type = "text"; this.textContent = "Hide"; }
      else { lockKeyInput.type = "password"; this.textContent = "Show"; }
    };
    lockForm.addEventListener("submit", function (e) { e.preventDefault(); tryUnlock(lockKeyInput.value); });
    const savedKey = loadSavedApiKey();
    if (savedKey) {
      lockKeyInput.value = savedKey;
      if (verifiedAge() < VERIFY_MS) openBoard(savedKey);
      else tryUnlock(savedKey);
    }
  </script>
</body>
</html>
